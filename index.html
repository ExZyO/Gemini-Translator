    body {
      font-family: 'Inter', sans-serif;
      transition: background-color .3s, color .3s
    }

    html.dark body {
      background-color: #030712;
    }

    @keyframes toastIn {
      from {
        transform: translateX(100%);
        opacity: 0
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }

    @keyframes toastOut {
      from {
        transform: translateX(0);
        opacity: 1
      }

      to {
        transform: translateX(100%);
        opacity: 0
      }
    }

    .toast-enter {
      animation: toastIn .3s ease-out forwards
    }

    .toast-exit {
      animation: toastOut .3s ease-in forwards
    }

    .drop-zone-active {
      border: 3px dashed #6366f1 !important;
      background: rgba(99, 102, 241, .08) !important
    }

    .dark .drop-zone-active {
      background: rgba(99, 102, 241, .15) !important
    }

    *:focus-visible {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
      border-radius: 4px
    }

    .collapsible {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease-out
    }

    .collapsible.open {
      max-height: 5000px
    }

    /* Custom Scrollbar Styling */
    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.6);
    }
    .dark .custom-scrollbar {
      scrollbar-color: rgba(100, 116, 139, 0.5) transparent;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }

    @keyframes tooltipIn {
      from { opacity: 0; transform: translate(-50%, 4px) scale(0.96); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    .animate-tooltip {
      animation: tooltipIn .15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .animate-dropdown {
      animation: dropdownIn .15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fadeIn {
      animation: dropdownIn .15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* High-Contrast Select Dropdown, Optgroup & Option Styling */
    select optgroup {
      font-weight: 800 !important;
      font-style: normal !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
      font-size: 11px !important;
      padding-top: 8px !important;
      padding-bottom: 4px !important;
      color: #4f46e5 !important;
      background-color: #f1f5f9 !important;
    }
    .dark select optgroup {
      color: #93c5fd !important;
      background-color: #030712 !important;
    }

    select option {
      font-weight: 500 !important;
      font-style: normal !important;
      font-size: 13px !important;
      padding: 6px 12px !important;
      color: #0f172a !important;
      background-color: #ffffff !important;
    }
    .dark select option {
      color: #f8fafc !important;
      background-color: #0f172a !important;
    }
    .dark select option:checked {
      background-color: #2563eb !important;
      color: #ffffff !important;
    }
      html.dark body { background-color: #030712; }

<style>
/* ═══════════════════════════════════════════════════════════
   TWO LIGHTS — Phase 1 design system
   Iris = tool UI · Lamp = reader · OLED ground
   ═══════════════════════════════════════════════════════════ */
:root {
  --void: #000000;
  --ember: #0E0F12;
  --ember-2: #16181D;
  --hairline: #242730;
  --paper: #EDECF0;
  --paper-dim: #B8B6C2;
  --slate: #8A8F98;
  --iris: #7C87FF;
  --iris-deep: #5A66E8;
  --lamp: #FFB454;
  --lamp-deep: #C97A1E;
  --pine: #3EC6A0;
  --rose: #E5636F;
}
html { color-scheme: dark; }
html, body { background: var(--void); }
body {
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  color: var(--paper);
  -webkit-font-smoothing: antialiased;
}

/* ── Layout shells ── */
.tl-app { min-height: 100vh; background: var(--void); color: var(--paper); overflow-x: hidden; padding-bottom: 96px; }
.tl-wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
.tl-head { position: sticky; top: 0; z-index: 40; background: rgba(0,0,0,.86); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hairline); }
.tl-head-inner { max-width: 720px; margin: 0 auto; padding: 10px 16px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tl-title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.tl-subtitle { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--slate); margin-top: 2px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--hairline);
  background: var(--ember-2); color: var(--slate); display: inline-flex; align-items: center; justify-content: center;
  font-size: 15px; cursor: pointer;
}
.version-chip { font-size: 11px; font-weight: 700; color: var(--iris); border: 1px solid var(--hairline); background: var(--ember-2); border-radius: 10px; padding: 9px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.version-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pine); animation: pulse-dot 2s infinite; }
@keyframes pulse-dot { 50% { opacity: .4; } }

/* ── Cards / rows ── */
.card { border: 1px solid var(--hairline); border-radius: 16px; background: var(--ember); padding: 13px 16px; margin-bottom: 12px; }
.card-title { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--iris); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(36,39,48,.5); font-size: 12.5px; color: var(--paper-dim); }
.set-row:last-child { border-bottom: none; }
.set-row .r { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--slate); display: flex; align-items: center; gap: 8px; flex: none; }
.mini-input { width: 100%; border: 1px solid var(--hairline); background: var(--ember-2); border-radius: 10px; padding: 9px 11px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--paper-dim); margin-top: 8px; line-height: 1.6; caret-color: var(--iris); }
.mini-input::placeholder { color: var(--slate); }
textarea:focus, input:focus, select:focus { outline: 1px solid rgba(124,135,255,.45); outline-offset: 1px; }
.switch { width: 34px; height: 20px; border-radius: 99px; background: var(--ember-2); border: 1px solid var(--hairline); position: relative; flex: none; cursor: pointer; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--slate); transition: left .15s; }
.switch.on { background: rgba(124,135,255,.35); border-color: var(--iris-deep); }
.switch.on::after { left: 16px; background: var(--iris); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; padding: 2px 0 0; }
.seg-btn { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 9px; border: 1px solid var(--hairline); color: var(--slate); background: var(--ember-2); cursor: pointer; }
.seg-btn.on { color: var(--iris); border-color: var(--iris-deep); background: rgba(124,135,255,.12); }
.chip-act { font-size: 11px; font-weight: 600; color: var(--iris); border: 1px solid var(--hairline); border-radius: 8px; padding: 4px 9px; background: var(--ember-2); cursor: pointer; }
.pane-acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.count { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--slate); }

/* ── Translate workspace ── */
.langrow { display: flex; align-items: center; gap: 8px; padding: 4px 0 6px; }
.lang { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--hairline); background: var(--ember); font-size: 14px; font-weight: 600; color: var(--paper); appearance: none; -webkit-appearance: none; min-width: 0; }
.swap { width: 40px; height: 40px; flex: none; border-radius: 14px; border: 1px solid var(--hairline); background: var(--ember); color: var(--iris); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 15px; }
.meta { display: flex; justify-content: space-between; gap: 8px; padding: 0 2px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--slate); flex-wrap: wrap; }
.meta .chip { color: var(--paper-dim); }
.pane { margin: 0 0 12px; border: 1px solid var(--hairline); border-radius: 16px; background: var(--ember); display: flex; flex-direction: column; overflow: hidden; }
.pane-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px 8px; flex-wrap: wrap; }
.pane-head .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); }
.pane-textarea { width: 100%; border: none; background: transparent; color: var(--paper-dim); font-family: 'Literata', Georgia, serif; font-size: 14.5px; line-height: 1.8; padding: 0 16px 14px; resize: none; outline: none; min-height: 140px; }
.pane-textarea.out { color: var(--paper); }
.actionbar { display: flex; align-items: center; gap: 10px; padding: 8px 0 16px; }
.primary {
  flex: 1; height: 54px; border-radius: 16px; border: 1px solid var(--iris-deep);
  background: linear-gradient(180deg, #3A4178, #262B54);
  color: #E6E9FF; font-size: 15px; font-weight: 700; letter-spacing: .01em;
  display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  box-shadow: 0 0 30px rgba(124,135,255,.22), inset 0 1px 0 rgba(200,206,255,.28);
}
.primary.block { margin: 0 0 16px; }
.primary:disabled { opacity: .5; cursor: default; }
.overflow { width: 54px; height: 54px; border-radius: 16px; border: 1px solid var(--hairline); background: var(--ember); color: var(--slate); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.mini-btn { font-size: 11px; font-weight: 700; color: var(--iris); border: 1px solid var(--iris-deep); background: rgba(124,135,255,.1); border-radius: 9px; padding: 7px 12px; cursor: pointer; }
.mini-btn.ghost { color: var(--paper-dim); border-color: var(--hairline); background: var(--ember-2); }
.mini-btn.danger { color: var(--rose); border-color: rgba(229,99,111,.5); background: rgba(229,99,111,.08); }

/* ── Bottom nav ── */
.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; display: flex; border-top: 1px solid var(--hairline); background: rgba(10,10,13,.92); backdrop-filter: blur(14px); padding: 10px 8px 18px; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: var(--slate); background: none; border: none; cursor: pointer; }
.nav-item.active { color: var(--iris); }
.nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.active svg { filter: drop-shadow(0 0 6px rgba(124,135,255,.5)); }

/* ── Bottom sheet ── */
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet { border-top: 1px solid var(--hairline); background: var(--ember); border-radius: 22px 22px 0 0; padding: 10px 18px 26px; max-height: 70vh; overflow-y: auto; }
.sheet-handle { width: 40px; height: 4px; border-radius: 99px; background: var(--hairline); margin: 0 auto 12px; }
.sheet-lbl { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--slate); padding: 8px 4px 4px; }
.sheet-row { display: flex; align-items: center; gap: 10px; padding: 13px 6px; border-bottom: 1px solid rgba(36,39,48,.6); font-size: 13.5px; color: var(--paper-dim); background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; cursor: pointer; }
.sheet-row:last-child { border-bottom: none; }
.sheet-row .ic { width: 20px; text-align: center; color: var(--iris); flex: none; }
.sheet-row .chev { margin-left: auto; color: var(--slate); font-size: 10px; }

/* ── Toast / confirm ── */
.toast-wrap { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 380px); align-items: center; pointer-events: none; }
.toast { padding: 12px 18px; border-radius: 14px; border: 1px solid var(--hairline); background: var(--ember-2); color: var(--paper); font-size: 13px; font-weight: 600; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
.toast.error { border-color: rgba(229,99,111,.5); color: #F3A7AE; }
.toast.info { border-color: rgba(124,135,255,.4); color: #B9C0FF; }
.toast.success { border-color: rgba(62,198,160,.4); color: #9BE8D4; }
.confirm-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 130; display: flex; align-items: center; justify-content: center; padding: 24px; }
.confirm-box { background: var(--ember); border: 1px solid var(--hairline); border-radius: 20px; padding: 24px 22px; max-width: 340px; width: 100%; box-shadow: 0 24px 80px rgba(0,0,0,.7); }
.confirm-box p { font-size: 14px; font-weight: 600; text-align: center; color: var(--paper); margin-bottom: 20px; line-height: 1.5; }
.confirm-actions { display: flex; gap: 10px; justify-content: center; }

/* ── Importer / Studio ── */
.url-input { width: 100%; border: 1px solid var(--hairline); background: var(--ember); border-radius: 14px; padding: 14px 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--paper-dim); margin-bottom: 12px; outline: none; }
.url-input:focus { border-color: var(--iris-deep); }
.status-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 11px; color: var(--pine); font-family: 'IBM Plex Mono', monospace; }
.mini-progress { flex: 1; height: 4px; background: var(--ember-2); border-radius: 99px; overflow: hidden; }
.mini-progress i { display: block; height: 100%; width: 30%; background: var(--iris-deep); }
.note-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; padding: 12px 14px; border: 1px solid var(--hairline); border-radius: 12px; background: var(--ember); font-size: 12.5px; color: var(--paper-dim); }
.note-row .hint { color: var(--slate); font-size: 10.5px; }
.book-card { margin-bottom: 12px; border: 1px solid var(--hairline); border-radius: 14px; background: var(--ember); padding: 14px 16px; }
.book-card .t { font-family: 'Literata', Georgia, serif; font-size: 15px; color: var(--paper); margin-bottom: 3px; }
.book-card .m { font-size: 11px; color: var(--slate); margin-bottom: 10px; }
.book-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.src-chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.src-chip { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: var(--slate); border: 1px solid var(--hairline); border-radius: 8px; padding: 4px 8px; }
.seg-wide { display: flex; margin-bottom: 12px; border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; background: var(--ember); }
.seg-wide span { flex: 1; text-align: center; padding: 12px 6px; font-size: 12px; font-weight: 700; color: var(--slate); cursor: pointer; }
.seg-wide span.on { color: var(--iris); background: rgba(124,135,255,.12); }
.studio-host { border: 1px solid var(--hairline); border-radius: 16px; background: var(--ember); padding: 14px 16px; min-height: 300px; }
/* ── Studio injected UI harmonization (old slate classes → Two Lights) ── */
.studio-host [class*="bg-white"], .studio-host [class*="bg-slate-50"], .studio-host [class*="bg-slate-100"] { background-color: var(--ember) !important; color: var(--paper-dim) !important; }
.studio-host [class*="bg-slate-200"], .studio-host [class*="bg-slate-300"] { background-color: var(--ember-2) !important; }
.studio-host [class*="text-slate-900"], .studio-host [class*="text-gray-900"], .studio-host [class*="text-black"] { color: var(--paper) !important; }
.studio-host [class*="text-slate-400"], .studio-host [class*="text-slate-500"], .studio-host [class*="text-gray-400"], .studio-host [class*="text-gray-500"] { color: var(--slate) !important; }
.studio-host [class*="text-slate-600"], .studio-host [class*="text-slate-700"], .studio-host [class*="text-slate-800"] { color: var(--paper-dim) !important; }
.studio-host [class*="border-slate-200"], .studio-host [class*="border-slate-300"], .studio-host [class*="border-gray-200"], .studio-host [class*="border-gray-300"] { border-color: var(--hairline) !important; }
.studio-host [class*="bg-indigo-600"] { background-color: var(--iris-deep) !important; }
.studio-host input[type="text"], .studio-host input:not([type]), .studio-host textarea, .studio-host select { background-color: var(--ember-2) !important; color: var(--paper-dim) !important; border-color: var(--hairline) !important; }
.studio-host button[class*="text-white"] { color: #E6E9FF !important; }
.studio-host .cap { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--slate); }
.studio-host .tl-field { width: 100%; background: var(--ember-2); border: 1px solid var(--hairline); border-radius: 10px; padding: 9px 12px; font-size: 12.5px; color: var(--paper-dim); outline: none; }
.studio-host .tl-field:focus { border-color: var(--iris-deep); }
.studio-host .tl-drop { border: 1.5px dashed var(--hairline); border-radius: 16px; padding: 28px 16px; text-align: center; cursor: pointer; background: rgba(14,15,18,.6); }
.studio-host .tl-drop:hover { border-color: var(--iris-deep); }
.studio-host .tl-btn { font-size: 11.5px; font-weight: 700; color: var(--paper-dim); border: 1px solid var(--hairline); background: var(--ember-2); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.studio-host .tl-btn.primary { color: #E6E9FF; background: linear-gradient(180deg, #3A4178, #262B54); border-color: var(--iris-deep); }
.studio-host .tl-btn.accent { color: #E6E9FF; background: var(--iris-deep); border-color: var(--iris-deep); }
.studio-host .tl-btn.danger { color: var(--rose); border-color: rgba(229,99,111,.5); }
.studio-host .tl-check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--paper-dim); cursor: pointer; }
.studio-host .tl-check input { accent-color: var(--iris); width: 15px; height: 15px; }
.studio-host .tl-console { background: #050608; border: 1px solid var(--hairline); border-radius: 12px; padding: 10px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--slate); }
.studio-host .tl-list { border: 1px solid var(--hairline); border-radius: 12px; background: rgba(14,15,18,.6); }
.studio-host .ring-4 { box-shadow: 0 0 0 3px rgba(124,135,255,.5) !important; }
.studio-host .ring-indigo-400 { border-color: var(--iris) !important; }
.studio-host .stu-sec { padding: 16px 0; border-bottom: 1px solid var(--hairline); }
.studio-host .stu-sec:first-of-type { padding-top: 8px; }

/* ── Glossary editor ── */

<body>
  <div id="root"></div>
  <script src="native-bridge.js"></script>
  <script src="utils.js"></script>

  <script src="web_importer.js"></script>
  <script>
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const h = React.createElement;
    window.studioSubTab = 'split';

    // Bulletproof Lucide Icon Component Factory (Dynamic UMD Adapter)
    const createLucideIcon = (name) => {
      return function IconComponent(props) {
        const size = (props && props.size) || 18;
        const className = (props && props.className) || '';
        const nameKebab = String(name || '').replace(/([A-Z])/g, '-$1').toLowerCase().replace(/^-/, '');
        const nameLower = String(name || '').toLowerCase();
        const iconDef = (window.LUCIDE_ICONS && (
          window.LUCIDE_ICONS[name] ||
          window.LUCIDE_ICONS[nameLower] ||
          window.LUCIDE_ICONS[nameKebab]
        )) || (window.lucide && (
          window.lucide[name] ||
          window.lucide[nameLower] ||
          window.lucide[nameKebab] ||
          (window.lucide.icons && (
            window.lucide.icons[name] ||
            window.lucide.icons[nameLower] ||
            window.lucide.icons[nameKebab]
          ))
        )) || [];
        return h('svg', {
          xmlns: 'http://www.w3.org/2000/svg',
          width: size,
          height: size,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: '2',
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className
        },
          iconDef.map((el, i) => h(el[0], { key: i, ...el[1] }))
        );
      };
    };

    const LucideIcons = new Proxy({}, {
      get: (target, prop) => {
        if (!target[prop]) target[prop] = createLucideIcon(prop);
        return target[prop];
      }
    });

    const iconNamesList = [
      'Download', 'Clipboard', 'Link', 'BookText', 'FileText', 'XCircle', 'Copy',
      'Loader2', 'Eye', 'EyeOff', 'RefreshCcw', 'Save', 'Upload', 'Sun', 'Moon',
      'Columns2', 'Rows2', 'History', 'ChevronDown', 'ChevronUp', 'Zap', 'X',
      'CheckCircle2', 'AlertCircle', 'Info', 'Search', 'Trash2', 'RotateCcw',
      'Square', 'FileDown', 'Settings', 'Globe', 'Sparkles', 'Brain', 'Languages',
      'Check', 'ArrowRightLeft', 'Star', 'Clock', 'Layers', 'Scissors', 'Sliders',
      'Plus', 'Minus', 'Maximize2', 'Minimize2', 'BookOpen', 'Library', 'Key', 'Shield', 'Lock', 'Unlock',
      'Calendar', 'ArrowUpDown', 'CalendarDays', 'Volume2', 'VolumeX', 'Play', 'Pause',
      'SkipForward', 'SkipBack', 'MoreVertical', 'Type', 'Palette', 'List', 'Compass',
      'Bookmark', 'Menu', 'ArrowLeft', 'ArrowRight', 'Maximize', 'Minimize', 'ChevronsUp', 'ChevronsDown'
    ];
    iconNamesList.forEach(name => {
      window[name] = LucideIcons[name] || createLucideIcon(name);
    });

    const { Download, Clipboard, Link, BookText, FileText, XCircle, Copy, Loader2, Eye, EyeOff, RefreshCcw, Save, Upload, Sun, Moon, Columns2, Rows2, History, ChevronDown, ChevronUp, Zap, X, CheckCircle2, AlertCircle, Info, Search, Trash2, RotateCcw, Square, FileDown, Settings, Globe, Sparkles, Brain, Languages, Check, ArrowRightLeft, Star, Clock, Layers, Scissors, Sliders, Plus, Minus, Maximize2, Minimize2, BookOpen, Key, Shield, Lock, Unlock, Calendar, ArrowUpDown, Volume2, VolumeX, Play, Pause, SkipForward, SkipBack, MoreVertical, Type, Palette, List, Compass, Bookmark, Menu, ArrowLeft, ArrowRight, Maximize, Minimize } = window;

    // XML Escaper for EPUB Packaging
    function escapeXml(unsafe) {
      if (unsafe === null || unsafe === undefined) return '';
      return String(unsafe)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&apos;');
    }
    window.escapeXml = escapeXml;

    const ic = (Icon, size = 18, className = 'shrink-0') => {
      let comp = Icon;
      if (typeof Icon === 'string') {
        comp = LucideIcons[Icon] || window[Icon] || createLucideIcon(Icon);
      } else if (!comp) {
        comp = LucideIcons['FileText'] || LucideIcons['BookText'] || 'span';
      }
      return h(comp || 'span', { size, className });
    };
    const btn = (props, ...ch) => h('button', props, ...ch);
    // Studio UI components mounted from window.splitHtml, window.mergeHtml, window.modalHtml

    // Global PWA install prompt handler to catch event before React renders
    let globalDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      globalDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });

    // ═══════════════════════════════════════
    // CONSTANTS
    // ═══════════════════════════════════════
    const VERSION = '8.5.1';
    const MAX_PAYLOAD = 12000;
    const PROMPT_OVERHEAD = 800;
    const MAX_HISTORY = 20;
    const DEFAULT_CONCURRENCY = 3;
    const LANGUAGES = ['Auto-detect', 'English', 'Spanish', 'French', 'German', 'Italian', 'Portuguese', 'Chinese (Simplified)', 'Chinese (Traditional)', 'Japanese', 'Korean', 'Russian', 'Arabic', 'Hindi', 'Bengali', 'Urdu', 'Vietnamese', 'Turkish', 'Polish', 'Dutch', 'Swedish', 'Norwegian', 'Danish', 'Finnish', 'Greek', 'Hebrew', 'Thai', 'Indonesian', 'Malay', 'Filipino', 'Romanian', 'Hungarian', 'Czech', 'Slovak', 'Bulgarian', 'Serbian', 'Croatian', 'Ukrainian', 'Lithuanian', 'Latvian', 'Estonian', 'Slovenian', 'Catalan', 'Basque', 'Galician'];
    const TARGET_LANGUAGES = LANGUAGES.filter(l => l !== 'Auto-detect');

    const DEEPL_LANG_MAP = { 'English': 'EN', 'Spanish': 'ES', 'French': 'FR', 'German': 'DE', 'Italian': 'IT', 'Portuguese': 'PT', 'Chinese (Simplified)': 'ZH', 'Chinese (Traditional)': 'ZH', 'Japanese': 'JA', 'Korean': 'KO', 'Russian': 'RU', 'Arabic': 'AR', 'Hindi': 'HI', 'Vietnamese': 'VI', 'Turkish': 'TR', 'Polish': 'PL', 'Dutch': 'NL', 'Swedish': 'SV', 'Norwegian': 'NB', 'Danish': 'DA', 'Finnish': 'FI', 'Greek': 'EL', 'Hebrew': 'HE', 'Indonesian': 'ID', 'Romanian': 'RO', 'Hungarian': 'HU', 'Czech': 'CS', 'Slovak': 'SK', 'Bulgarian': 'BG', 'Serbian': 'SR', 'Croatian': 'HR', 'Ukrainian': 'UK', 'Lithuanian': 'LT', 'Latvian': 'LV', 'Estonian': 'ET', 'Slovenian': 'SL' };
    const LIBRE_LANG_MAP = { 'English': 'en', 'Spanish': 'es', 'French': 'fr', 'German': 'de', 'Italian': 'it', 'Portuguese': 'pt', 'Chinese (Simplified)': 'zh', 'Chinese (Traditional)': 'zt', 'Japanese': 'ja', 'Korean': 'ko', 'Russian': 'ru', 'Arabic': 'ar', 'Hindi': 'hi', 'Vietnamese': 'vi', 'Turkish': 'tr', 'Polish': 'pl', 'Dutch': 'nl', 'Swedish': 'sv', 'Norwegian': 'nb', 'Danish': 'da', 'Finnish': 'fi', 'Greek': 'el', 'Hebrew': 'he', 'Indonesian': 'id', 'Filipino': 'tl', 'Romanian': 'ro', 'Hungarian': 'hu', 'Czech': 'cs', 'Slovak': 'sk', 'Bulgarian': 'bg', 'Serbian': 'sr', 'Croatian': 'hr', 'Ukrainian': 'uk' };
            const DEFAULT_GEMINI_MODELS = [
      { id: 'gemini-3.8-flash', name: 'Gemini 3.8 Flash (Latest Flagship · Fast & Literary)' },
      { id: 'gemini-3.7-flash', name: 'Gemini 3.7 Flash (Flagship Hybrid & Fast)' },
      { id: 'gemini-3.6-flash', name: 'Gemini 3.6 Flash (Official 2026 Recommended)' },
      { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash (Ultra Fast)' },
      { id: 'gemini-3.5-flash-lite', name: 'Gemini 3.5 Flash-Lite (Highest Free Quota)' },
      { id: 'gemini-3.1-flash-lite', name: 'Gemini 3.1 Flash-Lite (High Quota & Fast)' },
      { id: 'gemini-3.1-pro-preview', name: 'Gemini 3.1 Pro (Deep Literary Reasoning)' },
      { id: 'gemini-3-flash-preview', name: 'Gemini 3 Flash (Preview)' }
    ];

    const DEFAULT_DEEPSEEK_MODELS = [
      { id: 'deepseek-chat', name: 'DeepSeek V3 / V4 Chat (Ultra Fast & Cheap)' },
      { id: 'deepseek-reasoner', name: 'DeepSeek R1 / V4 Pro (Deep Reasoning)' }
    ];

    const estimateTokens = (text) => {
      if (!text) return 0;
      const cjkMatch = text.match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g) || [];
      const nonCjk = text.replace(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g, '');
      const words = nonCjk.trim().split(/\s+/).filter(Boolean);
      return Math.ceil(cjkMatch.length * 1.2 + words.length * 1.3);
    };

    const estimateCost = (tokens, modelId = 'gemini-3.7-flash', provider = 'gemini') => {
      let perMillion = 0.075;
      if (provider === 'deepseek') {
        if (modelId === 'deepseek-reasoner') perMillion = 0.55;
        else perMillion = 0.14;
      } else {
        if (modelId.includes('3.1-pro') || modelId.includes('pro')) perMillion = 1.25;
        else if (modelId.includes('flash-lite') || modelId.includes('8b')) perMillion = 0.0375;
        else if (modelId.includes('3.7-flash') || modelId.includes('3.6-flash') || modelId.includes('3.5-flash') || modelId.includes('3-flash')) perMillion = 0.075;
      }
      return ((tokens / 1000000) * perMillion).toFixed(4);
    };

    const calculateRealCost = (promptTokens, outputTokens, modelId = 'gemini-3.7-flash', provider = 'gemini') => {
      window.calculateRealCost = calculateRealCost;
      let inPerM = 0.075;
      let outPerM = 0.30;
      if (provider === 'deepseek') {
        if (modelId === 'deepseek-reasoner') {
          inPerM = 0.55;
          outPerM = 2.19;
        } else {
          inPerM = 0.14;
          outPerM = 0.28;
        }
      } else {
        if (modelId.includes('3.1-pro') || modelId.includes('pro')) {
          inPerM = 1.25;
          outPerM = 5.00;
        } else if (modelId.includes('flash-lite') || modelId.includes('8b')) {
          inPerM = 0.0375;
          outPerM = 0.15;
        } else {
          inPerM = 0.075;
          outPerM = 0.30;
        }
      }
      const cost = ((promptTokens / 1000000) * inPerM) + ((outputTokens / 1000000) * outPerM);
      return cost < 0.0001 && cost > 0 ? '$0.0001' : `$${cost.toFixed(4)}`;
    };

    // ═══════════════════════════════════════
    // INDEXEDDB ENGINE (High-Capacity Storage)
    // ═══════════════════════════════════════
    const DB_NAME = 'GeminiTranslatorDB';
    const DB_VERSION = 1;

    const openAppDB = () => {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        try {
          const req = window.indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('history')) {
              db.createObjectStore('history', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('glossaries')) {
              db.createObjectStore('glossaries', { keyPath: 'name' });
            }
            if (!db.objectStoreNames.contains('kv')) {
              db.createObjectStore('kv', { keyPath: 'key' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    };

    const dbGetAll = async (storeName) => {
      const db = await openAppDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    };

    const dbPut = async (storeName, value) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(value);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    const dbDelete = async (storeName, key) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    const dbClear = async (storeName) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.clear();
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    // ═══════════════════════════════════════
    // BACKGROUND WEB WORKER BRIDGE (Zero UI Stutter)
    // ═══════════════════════════════════════
    let appWorker = null;
    let workerMsgId = 0;
    const workerCallbacks = new Map();

    const initAppWorker = () => {
      try {
        if (typeof window !== 'undefined' && window.Worker && !appWorker) {
          appWorker = new Worker('./worker.js');
          appWorker.onmessage = (e) => {
            const { id, success, error, ...rest } = e.data || {};
            if (workerCallbacks.has(id)) {
              const { resolve, reject } = workerCallbacks.get(id);
              workerCallbacks.delete(id);
              if (success) resolve(rest);
              else reject(new Error(error || 'Worker operation failed'));
            }
          };
          appWorker.onerror = (err) => {
            console.warn('Worker error:', err);
          };
        }
      } catch (e) {
        console.warn('Web Worker not available, falling back seamlessly to main thread:', e);
      }
    };

    const callWorker = (type, payload) => {
      return new Promise((resolve, reject) => {
        try {
          if (!appWorker) initAppWorker();
          if (!appWorker) return resolve(null);
          const id = ++workerMsgId;
          workerCallbacks.set(id, { resolve, reject });
          appWorker.postMessage({ id, type, payload });
        } catch (e) {
          resolve(null);
        }
      });
    };

    const formatDuration = (ms) => {
      if (!ms || ms <= 0) return '0.0s';
      const totalSec = ms / 1000;
      if (totalSec < 1) {
        return `${totalSec.toFixed(2)}s`;
      }
      if (totalSec < 60) {
        return `${totalSec.toFixed(1)}s`;
      }
      const totalMin = Math.floor(totalSec / 60);
      const remSec = Math.floor(totalSec % 60);
      if (totalMin < 60) {
        return `${totalMin}m ${remSec}s`;
      }
      const totalHours = Math.floor(totalMin / 60);
      const remMin = totalMin % 60;
      if (totalHours < 24) {
        return `${totalHours}h ${remMin}m ${remSec}s`;
      }
      const days = Math.floor(totalHours / 24);
      const remHours = totalHours % 24;
      return `${days}d ${remHours}h ${remMin}m`;
    };

    // ═══════════════════════════════════════
    // UTILITY FUNCTIONS
    // ═══════════════════════════════════════
    const fetchRetry = async (url, opts, retries = 3, timeoutMs = 45000) => {
      let delay = 1500;
      for (let i = 0; i < retries; i++) {
        if (opts?.signal?.aborted) {
          const err = new Error('Translation paused.');
          err.name = 'AbortError';
          throw err;
        }

        const attemptController = new AbortController();
        let timeoutId = setTimeout(() => {
          attemptController.abort(new Error('Request timed out (45s).'));
        }, timeoutMs);

        const onParentAbort = () => {
          clearTimeout(timeoutId);
          attemptController.abort(opts.signal?.reason || new Error('Translation paused.'));
        };

        if (opts?.signal) {
          opts.signal.addEventListener('abort', onParentAbort, { once: true });
        }

        try {
          const fetchOpts = { ...opts, signal: attemptController.signal };
          const r = await fetch(url, fetchOpts);
          clearTimeout(timeoutId);
          if (opts?.signal) opts.signal.removeEventListener('abort', onParentAbort);

          if (r.status === 429) {
            const errText = await r.text().catch(() => '');

      if (instructions && instructions.trim()) {

      if (context !== undefined) {
        p = `=== PREVIOUS CHAPTER CONTEXT ===\n${context || 'None yet.'}\n=== END CONTEXT ===\n\nUse this context to maintain strict continuity in character names, gender pronouns (he/she), and tone.\n\n` + p;

    const cleanNovelProse = (text) => {
      if (!text) return '';
      let t = text;
      // Decode HTML entities left by web imports or model output, including numeric entities such as &#x20;.
      if (typeof document !== 'undefined') {
        const entityDecoder = document.createElement('textarea');
        t = t.replace(/&(?:#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos|nbsp);/gi, entity => {
          entityDecoder.innerHTML = entity;
          return entityDecoder.value;
        });
      }
      t = t.replace(/\u00a0/g, ' ');
      // Clean standalone markdown italic sound effects like *Rip!*, *Crack!*, *Whoosh!*
      t = t.replace(/^(\s*)\*([A-Za-z0-9!?,.\s'-]{1,30})\*(\s*)$/gm, '$1$2$3');
      // Strip residual web navigation artifacts
      t = t.replace(/^\s*(?:Previous Chapter|Next Chapter|Table of Contents|Prev|Next|TOC|Back to Top|Share this:?|Like this:?|Related|Loading\.\.\.|Leave a (?:Reply|Comment)|Click here to .+)\s*$/gim, '');
      // Strip residual WordPress / Tumblr / social widget lines
      t = t.replace(/^\s*(?:Advertisements?|Sponsored|Share on (?:Facebook|Twitter|Reddit)|Follow us on .+|Join our Discord.+|Support (?:us|me) on .+|Donate .+|Patreon .+|Buy me a coffee.+)\s*$/gim, '');
      // Strip orphaned HTML tags
      t = t.replace(/<\/?(?:div|span|br|a|img|script|style|iframe|button|input|form|nav|header|footer|aside|section|figure|figcaption)[^>]*>/gi, '');

      t = t.replace(/\n{3,}/g, '\n\n');
      // Fix broken hyphenation from OCR/web scrape (e.g. "trans-\nlation" -> "translation")
      t = t.replace(/(\w)-\s*\n\s*(\w)/g, '$1$2');
      // Normalize straight quotes to smart quotes
      t = t.replace(/"([^"]*?)"/g, '\u201c$1\u201d');
      t = t.replace(/(\w)'(\w)/g, '$1\u2019$2');
      // Normalize dashes and ellipsis
      t = t.replace(/---?/g, '\u2014');
      t = t.replace(/\.{3,}/g, '\u2026');
      // Remove accidental whitespace after opening quotation marks and at line edges.
      t = t.replace(/([\u201c\u2018"])\s+(?=[A-Za-z])/g, '$1');
      t = t.replace(/[ \t]+\n/g, '\n').replace(/\n[ \t]+/g, '\n');

      t = t.replace(/([.!?\u2026]+)(["'\u201d\u2019)]?)(?=[A-Za-z])/g, '$1$2 ');
      return t.trim();
    };

    const parseTranslationOutput = (rawText, context, usage = null) => {

        }

      }

    };

        return /^(?:preface|prologue|afterword|epilogue|postscript)$/i.test(plain) ||

        const clean = [];
        parts.forEach(part => {
          if (!part || part === '.') return;

        });
        return clean.join('/');

        const cleanHref = String(href || '').split('#')[0].split('?')[0];
        const base = normalizePath(filePath).split('/');
        base.pop();
        return normalizePath(base.concat(cleanHref.split('/')).join('/'));
      };

        const containerDoc = new DOMParser().parseFromString(await containerFile.async('text'), 'text/xml');
        const opfPath = containerDoc.querySelector('rootfile')?.getAttribute('full-path');
        if (!opfPath) return;
        const opfFile = zip.file(opfPath);
        if (!opfFile) return;
        const opfDoc = new DOMParser().parseFromString(await opfFile.async('text'), 'text/xml');
        const titleByPath = new Map();
        translatedChapters.forEach(ch => {
          if (ch?.zipPath && ch?.title) titleByPath.set(normalizePath(ch.zipPath), String(ch.title).trim());
        });
        if (!titleByPath.size) return;

        const manifestItems = Array.from(opfDoc.querySelectorAll('manifest item'));
        const navItem = manifestItems.find(item => item.getAttribute('properties')?.split(/\s+/).includes('nav'));
        const ncxItem = manifestItems.find(item => item.getAttribute('media-type') === 'application/x-dtbncx+xml');

        if (navItem?.getAttribute('href')) {
          const navPath = resolveArchivePath(opfPath, navItem.getAttribute('href'));
          const navFile = zip.file(navPath);
          if (navFile) {
            const navDoc = new DOMParser().parseFromString(await navFile.async('text'), 'text/xml');
            navDoc.querySelectorAll('a[href]').forEach(anchor => {
              const title = titleByPath.get(resolveArchivePath(navPath, anchor.getAttribute('href')));
              if (title) anchor.textContent = title;
            });
            zip.file(navPath, serializer.serializeToString(navDoc));
          }
        }

              }

          const chFilename = `${chId}.xhtml`;
          const chTitle = ch.title ? ch.title.trim() : `Chapter ${idx + 1}`;

          manifestItems.push(`<item id="${chId}" href="${chFilename}" media-type="application/xhtml+xml"/>`);
          spineItems.push(`<itemref idref="${chId}"/>`);
          tocNavPoints.push(`
  <navPoint id="nav_${chId}" playOrder="${idx + 1}">
    <navLabel><text>${escapeXml(chTitle)}</text></navLabel>
    <content src="${chFilename}"/>
  </navPoint>`);
          tocNavLinks.push('  <li><a href="' + chFilename + '">' + escapeXml(chTitle) + '</a></li>');

          const rawLines = ch.content.split(/\r?\n/);
          const bodyHtml = [];
          bodyHtml.push(`<h1>${escapeXml(chTitle)}</h1>`);
          const chapterTitleKey = chTitle.replace(/\s+/g, ' ').trim().toLocaleLowerCase();
          const seenHeadings = new Set();

          // Smart typographic formatter
          const smartFormat = (raw) => {
            let s = escapeXml(raw);
            if (useSmartQuotes) {
              // Smart quotes: "..." -> curly double quotes
              s = s.replace(/&quot;([^&]*?)&quot;/g, '\u201c$1\u201d');
              // Straight double quotes fallback
              s = s.replace(/"([^"]*?)"/g, '\u201c$1\u201d');
              // Smart single quotes / apostrophes
              s = s.replace(/(\w)&apos;(\w)/g, '$1\u2019$2'); // it's, don't
              s = s.replace(/&apos;([^&]*?)&apos;/g, '\u2018$1\u2019');
            }
            // Normalize dashes: -- or --- to em-dash
            s = s.replace(/---?/g, '\u2014');
            // Normalize triple dots to proper ellipsis
            s = s.replace(/\.{3,}/g, '\u2026');
            // Bold: **text** or __text__
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
            // Italic: *text* or _text_ (single, not inside words)
            s = s.replace(/(?<!\w)\*([^*]+)\*(?!\w)/g, '<em>$1</em>');
            s = s.replace(/(?<!\w)_([^_]+)_(?!\w)/g, '<em>$1</em>');
            return s;
          };

          for (let li = 0; li < rawLines.length; li++) {
            const trimmed = rawLines[li].trim();
            if (!trimmed) continue;

            // Markdown headings: render them and remove duplicate title echoes from scraped pages.
            const headingMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
            if (headingMatch) {
              const headingText = headingMatch[2].trim();
              const headingKey = headingText.replace(/\s+/g, ' ').toLocaleLowerCase();
              if (headingKey === chapterTitleKey || seenHeadings.has(headingKey)) continue;
              seenHeadings.add(headingKey);
              const headingLevel = headingMatch[1].length <= 2 ? 2 : 3;
              bodyHtml.push('<h' + headingLevel + '>' + smartFormat(headingText) + '</h' + headingLevel + '>');
              continue;
            }

            // Illustration
            const imgMatch = trimmed.match(/^!\[(.*?)\]\((https?:\/\/[^\)]+)\)$/);
            if (imgMatch) {
              if (!useIncludeImages) continue;
              const altText = imgMatch[1] || 'Illustration';
              const imgUrl = imgMatch[2];
              const cached = imageCache.get(imgUrl);
              if (cached) {
                bodyHtml.push(`<div class="illustration-wrap"><img src="${cached.localHref}" alt="${escapeXml(altText)}" class="illustration"/></div>`);
              } else {
                bodyHtml.push(`<div class="illustration-wrap"><img src="${imgUrl}" alt="${escapeXml(altText)}" class="illustration"/></div>`);
              }
              continue;
            }

            // Scene break dividers: ***, ---, ===, ~~~, * * *, etc.
            if (/^(?:\*\s*\*\s*\*|\*{3,}|\.{3,}|\u2026{2,}|\u2014{2,}|-{3,}|={3,}|~{3,}|#\s*#\s*#)$/.test(trimmed)) {
              bodyHtml.push('<hr/>');
              continue;
            }

            // Horizontal rule markdown
            if (trimmed === '---' || trimmed === '***' || trimmed === '___') {
              bodyHtml.push('<hr/>');
              continue;
            }

            // Blockquote lines starting with >
            if (trimmed.startsWith('>')) {
              const bqLines = [trimmed.replace(/^>\s*/, '')];
              while (li + 1 < rawLines.length && rawLines[li + 1].trim().startsWith('>')) {
                li++;
                bqLines.push(rawLines[li].trim().replace(/^>\s*/, ''));
              }
              bodyHtml.push('<blockquote>' + bqLines.map(l => `<p>${smartFormat(l)}</p>`).join('\n') + '</blockquote>');
              continue;
            }

            // Normal paragraph with smart formatting
            bodyHtml.push(`<p>${smartFormat(trimmed)}</p>`);
          }

          const xhtmlContent = `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="${safeLang}">
<head>
<meta charset="utf-8" />
<title>${escapeXml(chTitle)}</title>
<link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
${bodyHtml.join('\n ')}
</body>
</html>`;

          oebps.file(chFilename, xhtmlContent, { compression: 'DEFLATE', compressionOptions: { level: 1 } });
        }

        const opfContent = `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="BookID" version="3.0">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
  <dc:title>${escapeXml(bookTitle)}</dc:title>
  <dc:creator>${escapeXml(bookAuthor)}</dc:creator>
  <dc:language>${safeLang}</dc:language>
  <dc:identifier id="BookID">${uuid}</dc:identifier>
  <meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</meta>
</metadata>
<manifest>
  ${manifestItems.join('\n ')}
</manifest>
<spine toc="ncx">
  ${spineItems.join('\n ')}
</spine>
</package>`;
        oebps.file('content.opf', opfContent, { compression: 'DEFLATE', compressionOptions: { level: 1 } });

        const ncxContent = `<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
<head>
  <meta name="dtb:uid" content="${uuid}"/>
  <meta name="dtb:depth" content="1"/>
  <meta name="dtb:totalPageCount" content="0"/>
  <meta name="dtb:maxPageNumber" content="0"/>
</head>
<docTitle><text>${escapeXml(bookTitle)}</text></docTitle>
<navMap>
  ${tocNavPoints.join('')}
</navMap>
</ncx>`;
        oebps.file('toc.ncx', ncxContent, { compression: 'DEFLATE', compressionOptions: { level: 1 } });
        const navContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="${safeLang}">
<head>
<meta charset="utf-8" />
<title>${escapeXml(bookTitle)}</title>
</head>
<body>
<nav epub:type="toc" id="toc">
<h1>${escapeXml(bookTitle)}</h1>
<ol>
${tocNavLinks.join('\n')}
</ol>
</nav>
</body>
</html>`;
        oebps.file('nav.xhtml', navContent, { compression: 'DEFLATE', compressionOptions: { level: 1 } });

        onProgress?.(` Compressing EPUB archive • ${getElapsed()}...`, 60, getElapsed());
        window.NativeBridge?.showProgressNotification?.('Compiling EPUB', `Compressing archive • ${getElapsed()}`, 60, true);

        let lastReportedPct = 0;
        const blob = await zip.generateAsync(
          { type: 'blob', mimeType: 'application/epub+zip' },
          (meta) => {
            const pct = Math.min(99, Math.round(60 + (meta.percent * 0.39)));
            if (pct - lastReportedPct >= 5 || meta.percent === 100) {
              lastReportedPct = pct;
              onProgress?.(` Compressing EPUB archive (${Math.round(meta.percent)}%) • ${getElapsed()}...`, pct, getElapsed());
              window.NativeBridge?.showProgressNotification?.('Compiling EPUB', `Compressing archive (${Math.round(meta.percent)}%) • ${getElapsed()}`, pct, true);
            }
          }
        );

        return blob;
      } finally {
        try {
          if (wakeLockObj) wakeLockObj.release().catch(() => {});
          window.NativeBridge?.releaseWakeLock?.();
          window.NativeBridge?.clearProgressNotification?.(true, 'EPUB Packaging Complete! ', `"${bookTitle}" is ready.`);
        } catch(e) {}
      }
    };

    // ══════════════════════════════════════════════════════════════════════
    // MOON+ READER PRO ENGINE (Virtual Windowed Preloading, Visible Crisp UI)
    // ══════════════════════════════════════════════════════════════════════
    // ══════════════════════════════════════════════════════════════════════
    // PERSISTENT INDEXEDDB NOVEL LIBRARY STORE (Unlimited 500MB+ Storage)
    // ══════════════════════════════════════════════════════════════════════
    window.GeminiNovelDB = {
      dbPromise: null,
      getDB() {
        if (!this.dbPromise) {
          this.dbPromise = new Promise((resolve) => {
            if (typeof indexedDB === 'undefined') return resolve(null);
            const req = indexedDB.open('GeminiTranslatorNovelDB', 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('novels')) {
                db.createObjectStore('novels', { keyPath: 'id' });
              }
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => { console.warn('IndexedDB open error:', req.error); resolve(null); };
          });
        }
        return this.dbPromise;
      },
      async saveNovel(novel) {
        try {
          const db = await this.getDB();
          if (!db) return false;
          return new Promise((resolve) => {
            const tx = db.transaction('novels', 'readwrite');
            const store = tx.objectStore('novels');
            store.put(novel);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (e) {
          console.warn('IndexedDB save failed:', e);
          return false;
        }
      },
      async getNovel(id) {
        try {
          const db = await this.getDB();
          if (!db) return null;
          return new Promise((resolve) => {
            const tx = db.transaction('novels', 'readonly');
            const store = tx.objectStore('novels');
            const req = store.get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          });
        } catch (e) {
          console.warn('IndexedDB get failed:', e);
          return null;
        }
      },
      async getAllNovels() {
        try {
          const db = await this.getDB();
          if (!db) return [];
          return new Promise((resolve) => {
            const tx = db.transaction('novels', 'readonly');
            const store = tx.objectStore('novels');
            const req = store.getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          });
        } catch (e) {
          console.warn('IndexedDB getAll failed:', e);
          return [];
        }
      },
      async deleteNovel(id) {
        try {
          const db = await this.getDB();
          if (!db) return false;
          return new Promise((resolve) => {
            const tx = db.transaction('novels', 'readwrite');
            const store = tx.objectStore('novels');
            store.delete(id);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (e) {
          console.warn('IndexedDB delete failed:', e);
          return false;
        }
      },
      async clearAll() {
        try {
          const db = await this.getDB();
          if (!db) return false;
          return new Promise((resolve) => {
            const tx = db.transaction('novels', 'readwrite');
            const store = tx.objectStore('novels');
            store.clear();
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        } catch (e) {
          console.warn('IndexedDB clear failed:', e);
          return false;
        }
      }
    };

    // ══════════════════════════════════════════════════════════════════════
    // PRO MOON+ READER ENGINE (Virtual Windowing, High-Res Art & Pro TTS Player)
    // ══════════════════════════════════════════════════════════════════════
    const MoonReaderModal = ({ open, onClose, text, chapters, currentIdx, onChapterChange, theme, setTheme, font, setFont, fontSize, setFontSize, tgtLang }) => {
      if (!open) return null;

      const safeChapters = useMemo(() => {
        let list = Array.isArray(chapters) && chapters.length > 0
          ? chapters.filter(c => c && typeof c === 'object').map(c => ({
              title: c.title || 'Chapter',
              text: c.content || c.text || ''
            }))
          : [];

        if (list.length === 0 && text && typeof text === 'string') {
          const lines = text.split(/\r?\n/);
          const isHeading = (l) => {
            const trimmed = l.trim();
            return /^(?:第[0-9零一二三四五六七八九十百千万]+[章回卷节篇]|Chapter\s*\d+|CHAPTER\s*\d+|\d+[\.\s]+|\#+\s+)/i.test(trimmed);
          };
          let curTitle = 'Chapter 1';
          let curLines = [];
          for (const line of lines) {
            if (isHeading(line) && curLines.length > 0) {
              list.push({ title: curTitle, text: curLines.join('\n') });
              curTitle = line.trim();
              curLines = [];
            } else {
              curLines.push(line);
            }
          }
          if (curLines.length > 0) {
            list.push({ title: curTitle, text: curLines.join('\n') });
          }
        }

        if (list.length === 0) {
          list = [{ title: 'Chapter 1', text: text || 'No text loaded.' }];
        }
        return list;
      }, [chapters, text]);

      const [activeIdx, setActiveIdx] = useState(typeof currentIdx === 'number' && currentIdx >= 0 ? currentIdx : 0);
      const [showToc, setShowToc] = useState(false);
      const [showMenu, setShowMenu] = useState(false);
      const [showVisual, setShowVisual] = useState(false);
      const [showTtsBar, setShowTtsBar] = useState(false);
      const [justify, setJustify] = useState(() => { try { return localStorage.getItem('readerJustify') !== 'false'; } catch (e) { return false; } });
      useEffect(() => { try { localStorage.setItem('readerJustify', String(justify)); } catch (e) {} }, [justify]);
      const [chrome, setChrome] = useState(false);
      const [endReached, setEndReached] = useState(false);

      // TTS State — Moon+ follow-along
      const [ttsPlaying, setTtsPlaying] = useState(false);
      const [ttsPaused, setTtsPaused] = useState(false);
      const [ttsSpeed, setTtsSpeed] = useState(1.0);
      const [ttsPitch, setTtsPitch] = useState(1.0);
      const [ttsVolume, setTtsVolume] = useState(1.0);
      const [ttsVoices, setTtsVoices] = useState([]);
      const [selectedVoice, setSelectedVoice] = useState('');
      const [activeSentenceIdx, setActiveSentenceIdx] = useState(-1);

      const containerRef = useRef(null);
      const sentencesRef = useRef([]);
      const sentenceIdxRef = useRef(0);
      const activeIdxRef = useRef(activeIdx);
      activeIdxRef.current = activeIdx;
      const advancingRef = useRef(false);
      const ttsPlayingRef = useRef(false);
      ttsPlayingRef.current = ttsPlaying && !ttsPaused;
      const ttsSpeedRef = useRef(1.0); ttsSpeedRef.current = ttsSpeed;
      const ttsPitchRef = useRef(1.0); ttsPitchRef.current = ttsPitch;
      const ttsVolumeRef = useRef(1.0); ttsVolumeRef.current = ttsVolume;
      const selectedVoiceRef = useRef(''); selectedVoiceRef.current = selectedVoice;
      const ttsVoicesRef = useRef([]); ttsVoicesRef.current = ttsVoices;

      useEffect(() => {
        if (typeof currentIdx === 'number' && currentIdx >= 0 && currentIdx !== activeIdx) {
          setActiveIdx(currentIdx);
        }
      }, [currentIdx]);

      useEffect(() => {
        const updateVoices = () => {
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            const vList = window.speechSynthesis.getVoices() || [];
            setTtsVoices(vList);
            if (vList.length > 0 && !selectedVoiceRef.current) {
              const langCode = (tgtLang || 'en').toLowerCase().substring(0, 2);
              const matched = vList.find(v => v.lang.toLowerCase().startsWith(langCode)) || vList[0];
              if (matched) setSelectedVoice(matched.name);
            }
          }
        };
        updateVoices();
        if (typeof window !== 'undefined' && window.speechSynthesis) {
          window.speechSynthesis.onvoiceschanged = updateVoices;
        }
        return () => {
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = null;
          }
        };
      }, [tgtLang]);

      const currentChapter = safeChapters[activeIdx] || safeChapters[0];

      const parsedParagraphs = useMemo(() => {
        const rawText = currentChapter?.text || '';
        const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        return lines.map((line, pIdx) => {
          const imgMatch = line.match(/^!\[(.*?)\]\((https?:\/\/[^\)]+)\)$/);
          if (imgMatch) {
            return { isImage: true, alt: imgMatch[1] || 'Illustration', url: imgMatch[2], pIdx };
          }
          return { isImage: false, text: line, pIdx };
        });
      }, [currentChapter]);

      useEffect(() => {
        const textOnly = parsedParagraphs
          .filter(p => !p.isImage)
          .map(p => p.text)
          .join('\n');
        const rawSentences = textOnly
          .split(/([。！？!?\n]+)/)
          .reduce((acc, cur, i, arr) => {
            if (i % 2 === 0 && cur.trim()) {
              const punct = arr[i + 1] || '';
              acc.push((cur + punct).trim());
            }
            return acc;
          }, [])
          .filter(s => s.length > 1 && !s.startsWith('![Illustration]'));
        sentencesRef.current = rawSentences.length > 0 ? rawSentences : [currentChapter?.title || ''];
        sentenceIdxRef.current = 0;
        setActiveSentenceIdx(ttsPlayingRef.current ? 0 : -1);
      }, [parsedParagraphs, currentChapter]);

      const scrollToSentence = (idx) => {
        if (!containerRef.current) return;
        const el = containerRef.current.querySelector(`[data-sentence-idx="${idx}"]`);
        if (el) {
          const rect = el.getBoundingClientRect();
          const containerRect = containerRef.current.getBoundingClientRect();
          if (rect.top < containerRect.top + 80 || rect.bottom > containerRect.bottom - 120) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
      };

      const speakSentence = (idx) => {
        if (typeof window === 'undefined' || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();

        const sList = sentencesRef.current;
        if (idx < 0 || idx >= sList.length) {
          if (activeIdxRef.current < safeChapters.length - 1) {
            const nextCh = activeIdxRef.current + 1;
            setActiveIdx(nextCh);
            onChapterChange?.(nextCh);
            sentenceIdxRef.current = 0;
            setActiveSentenceIdx(0);
            setTimeout(() => speakSentence(0), 450);
            return;
          } else {
            setTtsPlaying(false);
            setTtsPaused(false);
            setActiveSentenceIdx(-1);
            setEndReached(true);
            return;
          }
        }

        sentenceIdxRef.current = idx;
        setActiveSentenceIdx(idx);
        scrollToSentence(idx);

        const sentenceText = sList[idx];
        const utter = new SpeechSynthesisUtterance(sentenceText);
        utter.rate = ttsSpeedRef.current;
        utter.pitch = ttsPitchRef.current;
        utter.volume = ttsVolumeRef.current;

        if (selectedVoiceRef.current && ttsVoicesRef.current.length > 0) {
          const vObj = ttsVoicesRef.current.find(v => v.name === selectedVoiceRef.current);
          if (vObj) utter.voice = vObj;
        }

        utter.onend = () => {
          if (sentenceIdxRef.current === idx) {
            speakSentence(idx + 1);
          }
        };
        utter.onerror = (e) => {
          if (e.error !== 'canceled') {
            console.warn('TTS Speech Error:', e);
            speakSentence(idx + 1);
          }
        };

        window.__activeTtsUtterance = utter;
        window.speechSynthesis.speak(utter);
        setTtsPlaying(true);
        setTtsPaused(false);
        setEndReached(false);
      };

      const handlePlayPause = () => {
        if (typeof window === 'undefined' || !window.speechSynthesis) return;
        if (ttsPlaying && !ttsPaused) {
          window.speechSynthesis.pause();
          setTtsPaused(true);
        } else if (ttsPaused) {
          window.speechSynthesis.resume();
          setTtsPaused(false);
        } else {
          setShowTtsBar(true);
          const startIdx = activeSentenceIdx >= 0 ? activeSentenceIdx : 0;
          speakSentence(startIdx);
        }
      };

      const handleStopTts = () => {
        if (typeof window !== 'undefined' && window.speechSynthesis) {
          window.speechSynthesis.cancel();
        }
        window.__activeTtsUtterance = null;
        setTtsPlaying(false);
        setTtsPaused(false);
        setActiveSentenceIdx(-1);
      };

      const handlePrevSentence = () => {
        const prev = Math.max(0, sentenceIdxRef.current - 1);
        speakSentence(prev);
      };

      const handleNextSentence = () => {
        const next = sentenceIdxRef.current + 1;
        speakSentence(next);
      };

      useEffect(() => {
        return () => {
          if (typeof window !== 'undefined' && window.speechSynthesis) {
            window.speechSynthesis.cancel();
          }
          window.__activeTtsUtterance = null;
        };
      }, []);

      // Moon+ scroll flow: chapter continues into the next one
      const advanceChapter = () => {
        if (advancingRef.current) return;
        if (activeIdxRef.current >= safeChapters.length - 1) { setEndReached(true); return; }
        advancingRef.current = true;
        const next = activeIdxRef.current + 1;
        setActiveIdx(next);
        onChapterChange?.(next);
        if (containerRef.current) containerRef.current.scrollTop = 0;
        setTimeout(() => { advancingRef.current = false; }, 600);
        if (ttsPlayingRef.current) {
          setTimeout(() => speakSentence(0), 300);
        }
      };

      const handleScroll = () => {
        const el = containerRef.current;
        if (!el) return;
        if (el.scrollHeight - el.scrollTop - el.clientHeight < 48) {
          advanceChapter();
        }
      };

      // Reading-time estimates (200 wpm)
      const chapterWords = (currentChapter?.text || '').split(/\s+/).filter(Boolean).length;
      const chapterMins = Math.max(1, Math.round(chapterWords / 200));
      const remainingWords = safeChapters.slice(activeIdx).reduce((acc, c) => acc + (c.text || '').split(/\s+/).filter(Boolean).length, 0);
      const bookHours = remainingWords > 0 ? Math.max(1, Math.round(remainingWords / 200 / 60)) : 1;
      const pct = Math.round(((activeIdx + 1) / safeChapters.length) * 100);

      const themeClasses = {
        light: 'reader-theme-light',
        sepia: 'reader-theme-sepia',
        dark: 'reader-theme-dark',
        black: 'reader-theme-black'
      }[theme] || 'reader-theme-dark';

      const fontClasses = {
        sans: '', serif: 'serif', mono: 'mono'
      }[font || 'serif'] || 'serif';

      const firstChapterTitle = currentChapter?.title || 'Chapter';

      return h('div', {
        className: 'reader-shell',
        onClick: () => { if (showToc) setShowToc(false); else setChrome(c => !c); }
      },
        // Top bar (tap to reveal)
        chrome && h('div', { className: 'reader-top', onClick: (e) => e.stopPropagation() },
          h('div', null,
            h('div', { className: 'book-title' }, 'Reader'),
            h('div', { className: 'ch' }, `${firstChapterTitle} · Ch ${activeIdx + 1} of ${safeChapters.length}`)
          ),
          h('div', { style: { display: 'flex', gap: 8 } },
            h('button', { type: 'button', className: 'icon-btn', title: 'Read Aloud', onClick: () => { setShowTtsBar(!showTtsBar); if (!ttsPlaying && !showTtsBar) handlePlayPause(); } }, '🔊'),

    // ERROR BOUNDARY

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { hasError: false, error: null } }
      static getDerivedStateFromError(e) { return { hasError: true, error: e } }
      render() { if (this.state.hasError) return h('div', { className: 'min-h-screen flex items-center justify-center bg-red-50 dark:bg-gray-900 p-8' }, h('div', { className: 'max-w-lg text-center' }, h('h1', { className: 'text-2xl font-bold text-red-600 mb-4' }, 'Something went wrong'), h('p', { className: 'text-gray-700 dark:text-gray-300 mb-4' }, this.state.error?.message), h('button', { onClick: () => this.setState({ hasError: false, error: null }), className: 'px-6 py-2 bg-indigo-600 text-white rounded-lg' }, 'Try Again'))); return this.props.children }
    }

    // MAIN APP
    // ═══════════════════════════════════════
    function App() {
      // --- Core State ---
      const [inputText, setInputText] = useState('');
      const [assembledText, setAssembledText] = useState('');
      const [terminology, setTerminology] = useState(() => localStorage.getItem('terminology') || '');
      const [enableGlossary, setEnableGlossary] = useState(() => localStorage.getItem('enableGlossary') === 'true');
      const [customInstructions, setCustomInstructions] = useState(() => localStorage.getItem('customInstructions') || '');
      const [smartGlossary, setSmartGlossary] = useState(() => localStorage.getItem('smartGlossary') !== 'false');
      const [activeTab, setActiveTab] = useState(() => localStorage.getItem('activeTab') || 'text');
      const [webImportUrl, setWebImportUrl] = useState('');
      const [isFetchingUrl, setIsFetchingUrl] = useState(false);
      const [webImportStatus, setWebImportStatus] = useState('');
      const [webImportData, setWebImportData] = useState(null);
      const [webImportHistory, setWebImportHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('gemini_web_import_history_meta') || localStorage.getItem('gemini_web_import_history');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      const [historySearchQuery, setHistorySearchQuery] = useState('');

      const saveNovelToHistory = async (novelData) => {
        if (!novelData || !novelData.chapters || novelData.chapters.length === 0) return;
        const totalWords = novelData.chapters.reduce((acc, c) => acc + (c.words || (c.text ? c.text.split(/\s+/).filter(Boolean).length : (c.content ? c.content.split(/\s+/).filter(Boolean).length : 0))), 0);
        const novelId = 'novel_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
        
        // Sanitize chapters into plain cloneable objects without DOM nodes, functions, or circular references
        const cleanChapters = novelData.chapters.map((c, i) => ({
          title: c.title || `Chapter ${i + 1}`,
          text: typeof c === 'string' ? c : (c.text || c.content || ''),
          content: typeof c === 'string' ? c : (c.content || c.text || '')
        }));

        const novelRecord = {
          id: novelId,
          title: novelData.title || 'Untitled Novel',
          author: novelData.author || 'Author',
          summary: (novelData.summary || '').substring(0, 300),
          tags: novelData.tags || [],
          chapterCount: cleanChapters.length,
          wordCount: totalWords,
          timestamp: new Date().toISOString(),
          isEpub: !!novelData.isEpub,
          sourceUrl: novelData.sourceUrl || '',
          rawChapters: cleanChapters
        };

        if (window.GeminiNovelDB) {
          try {
            await window.GeminiNovelDB.saveNovel(novelRecord);
          } catch (e) {
            console.warn('GeminiNovelDB save error:', e);
          }
        }

        const metaRecord = {
          id: novelId,
          title: novelRecord.title,
          author: novelRecord.author,
          summary: novelRecord.summary,
          tags: novelRecord.tags,
          chapterCount: novelRecord.chapterCount,
          wordCount: novelRecord.wordCount,
          timestamp: novelRecord.timestamp,
          isEpub: novelRecord.isEpub,
          sourceUrl: novelRecord.sourceUrl
        };

        setWebImportHistory(prev => {
          const updated = [metaRecord, ...prev.filter(n => n.title !== novelData.title && n.id !== metaRecord.id)].slice(0, 50);
          try {
            localStorage.setItem('gemini_web_import_history_meta', JSON.stringify(updated));
          } catch (e) {}
          return updated;
        });
      };

      const loadFullNovel = async (meta) => {
        if (!meta) return null;
        // 1. Try IndexedDB by meta.id
        if (window.GeminiNovelDB && meta.id) {
          try {
            const full = await window.GeminiNovelDB.getNovel(meta.id);
            if (full && (full.rawChapters?.length > 0 || full.chapters?.length > 0)) return full;
          } catch(e) {}
        }
        // 2. Try IndexedDB by matching title or id across all stored records
        if (window.GeminiNovelDB && meta.title) {
          try {
            const all = await window.GeminiNovelDB.getAllNovels();
            const match = (all || []).find(n => n.id === meta.id || n.title === meta.title);
            if (match && (match.rawChapters?.length > 0 || match.chapters?.length > 0)) return match;
          } catch(e) {}
        }
        // 3. Fallback: check if meta already contains rawChapters or chapters
        if (meta.rawChapters?.length > 0 || meta.chapters?.length > 0) return meta;
        // 4. Fallback: check currently active webImportData
        if (webImportData && webImportData.title === meta.title && webImportData.chapters?.length > 0) {
          return { ...webImportData, rawChapters: webImportData.chapters };
        }
        // 5. Fallback: check legacy localStorage storage
        try {
          const old = JSON.parse(localStorage.getItem('gemini_web_import_history') || '[]');
          const found = (old || []).find(n => n.id === (meta.id || '')) || (old || []).find(n => n.title === meta.title);
          if (found && (found.chapters?.length || found.rawChapters?.length)) {
            return { title: found.title, author: found.author, rawChapters: found.chapters || found.rawChapters };
          }
        } catch (e) {}
        return null;
      };

      const loadNovelFromHistory = async (meta) => {
        try {
          toast(` Loading "${meta.title}" from library...`, 'info');
          const fullNovel = await loadFullNovel(meta);
          if (!fullNovel || (!fullNovel.rawChapters && !fullNovel.chapters)) {
            throw new Error('Novel chapter data not found in local library store.');
          }
          const rawChs = fullNovel.rawChapters || fullNovel.chapters || [];
          const loadedData = {
            title: fullNovel.title,
            author: fullNovel.author,
            summary: fullNovel.summary,
            tags: fullNovel.tags,
            chapters: rawChs,
            rawChapters: rawChs,
            isEpub: fullNovel.isEpub,
            sourceUrl: fullNovel.sourceUrl
          };
          setWebImportData(loadedData);
          toast(` Loaded "${loadedData.title}" (${loadedData.chapters.length} chapters)!`, 'success');
          return loadedData;
        } catch (err) {
          console.error('Failed to load novel from library:', err);
          toast('Failed to load: ' + err.message, 'error');
          return null;
        }
      };

      const deleteNovelFromHistory = async (id) => {
        if (window.GeminiNovelDB) {
          try {
            await window.GeminiNovelDB.deleteNovel(id);
          } catch(e) {}
        }
        setWebImportHistory(prev => {
          const updated = prev.filter(item => item.id !== id);
          try {
            localStorage.setItem('gemini_web_import_history_meta', JSON.stringify(updated));
          } catch (e) {}
          return updated;
        });
        toast('Removed novel from library', 'info');
      };

      const clearAllNovelHistory = async () => {
        if (window.GeminiNovelDB) {
          await window.GeminiNovelDB.clearAll();
        }
        setWebImportHistory([]);
        localStorage.removeItem('gemini_web_import_history_meta');
        toast('Cleared all novel history', 'info');
      };

      // Load persistent IndexedDB novels on mount, merging seamlessly with localStorage
      useEffect(() => {
        (async () => {
          try {
            const combined = [];
            const seenIds = new Set();
            const seenTitles = new Set();

            if (window.GeminiNovelDB) {
              const dbNovels = await window.GeminiNovelDB.getAllNovels();
              if (dbNovels && dbNovels.length > 0) {
                dbNovels.reverse().forEach(n => {
                  const item = {
                    id: n.id,
                    title: n.title,
                    author: n.author,
                    summary: n.summary,
                    tags: n.tags,
                    chapterCount: n.chapterCount || (n.rawChapters ? n.rawChapters.length : 0),
                    wordCount: n.wordCount,
                    timestamp: n.timestamp,
                    isEpub: n.isEpub,
                    sourceUrl: n.sourceUrl
                  };
                  if (!seenIds.has(item.id)) {
                    seenIds.add(item.id);
                    if (item.title) seenTitles.add(item.title);
                    combined.push(item);
                  }
                });
              }
            }

            try {
              const metaStr = localStorage.getItem('gemini_web_import_history_meta') || localStorage.getItem('gemini_web_import_history');
              if (metaStr) {
                const localList = JSON.parse(metaStr);
                if (Array.isArray(localList)) {
                  localList.forEach(item => {
                    if (item && item.id && !seenIds.has(item.id) && !seenTitles.has(item.title)) {
                      seenIds.add(item.id);
                      if (item.title) seenTitles.add(item.title);
                      combined.push(item);
                    }
                  });
                }
              }
            } catch(e) {}

            if (combined.length > 0) {
              setWebImportHistory(combined);
            }
          } catch (e) {
            console.warn('Novel history load error:', e);
          }
        })();
      }, []);

      const [studioSubTab, setStudioSubTab] = useState(() => localStorage.getItem('studioSubTab') || 'split');
      const [error, setError] = useState('');

      // --- Translation State ---
      const [isTranslating, setIsTranslating] = useState(false);
      const [progress, setProgress] = useState(0);
      const [progressLabel, setProgressLabel] = useState('');
      const [translatedChapters, setTranslatedChapters] = useState([]);
      const [chapters, setChapters] = useState([]);
      const [lastUsageStats, setLastUsageStats] = useState(null);

      // --- Provider State ---
      const [provider, setProvider] = useState(() => localStorage.getItem('translationProvider') || 'gemini');
      const [apiKeysByProvider, setApiKeysByProvider] = useState(() => {

        return {

          deepseek: dsKey ? [{ id: 'deepseek-init', name: 'Primary DeepSeek Key', key: dsKey }] : [],
          openai: oaiKey ? [{ id: 'openai-init', name: 'Primary OpenAI Key', key: oaiKey }] : [],
          claude: cldKey ? [{ id: 'claude-init', name: 'Primary Claude Key', key: cldKey }] : [],
          deepl: dlKey ? [{ id: 'deepl-init', name: 'Primary DeepL Key', key: dlKey }] : [],
          libre: []
        };

      const [activeKeyIds, setActiveKeyIds] = useState(() => {
        const saved = localStorage.getItem('activeKeyIds');

          try {
            const p = JSON.parse(saved);

          claude: 'claude-init',
          deepl: 'deepl-init',

      const [showKeys, setShowKeys] = useState({});

      const [includeApiKeysInBackup, setIncludeApiKeysInBackup] = useState(() => localStorage.getItem('includeApiKeysInBackup') === 'true');
      const [geminiModel, setGeminiModel] = useState(() => localStorage.getItem('geminiModel') || 'gemini-3.7-flash');
      const [deepseekModel, setDeepseekModel] = useState(() => localStorage.getItem('deepseekModel') || 'deepseek-chat');
      const [openaiModel, setOpenaiModel] = useState(() => localStorage.getItem('openaiModel') || 'gpt-4o-mini');
      const [claudeModel, setClaudeModel] = useState(() => localStorage.getItem('claudeModel') || 'claude-3-5-haiku-20241022');
      const [availableModels, setAvailableModels] = useState([]);
      const [customModel, setCustomModel] = useState(() => localStorage.getItem('customModel') || '');
      const [useCustomModel, setUseCustomModel] = useState(() => localStorage.getItem('useCustomModel') === 'true');
      const [customDeepseekModel, setCustomDeepseekModel] = useState(() => localStorage.getItem('customDeepseekModel') || '');
      const [useCustomDeepseekModel, setUseCustomDeepseekModel] = useState(() => localStorage.getItem('useCustomDeepseekModel') === 'true');
      const [customOpenaiModel, setCustomOpenaiModel] = useState('');
      const [useCustomOpenaiModel, setUseCustomOpenaiModel] = useState(false);
      const [customClaudeModel, setCustomClaudeModel] = useState('');
      const [useCustomClaudeModel, setUseCustomClaudeModel] = useState(false);
      const isStandalone = typeof window !== 'undefined' && (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
      const [deferredPrompt, setDeferredPrompt] = useState(globalDeferredPrompt);

      useEffect(() => {
        const handlePrompt = (e) => {
          e.preventDefault();
          globalDeferredPrompt = e;
          setDeferredPrompt(e);

          globalDeferredPrompt = null;
          setDeferredPrompt(null);
          toast('Gemini Translator installed successfully!', 'success');

          window.removeEventListener('beforeinstallprompt', handlePrompt);

      const handleTouchResizeStart = (e, boxType) => {
        const touch = e.touches && e.touches[0];
