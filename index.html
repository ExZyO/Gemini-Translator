<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gemini Translator</title>
  <meta name="description"
    content="AI-powered translation with Gemini, DeepSeek, DeepL, and LibreTranslate. Supports PDF, EPUB, TXT files with glossary management.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="./manifest.json">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      transition: background-color .3s, color .3s
    }

    html.dark body {
      background-color: #030712;
    }

    @keyframes toastIn {
      from {
        transform: translateX(100%);
        opacity: 0
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }

    @keyframes toastOut {
      from {
        transform: translateX(0);
        opacity: 1
      }

      to {
        transform: translateX(100%);
        opacity: 0
      }
    }

    .toast-enter {
      animation: toastIn .3s ease-out forwards
    }

    .toast-exit {
      animation: toastOut .3s ease-in forwards
    }

    .drop-zone-active {
      border: 3px dashed #6366f1 !important;
      background: rgba(99, 102, 241, .08) !important
    }

    .dark .drop-zone-active {
      background: rgba(99, 102, 241, .15) !important
    }

    *:focus-visible {
      outline: 2px solid #6366f1;
      outline-offset: 2px;
      border-radius: 4px
    }

    .collapsible {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease-out
    }

    .collapsible.open {
      max-height: 5000px
    }

    /* Custom Scrollbar Styling */
    .custom-scrollbar {
      scrollbar-width: thin;
      scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.6);
    }
    .dark .custom-scrollbar {
      scrollbar-color: rgba(100, 116, 139, 0.5) transparent;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }

    @keyframes tooltipIn {
      from { opacity: 0; transform: translate(-50%, 4px) scale(0.96); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }

    .animate-tooltip {
      animation: tooltipIn .15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .animate-dropdown {
      animation: dropdownIn .15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fadeIn {
      animation: dropdownIn .15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* High-Contrast Select Dropdown, Optgroup & Option Styling */
    select optgroup {
      font-weight: 800 !important;
      font-style: normal !important;
      text-transform: uppercase !important;
      letter-spacing: 0.08em !important;
      font-size: 11px !important;
      padding-top: 8px !important;
      padding-bottom: 4px !important;
      color: #4f46e5 !important;
      background-color: #f1f5f9 !important;
    }
    .dark select optgroup {
      color: #93c5fd !important;
      background-color: #030712 !important;
    }

    select option {
      font-weight: 500 !important;
      font-style: normal !important;
      font-size: 13px !important;
      padding: 6px 12px !important;
      color: #0f172a !important;
      background-color: #ffffff !important;
    }
    .dark select option {
      color: #f8fafc !important;
      background-color: #0f172a !important;
    }
    .dark select option:checked {
      background-color: #2563eb !important;
      color: #ffffff !important;
    }
      html.dark body { background-color: #030712; }

</head>

<body>
  <div id="root"></div>
  <script src="native-bridge.js"></script>
  <script src="utils.js"></script>
  <script src="splitter.js"></script>
  <script src="merger.js"></script>
  <script src="epub_studio_ui.js"></script>
  <script src="web_importer.js"></script>
  <script>
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const h = React.createElement;
    window.studioSubTab = 'split';

    // Bulletproof Lucide Icon Component Factory (Dynamic UMD Adapter)
    const createLucideIcon = (name) => {
      return function IconComponent(props) {
        const size = (props && props.size) || 18;
        const className = (props && props.className) || '';
        const nameKebab = String(name || '').replace(/([A-Z])/g, '-$1').toLowerCase().replace(/^-/, '');
        const nameLower = String(name || '').toLowerCase();
        const iconDef = (window.LUCIDE_ICONS && (
          window.LUCIDE_ICONS[name] ||
          window.LUCIDE_ICONS[nameLower] ||
          window.LUCIDE_ICONS[nameKebab]
        )) || (window.lucide && (
          window.lucide[name] ||
          window.lucide[nameLower] ||
          window.lucide[nameKebab] ||
          (window.lucide.icons && (
            window.lucide.icons[name] ||
            window.lucide.icons[nameLower] ||
            window.lucide.icons[nameKebab]
          ))
        )) || [];
        return h('svg', {
          xmlns: 'http://www.w3.org/2000/svg',
          width: size,
          height: size,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: '2',
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className
        },
          iconDef.map((el, i) => h(el[0], { key: i, ...el[1] }))
        );
      };
    };

    const LucideIcons = new Proxy({}, {
      get: (target, prop) => {
        if (!target[prop]) target[prop] = createLucideIcon(prop);
        return target[prop];
      }
    });

    const iconNamesList = [
      'Download', 'Clipboard', 'Link', 'BookText', 'FileText', 'XCircle', 'Copy',
      'Loader2', 'Eye', 'EyeOff', 'RefreshCcw', 'Save', 'Upload', 'Sun', 'Moon',
      'Columns2', 'Rows2', 'History', 'ChevronDown', 'ChevronUp', 'Zap', 'X',
      'CheckCircle2', 'AlertCircle', 'Info', 'Search', 'Trash2', 'RotateCcw',
      'Square', 'FileDown', 'Settings', 'Globe', 'Sparkles', 'Brain', 'Languages',
      'Check', 'ArrowRightLeft', 'Star', 'Clock', 'Layers', 'Scissors', 'Sliders',
      'Plus', 'Minus', 'Maximize2', 'Minimize2', 'BookOpen', 'Key', 'Shield', 'Lock', 'Unlock',
      'Calendar', 'ArrowUpDown', 'CalendarDays', 'Volume2', 'VolumeX', 'Play', 'Pause',
      'SkipForward', 'SkipBack', 'MoreVertical', 'Type', 'Palette', 'List', 'Compass',
      'Bookmark', 'Menu', 'ArrowLeft', 'Maximize', 'Minimize', 'ChevronsUp', 'ChevronsDown'
    ];
    iconNamesList.forEach(name => {
      window[name] = LucideIcons[name] || createLucideIcon(name);
    });

    const { Download, Clipboard, Link, BookText, FileText, XCircle, Copy, Loader2, Eye, EyeOff, RefreshCcw, Save, Upload, Sun, Moon, Columns2, Rows2, History, ChevronDown, ChevronUp, Zap, X, CheckCircle2, AlertCircle, Info, Search, Trash2, RotateCcw, Square, FileDown, Settings, Globe, Sparkles, Brain, Languages, Check, ArrowRightLeft, Star, Clock, Layers, Scissors, Sliders, Plus, Minus, Maximize2, Minimize2, BookOpen, Key, Shield, Lock, Unlock, Calendar, ArrowUpDown, Volume2, VolumeX, Play, Pause, SkipForward, SkipBack, MoreVertical, Type, Palette, List, Compass, Bookmark, Menu, ArrowLeft, Maximize, Minimize } = window;
    const ic = (Icon, size = 18, className = 'shrink-0') => {
      let comp = Icon;
      if (typeof Icon === 'string') {
        comp = LucideIcons[Icon] || window[Icon] || createLucideIcon(Icon);
      } else if (!comp) {
        comp = LucideIcons['FileText'] || 'span';
      }
      return h(comp || 'span', { size, className });
    };
    const btn = (props, ...ch) => h('button', props, ...ch);
    const splitHtml = window.splitHtml || '';
    const mergeHtml = window.mergeHtml || '';
    const modalHtml = window.modalHtml || '';

    // Global PWA install prompt handler to catch event before React renders
    let globalDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      globalDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
    });

    // ═══════════════════════════════════════
    // CONSTANTS
    // ═══════════════════════════════════════
    const VERSION = '7.4.2';
    const MAX_PAYLOAD = 12000;
    const PROMPT_OVERHEAD = 800;
    const MAX_HISTORY = 20;
    const DEFAULT_CONCURRENCY = 3;
    const LANGUAGES = ['Auto-detect', 'English', 'Spanish', 'French', 'German', 'Italian', 'Portuguese', 'Chinese (Simplified)', 'Chinese (Traditional)', 'Japanese', 'Korean', 'Russian', 'Arabic', 'Hindi', 'Bengali', 'Urdu', 'Vietnamese', 'Turkish', 'Polish', 'Dutch', 'Swedish', 'Norwegian', 'Danish', 'Finnish', 'Greek', 'Hebrew', 'Thai', 'Indonesian', 'Malay', 'Filipino', 'Romanian', 'Hungarian', 'Czech', 'Slovak', 'Bulgarian', 'Serbian', 'Croatian', 'Ukrainian', 'Lithuanian', 'Latvian', 'Estonian', 'Slovenian', 'Catalan', 'Basque', 'Galician'];
    const TARGET_LANGUAGES = LANGUAGES.filter(l => l !== 'Auto-detect');

    const DEEPL_LANG_MAP = { 'English': 'EN', 'Spanish': 'ES', 'French': 'FR', 'German': 'DE', 'Italian': 'IT', 'Portuguese': 'PT', 'Chinese (Simplified)': 'ZH', 'Chinese (Traditional)': 'ZH', 'Japanese': 'JA', 'Korean': 'KO', 'Russian': 'RU', 'Arabic': 'AR', 'Hindi': 'HI', 'Vietnamese': 'VI', 'Turkish': 'TR', 'Polish': 'PL', 'Dutch': 'NL', 'Swedish': 'SV', 'Norwegian': 'NB', 'Danish': 'DA', 'Finnish': 'FI', 'Greek': 'EL', 'Hebrew': 'HE', 'Indonesian': 'ID', 'Romanian': 'RO', 'Hungarian': 'HU', 'Czech': 'CS', 'Slovak': 'SK', 'Bulgarian': 'BG', 'Serbian': 'SR', 'Croatian': 'HR', 'Ukrainian': 'UK', 'Lithuanian': 'LT', 'Latvian': 'LV', 'Estonian': 'ET', 'Slovenian': 'SL' };
    const LIBRE_LANG_MAP = { 'English': 'en', 'Spanish': 'es', 'French': 'fr', 'German': 'de', 'Italian': 'it', 'Portuguese': 'pt', 'Chinese (Simplified)': 'zh', 'Chinese (Traditional)': 'zt', 'Japanese': 'ja', 'Korean': 'ko', 'Russian': 'ru', 'Arabic': 'ar', 'Hindi': 'hi', 'Vietnamese': 'vi', 'Turkish': 'tr', 'Polish': 'pl', 'Dutch': 'nl', 'Swedish': 'sv', 'Norwegian': 'nb', 'Danish': 'da', 'Finnish': 'fi', 'Greek': 'el', 'Hebrew': 'he', 'Indonesian': 'id', 'Filipino': 'tl', 'Romanian': 'ro', 'Hungarian': 'hu', 'Czech': 'cs', 'Slovak': 'sk', 'Bulgarian': 'bg', 'Serbian': 'sr', 'Croatian': 'hr', 'Ukrainian': 'uk' };
            const DEFAULT_GEMINI_MODELS = [
      { id: 'gemini-3.7-flash', name: 'Gemini 3.7 Flash (Flagship Hybrid & Fast)' },
      { id: 'gemini-3.6-flash', name: 'Gemini 3.6 Flash (Official 2026 Recommended)' },
      { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash (Ultra Fast)' },
      { id: 'gemini-3.5-flash-lite', name: 'Gemini 3.5 Flash-Lite (Highest Free Quota)' },
      { id: 'gemini-3.1-flash-lite', name: 'Gemini 3.1 Flash-Lite (High Quota & Fast)' },
      { id: 'gemini-3.1-pro-preview', name: 'Gemini 3.1 Pro (Deep Literary Reasoning)' },
      { id: 'gemini-3-flash-preview', name: 'Gemini 3 Flash (Preview)' }
    ];

    const DEFAULT_DEEPSEEK_MODELS = [
      { id: 'deepseek-chat', name: 'DeepSeek V3 / V4 Chat (Ultra Fast & Cheap)' },
      { id: 'deepseek-reasoner', name: 'DeepSeek R1 / V4 Pro (Deep Reasoning)' }
    ];

    const estimateTokens = (text) => {
      if (!text) return 0;
      const cjkMatch = text.match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g) || [];
      const nonCjk = text.replace(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g, '');
      const words = nonCjk.trim().split(/\s+/).filter(Boolean);
      return Math.ceil(cjkMatch.length * 1.2 + words.length * 1.3);
    };

    const estimateCost = (tokens, modelId = 'gemini-3.7-flash', provider = 'gemini') => {
      let perMillion = 0.075;
      if (provider === 'deepseek') {
        if (modelId === 'deepseek-reasoner') perMillion = 0.55;
        else perMillion = 0.14;
      } else {
        if (modelId.includes('3.1-pro') || modelId.includes('pro')) perMillion = 1.25;
        else if (modelId.includes('flash-lite') || modelId.includes('8b')) perMillion = 0.0375;
        else if (modelId.includes('3.7-flash') || modelId.includes('3.6-flash') || modelId.includes('3.5-flash') || modelId.includes('3-flash')) perMillion = 0.075;
      }
      return ((tokens / 1000000) * perMillion).toFixed(4);
    };

    const calculateRealCost = (promptTokens, outputTokens, modelId = 'gemini-3.7-flash', provider = 'gemini') => {
      window.calculateRealCost = calculateRealCost;
      let inPerM = 0.075;
      let outPerM = 0.30;
      if (provider === 'deepseek') {
        if (modelId === 'deepseek-reasoner') {
          inPerM = 0.55;
          outPerM = 2.19;
        } else {
          inPerM = 0.14;
          outPerM = 0.28;
        }
      } else {
        if (modelId.includes('3.1-pro') || modelId.includes('pro')) {
          inPerM = 1.25;
          outPerM = 5.00;
        } else if (modelId.includes('flash-lite') || modelId.includes('8b')) {
          inPerM = 0.0375;
          outPerM = 0.15;
        } else {
          inPerM = 0.075;
          outPerM = 0.30;
        }
      }
      const cost = ((promptTokens / 1000000) * inPerM) + ((outputTokens / 1000000) * outPerM);
      return cost < 0.0001 && cost > 0 ? '$0.0001' : `$${cost.toFixed(4)}`;
    };

    // ═══════════════════════════════════════
    // INDEXEDDB ENGINE (High-Capacity Storage)
    // ═══════════════════════════════════════
    const DB_NAME = 'GeminiTranslatorDB';
    const DB_VERSION = 1;

    const openAppDB = () => {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        try {
          const req = window.indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('history')) {
              db.createObjectStore('history', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('glossaries')) {
              db.createObjectStore('glossaries', { keyPath: 'name' });
            }
            if (!db.objectStoreNames.contains('kv')) {
              db.createObjectStore('kv', { keyPath: 'key' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    };

    const dbGetAll = async (storeName) => {
      const db = await openAppDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    };

    const dbPut = async (storeName, value) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(value);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    const dbDelete = async (storeName, key) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    const dbClear = async (storeName) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.clear();
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    // ═══════════════════════════════════════
    // BACKGROUND WEB WORKER BRIDGE (Zero UI Stutter)
    // ═══════════════════════════════════════
    let appWorker = null;
    let workerMsgId = 0;
    const workerCallbacks = new Map();

    const initAppWorker = () => {
      try {
        if (typeof window !== 'undefined' && window.Worker && !appWorker) {
          appWorker = new Worker('./worker.js');
          appWorker.onmessage = (e) => {
            const { id, success, error, ...rest } = e.data || {};
            if (workerCallbacks.has(id)) {
              const { resolve, reject } = workerCallbacks.get(id);
              workerCallbacks.delete(id);
              if (success) resolve(rest);
              else reject(new Error(error || 'Worker operation failed'));
            }
          };
          appWorker.onerror = (err) => {
            console.warn('Worker error:', err);
          };
        }
      } catch (e) {
        console.warn('Web Worker not available, falling back seamlessly to main thread:', e);
      }
    };

    const callWorker = (type, payload) => {
      return new Promise((resolve, reject) => {
        try {
          if (!appWorker) initAppWorker();
          if (!appWorker) return resolve(null);
          const id = ++workerMsgId;
          workerCallbacks.set(id, { resolve, reject });
          appWorker.postMessage({ id, type, payload });
        } catch (e) {
          resolve(null);
        }
      });
    };

    const formatDuration = (ms) => {
      if (!ms || ms <= 0) return '0.0s';
      const totalSec = ms / 1000;
      if (totalSec < 1) {
        return `${totalSec.toFixed(2)}s`;
      }
      if (totalSec < 60) {
        return `${totalSec.toFixed(1)}s`;
      }
      const totalMin = Math.floor(totalSec / 60);
      const remSec = Math.floor(totalSec % 60);
      if (totalMin < 60) {
        return `${totalMin}m ${remSec}s`;
      }
      const totalHours = Math.floor(totalMin / 60);
      const remMin = totalMin % 60;
      if (totalHours < 24) {
        return `${totalHours}h ${remMin}m ${remSec}s`;
      }
      const days = Math.floor(totalHours / 24);
      const remHours = totalHours % 24;
      return `${days}d ${remHours}h ${remMin}m`;
    };

    // ═══════════════════════════════════════
    // UTILITY FUNCTIONS
    // ═══════════════════════════════════════
    const fetchRetry = async (url, opts, retries = 3, timeoutMs = 45000) => {
      let delay = 1500;
      for (let i = 0; i < retries; i++) {
        if (opts?.signal?.aborted) {
          const err = new Error('Translation paused.');
          err.name = 'AbortError';
          throw err;
        }

        const attemptController = new AbortController();
        let timeoutId = setTimeout(() => {
          attemptController.abort(new Error('Request timed out (45s).'));
        }, timeoutMs);

        const onParentAbort = () => {
          clearTimeout(timeoutId);
          attemptController.abort(opts.signal?.reason || new Error('Translation paused.'));
        };

        if (opts?.signal) {
          opts.signal.addEventListener('abort', onParentAbort, { once: true });
        }

        try {
          const fetchOpts = { ...opts, signal: attemptController.signal };
          const r = await fetch(url, fetchOpts);
          clearTimeout(timeoutId);
          if (opts?.signal) opts.signal.removeEventListener('abort', onParentAbort);

          if (r.status === 429) {
            const errText = await r.text().catch(() => '');
            const err = new Error(`Rate limit (429): ${errText.substring(0, 150)}`);
            err.status = 429;
            throw err;
          }
          if (r.status >= 500 && i < retries - 1) {
            if (opts?.signal?.aborted) {
              const err = new Error('Translation paused.');
              err.name = 'AbortError';
              throw err;
            }
            const msg = r.status === 503
              ? `Google server high demand (503). Retrying in ${(delay / 1000).toFixed(1)}s... (${i + 1}/${retries})`
              : `API Error ${r.status}. Retrying in ${(delay / 1000).toFixed(1)}s... (${i + 1}/${retries})`;
            console.warn(msg);
            
            await new Promise((resolve, reject) => {
              const timer = setTimeout(resolve, delay);
              if (opts?.signal) {
                const onAbort = () => {
                  clearTimeout(timer);
                  const err = new Error('Translation paused.');
                  err.name = 'AbortError';
                  reject(err);
                };
                opts.signal.addEventListener('abort', onAbort, { once: true });
              }
            });
            delay *= 1.5;
            continue;
          }
          return r;
        } catch (e) {
          clearTimeout(timeoutId);
          if (opts?.signal) opts.signal.removeEventListener('abort', onParentAbort);

          if (opts?.signal?.aborted || (e.name === 'AbortError' && opts?.signal?.aborted)) {
            const err = new Error('Translation paused.');
            err.name = 'AbortError';
            throw err;
          }

          if (e.status === 429 || (e.message || '').includes('429')) {
            throw e;
          }

        const single = localStorage.getItem(`${provider}ApiKey`) || (provider === 'gemini' ? (localStorage.getItem('apiKey') || '') : '');
        if (single) allKeys.push(single);
      }

      if (allKeys.length === 0) throw new Error(`${provider.toUpperCase()} API key required. Please configure your key in Settings ⚙️.`);

      let keyIndex = 0;
      const getActiveKey = () => allKeys[keyIndex % allKeys.length];
      const rotateKey = () => { keyIndex++; return getActiveKey(); };

      const compactLines = sampleChapters.map(c => {
        let line = `${c.index}. ${c.rawName || ''}`;
        if (c.internalTitle) line += ` -> "${c.internalTitle}"`;

      }).join('\n');

      const customUserRule = customInstruction ? `\nUSER CUSTOM INSTRUCTIONS:\n${customInstruction}\n` : '';

      const prompt = `You are an expert digital eBook editor and Table of Contents specialist.
Task: Standardize raw/scraped Table of Contents entries into clean, readable, professional titles by analyzing both file names AND the internal chapter text snippet provided.

CRITICAL RULES:
1. PRESERVE NOVEL HIERARCHY & SPECIAL SECTIONS:
   - If an entry is a Volume, Arc, Year, or Book (e.g. "Year 3, Volume 3", "Volume 1", "Book 2: Earth", "Arc 4"), PRESERVE the Volume/Arc name.
   - If an entry is a Prologue, Epilogue, Interlude, Monologue, Side Story (SS), Afterword, Synopsis, or Illustrations, KEEP its authentic character name (e.g. "Prologue: Shiina Hiyori's Monologue", "Illustrations", "Epilogue", "Side Story - Kushida", "1.1", "7.1", "E.1").
   - If an entry has Parts or Sub-chapters (e.g. "Part 1", "Part 2", "Chapter 1 - Part 1"), preserve the Part structure.
   - DO NOT flatten or renumber everything into a generic "Chapter 1 to 500" if the book is an anthology or light novel series with Volumes/Years/Arcs!
2. CLEAN STORY CHAPTERS:
   - Use the internal text snippet and heading to produce the true chapter title (e.g. "Chapter 1 - The Structure of Japanese Society").
   - Strip ugly web scrape artifacts and file paths (.xhtml, .html).${customUserRule}

Book Title: ${bookTitle || 'Unknown'}

Chapters to clean:
${compactLines}

Return strictly a JSON object with this exact format:
{
  "cleanedTitle": "Official Book Title",
  "chapters": [
    { "index": 1, "cleanedName": "Cleaned Title" }
  ]
}`;

      const safetySettings = [
        { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_NONE' },
        { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_NONE' },
        { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },
        { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' },
        { category: 'HARM_CATEGORY_CIVIC_INTEGRITY', threshold: 'BLOCK_NONE' }
      ];

      // Strictly verified official Gemini 3 Flash endpoints (high speed & high quota)
      const preferredModel = localStorage.getItem('geminiModel') || 'gemini-3.5-flash-lite';
      const geminiModels = Array.from(new Set([
        preferredModel,
        'gemini-3.5-flash-lite',
        'gemini-3.1-flash-lite',
        'gemini-3.5-flash',
        'gemini-3.6-flash',
        'gemini-3.7-flash',

      let modelIdx = 0;
      const maxAttempts = 30; // High resilience
      let backoffDelay = 2000;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const currentKey = getActiveKey();
        try {
          let rawJson = '';
          let data = null;

          if (provider === 'gemini' || !provider) {
            const currentModel = geminiModels[modelIdx % geminiModels.length];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${currentKey}`;
            
            const ctrl = new AbortController();
            const timeoutId = setTimeout(() => ctrl.abort(), 14000);

            let res;
            try {
              res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: ctrl.signal,
                body: JSON.stringify({
                  contents: [{ role: 'user', parts: [{ text: prompt }] }],
                  safetySettings,
                  generationConfig: {
                    temperature: 0.1,
                    responseMimeType: 'application/json',
                    thinkingConfig: { thinkingBudget: 0 }
                  }
                })
              });
            } finally {
              clearTimeout(timeoutId);
            }

            if (!res.ok) {
              const errTxt = await res.text().catch(() => '');
              const is404 = res.status === 404 || errTxt.includes('no longer available') || errTxt.includes('not found') || errTxt.includes('is not supported');
              const is503 = res.status === 503 || res.status === 500 || res.status === 502 || res.status === 504 || errTxt.includes('high demand') || errTxt.includes('UNAVAILABLE') || errTxt.includes('overloaded');
              const is429 = res.status === 429 || errTxt.includes('quota') || errTxt.includes('RESOURCE_EXHAUSTED') || errTxt.includes('rate limit');

              if (is404 || is503) {
                modelIdx++;
                const nextModel = geminiModels[modelIdx % geminiModels.length];
                if (typeof onRetryStatus === 'function') onRetryStatus(`Model ${currentModel} ${is503 ? 'high demand' : 'unavailable'}. Trying ${nextModel}...`);
                await new Promise(r => setTimeout(r, 800));
                continue;
              }

              if (is429) {
                rotateKey();
                modelIdx++;
                const nextModel = geminiModels[modelIdx % geminiModels.length];
                const keyNum = (keyIndex % allKeys.length) + 1;
                
                const waitSec = Math.round(backoffDelay / 1000);
                for (let s = waitSec; s > 0; s--) {
                  if (typeof onRetryStatus === 'function') {
                    onRetryStatus(`Rate limit cooldown: retrying in ${s}s with Key ${keyNum}/${allKeys.length} (${nextModel})...`);
                  }
                  await new Promise(r => setTimeout(r, 1000));
                }
                
                backoffDelay = Math.min(backoffDelay * 1.3, 8000);
                continue;
              }
              throw new Error(`Gemini Error ${res.status}: ${errTxt.substring(0, 150)}`);
            }
            data = await res.json();
            
            // Correctly filter out thought reasoning tokens from Gemini 3
            const candidateParts = data?.candidates?.[0]?.content?.parts || [];
            const actualParts = candidateParts.filter(p => !p.thought);
            rawJson = actualParts.length > 0
              ? actualParts.map(p => p.text || '').join('')
              : (candidateParts.map(p => p.text || '').join(''));
          } else if (provider === 'deepseek') {
            const ctrl = new AbortController();
            const timeoutId = setTimeout(() => ctrl.abort(), 15000);
            let res;
            try {
              res = await fetch('https://api.deepseek.com/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentKey}` },
                signal: ctrl.signal,
                body: JSON.stringify({
                  model: 'deepseek-chat',
                  messages: [{ role: 'user', content: prompt }],
                  response_format: { type: 'json_object' }
                })
              });
            } finally {
              clearTimeout(timeoutId);
            }
            if (!res.ok) {
              const errTxt = await res.text().catch(() => '');
              if (res.status === 429 || res.status === 503) {
                await new Promise(r => setTimeout(r, backoffDelay));
                backoffDelay = Math.min(backoffDelay * 1.4, 8000);
                continue;
              }
              throw new Error(`DeepSeek Error ${res.status}: ${errTxt.substring(0, 150)}`);
            }
            data = await res.json();
            rawJson = data.choices?.[0]?.message?.content || '';
          } else if (provider === 'openai') {
            const ctrl = new AbortController();
            const timeoutId = setTimeout(() => ctrl.abort(), 15000);
            let res;
            try {
              res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentKey}` },
                signal: ctrl.signal,
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [{ role: 'user', content: prompt }],
                  response_format: { type: 'json_object' }
                })
              });
            } finally {
              clearTimeout(timeoutId);
            }
            if (!res.ok) {
              const errTxt = await res.text().catch(() => '');
              if (res.status === 429 || res.status === 503) {
                await new Promise(r => setTimeout(r, backoffDelay));
                backoffDelay = Math.min(backoffDelay * 1.4, 8000);
                continue;
              }
              throw new Error(`OpenAI Error ${res.status}: ${errTxt.substring(0, 150)}`);
            }
            data = await res.json();
            rawJson = data.choices?.[0]?.message?.content || '';
          } else if (provider === 'claude') {
            const ctrl = new AbortController();
            const timeoutId = setTimeout(() => ctrl.abort(), 15000);
            let res;
            try {
              res = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': currentKey, 'anthropic-version': '2023-06-01', 'dangerously-allow-browser': 'true' },
                signal: ctrl.signal,
                body: JSON.stringify({
                  model: 'claude-3-5-haiku-20241022',
                  max_tokens: 4096,
                  messages: [{ role: 'user', content: prompt }]
                })
              });
            } finally {
              clearTimeout(timeoutId);
            }
            if (!res.ok) {
              const errTxt = await res.text().catch(() => '');
              if (res.status === 429 || res.status === 503) {
                await new Promise(r => setTimeout(r, backoffDelay));
                backoffDelay = Math.min(backoffDelay * 1.4, 8000);
                continue;
              }
              throw new Error(`Claude Error ${res.status}: ${errTxt.substring(0, 150)}`);
            }
            data = await res.json();
            rawJson = data.content?.[0]?.text || '';
          }

          let clean = rawJson.replace(/^\`\`\`json\s*/i, '').replace(/\s*\`\`\`$/i, '').trim();
          
          // Fallback regex to extract JSON object if wrapped in text
          if (!clean.startsWith('{')) {
            const match = clean.match(/\{[\s\S]*\}/);
            if (match) clean = match[0];
          }

          const parsed = JSON.parse(clean);
          
          let pTok = Math.ceil(prompt.length / 4);
          let oTok = Math.ceil(rawJson.length / 4);
          if (data?.usageMetadata) {
            pTok = data.usageMetadata.promptTokenCount || pTok;
            oTok = data.usageMetadata.candidatesTokenCount || oTok;
          } else if (data?.usage) {
            pTok = data.usage.prompt_tokens || data.usage.input_tokens || pTok;
            oTok = data.usage.completion_tokens || data.usage.output_tokens || oTok;
          }

          const activeModelName = provider === 'gemini' || !provider ? geminiModels[modelIdx % geminiModels.length] : (provider === 'deepseek' ? 'deepseek-chat' : (provider === 'openai' ? 'gpt-4o-mini' : 'claude-3-5-haiku'));

          return {
            ...parsed,
            usage: {
              promptTokens: pTok,
              outputTokens: oTok,
              totalTokens: pTok + oTok,
              model: activeModelName,
              provider
            }
          };
        } catch (err) {
          const isTimeout = err.name === 'AbortError';
          const isTransient = isTimeout || (err.message || '').includes('429') || (err.message || '').includes('503') || (err.message || '').includes('quota') || (err.message || '').includes('demand') || (err.message || '').includes('404');
          if (isTransient && attempt < maxAttempts - 1) {
            modelIdx++;
            rotateKey();
            if (typeof onRetryStatus === 'function') {
              onRetryStatus(isTimeout ? 'Request timed out (14s). Switched to next key/model...' : `Transient error (${err.message.substring(0, 40)}). Retrying...`);
            }
            await new Promise(r => setTimeout(r, 1000));
            continue;
          }
          if (attempt === maxAttempts - 1) throw err;
        }
      }
    };

const formatModelName = (id, displayName) => {
      if (displayName && displayName !== id && !displayName.startsWith('models/')) return displayName;
      if (id.startsWith('gemini-')) {
        return id
          .split('-')
          .map((part, idx) => {
            if (idx === 0) return 'Gemini';
            if (/^\d+(\.\d+)?$/.test(part)) return part;
            if (part.toLowerCase() === '8b') return '8B';
            return part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(' ');
      }
      if (id.startsWith('gemma-')) {
        return id
          .split('-')
          .map((part, idx) => {
            if (idx === 0) return 'Gemma';
            return part.toUpperCase();
          })
          .join(' ');
      }
      return id.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
    };

    const groupModelsByCompany = (models) => {
      const groups = {
        '⭐ RECOMMENDED FREE TIER': [],
        '👑 FLAGSHIP & DEEP REASONING': [],
        '⚡ ULTRA FAST & LITE': [],
        '🧪 OTHER & OPEN WEIGHTS': []
      };

      for (const m of models) {
        const id = (m.id || '').toLowerCase();
        const name = (m.name || '').toLowerCase();

        if (id === 'gemini-2.5-flash' || id === 'gemini-2.0-flash' || id === 'gemini-1.5-flash' || name.includes('recommended free tier') || name.includes('fast & stable') || name.includes('highest free quota')) {
          groups['⭐ RECOMMENDED FREE TIER'].push(m);
        } else if (id.includes('pro') || id.startsWith('gemini-3.7') || (id.startsWith('gemini-3.5-flash') && !id.includes('lite')) || name.includes('flagship') || name.includes('literary')) {
          groups['👑 FLAGSHIP & DEEP REASONING'].push(m);
        } else if (id.includes('lite') || id.includes('8b') || id.includes('nano') || name.includes('lite') || name.includes('lowest cost') || name.includes('high speed')) {
          groups['⚡ ULTRA FAST & LITE'].push(m);
        } else {
          groups['🧪 OTHER & OPEN WEIGHTS'].push(m);
        }
      }

      return Object.entries(groups).filter(([_, list]) => list.length > 0);
    };

    const fetchGeminiModels = async (apiKey) => {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}&pageSize=100`);
      if (!r.ok) throw new Error('Failed to fetch models');
      const j = await r.json();

          !m.name.includes('gecko'))
        .map(m => {
          const id = m.name.replace('models/', '');
          return { id, name: formatModelName(id, m.displayName) };
        });

            // Sort models logically: Gemini 3 Flash -> Lite -> Pro
            valid.sort((a, b) => {
        const getRank = id => {
          if (id.startsWith('gemini-3.7-flash')) return -40;
          if (id.startsWith('gemini-3.6-flash')) return -39;
          if (id.startsWith('gemini-3.5-flash-lite')) return -38;

          if (id.startsWith('gemini-3.1-pro-preview')) return -35;
          if (id.startsWith('gemini-3-flash-preview')) return -34;
          return 0;

        return getRank(a.id) - getRank(b.id);
      });
      return valid;
    };

            type: 'button',
            onClick: () => handleSelect(searchQuery.trim()),
            className: 'mb-1.5 p-2 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800/60 text-indigo-700 dark:text-indigo-300 text-xs font-bold flex items-center justify-between hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-all cursor-pointer'
          },
            h('span', { className: 'truncate flex items-center gap-1.5' }, ic(Sparkles, 13), `Use custom: "${searchQuery.trim()}"`),
            h('span', { className: 'text-[10px] px-1.5 py-0.5 rounded bg-indigo-200 dark:bg-indigo-800 text-indigo-800 dark:text-indigo-200 font-semibold' }, '↵ Enter')
          ),

          // Options List
          h('div', { className: 'overflow-y-auto custom-scrollbar flex-1 space-y-0.5 max-h-56' },
            !searchQuery.trim() && h('div', { className: 'px-2 py-1 text-[10px] font-bold uppercase tracking-wider text-slate-400' }, 'Popular Languages'),
            !searchQuery.trim() && POPULAR_LANGS.filter(l => options.includes(l)).map(lang => {
              const isSelected = value === lang;
              return h('button', {
                key: 'pop-' + lang,
                type: 'button',
                onClick: () => handleSelect(lang),
                className: `w-full px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center justify-between transition-all cursor-pointer text-left ${
                  isSelected
                    ? 'bg-indigo-600 text-white shadow-sm'
                    : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`
              },
                h('span', { className: 'truncate' }, lang),
                isSelected && ic(Check, 14)
              );
            }),

            !searchQuery.trim() && h('div', { className: 'px-2 pt-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400 border-t border-slate-100 dark:border-slate-800 mt-1' }, 'All Languages'),

            filteredOptions.length > 0 ? (
              filteredOptions.map((lang) => {
                const isSelected = value === lang;
                return h('button', {
                  key: lang,
                  type: 'button',
                  onClick: () => handleSelect(lang),
                  className: `w-full px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center justify-between transition-all cursor-pointer text-left ${
                    isSelected
                      ? 'bg-indigo-600 text-white shadow-sm'
                      : 'text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                  }`
                },
                  h('span', { className: 'truncate' }, lang),
                  isSelected && ic(Check, 14)
                );
              })
            ) : !hasCustomQuery && (
              h('div', { className: 'p-3 text-center text-xs text-slate-400' }, 'No preset languages found.')
            )
          )
        )
      );
    };

    // ══════════════════════════════════════════════════════════════════════
    // MOON+ READER ENGINE (OLED Black, Infinite Scroll, TTS Word Highlighter)
    // ══════════════════════════════════════════════════════════════════════
        // ══════════════════════════════════════════════════════════════════════
    // MOON+ READER ENGINE (OLED Black, Infinite Scroll, TTS Word Highlighter)
    // ══════════════════════════════════════════════════════════════════════
        // ══════════════════════════════════════════════════════════════════════
    // MOON+ READER ENGINE (OLED Black, Infinite Scroll, TTS Word Highlighter)
    // ══════════════════════════════════════════════════════════════════════
        // ══════════════════════════════════════════════════════════════════════
    // MOON+ READER ENGINE (Absolute Containment, OLED Black, TTS & TOC)
    // ══════════════════════════════════════════════════════════════════════
        // ══════════════════════════════════════════════════════════════════════
    // MOON+ READER ENGINE (Absolute Containment, OLED Black, TTS & TOC)
    // ══════════════════════════════════════════════════════════════════════
        // ══════════════════════════════════════════════════════════════════════
    // MOON+ READER ENGINE (Gesture Back, Clean Chapters, Words Count & TTS)
    // ══════════════════════════════════════════════════════════════════════
    const MoonReaderModal = ({ open, onClose, text, chapters, currentIdx, onChapterChange, theme, setTheme, font, setFont, fontSize, setFontSize, tgtLang }) => {
      if (!open) return null;

      // ── ANDROID GESTURE / BACK BUTTON LISTENER ──
      useEffect(() => {
        window.history.pushState({ readerModalOpen: true }, '');
        const handlePopState = () => {
          onClose();
        };
        window.addEventListener('popstate', handlePopState);
        return () => {
          window.removeEventListener('popstate', handlePopState);
        };
      }, []);

      // ── ACCURATE LINE-BY-LINE CHAPTER PARSER (ZERO TRUNCATION) ──
      const safeChapters = useMemo(() => {
        let list = Array.isArray(chapters) && chapters.length > 0
          ? chapters.filter(c => c && typeof c === 'object')
          : [];

        if (list.length === 0 && text && typeof text === 'string') {
          const lines = text.split(/\r?\n/);
          const isHeading = (l) => {
            const trimmed = l.trim();
            if (trimmed.length < 2 || trimmed.length > 120) return false;
            return /^(?:(?:Chapter|第[0-9零一二三四五六七八九十百千万]+[章节回节卷集部]|Section|Volume|Part|Book|Arc)\s*[\d\w\s:—\-–]+|[【\[(]?(?:Preface|Prologue|Epilogue|Side Story|Extra|序章|前言|楔子|后记|番外)[\]】)]?.*)/i.test(trimmed);
          };

          const parsed = [];
          let curTitle = 'Prologue / Preface';
          let curLines = [];

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];
            if (isHeading(line)) {
              if (curLines.length > 0) {
                parsed.push({ title: curTitle, content: curLines.join('\n').trim() });
                curLines = [];
              }
              curTitle = line.trim();
            } else {
              curLines.push(line);
            }
          }

          if (curLines.length > 0) {
            parsed.push({ title: curTitle, content: curLines.join('\n').trim() });
          }

          if (parsed.length > 1) list = parsed;
        }

        return list.length > 0 ? list : [{ title: 'Document', content: text || '' }];
      }, [chapters, text]);

      const [activeChapterIdx, setActiveChapterIdx] = useState(() => Math.min(Math.max(0, currentIdx || 0), safeChapters.length - 1));
      const [scrollPercent, setScrollPercent] = useState(0);
      const [showOverlay, setShowOverlay] = useState(true);
      const [showVisualSheet, setShowVisualSheet] = useState(false);
      const [showTocDrawer, setShowTocDrawer] = useState(false);
      const [lineHeight, setLineHeight] = useState(() => parseFloat(localStorage.getItem('readerLineHeight')) || 1.8);
      const [marginWidth, setMarginWidth] = useState(() => localStorage.getItem('readerMarginWidth') || 'normal');
      const [continuousScroll, setContinuousScroll] = useState(() => localStorage.getItem('readerContinuous') !== 'false');

      // TTS State
      const [isTtsActive, setIsTtsActive] = useState(false);
      const [isTtsPlaying, setIsTtsPlaying] = useState(false);
      const [ttsSpeed, setTtsSpeed] = useState(() => parseFloat(localStorage.getItem('readerTtsSpeed')) || 1.0);
      const [ttsHighlightColor, setTtsHighlightColor] = useState(() => localStorage.getItem('readerHighlightColor') || 'amber');
      const [currentSentenceIdx, setCurrentSentenceIdx] = useState(-1);
      const [currentWordRange, setCurrentWordRange] = useState(null);
      const [ttsSentences, setTtsSentences] = useState([]);
      const utteranceRef = useRef(null);
      const contentContainerRef = useRef(null);

      const currentChapter = safeChapters[activeChapterIdx] || safeChapters[0] || { title: 'Document', content: '' };
      const rawTitle = currentChapter.title || `Chapter ${activeChapterIdx + 1}`;
      const rawContent = currentChapter.content || currentChapter.text || text || '';

      // Normalize theme key
      const normalizedTheme = theme === 'dark' ? 'oled' : (theme === 'paper' ? 'sepia' : (theme || 'oled'));

      const themeConfig = {
        oled: { hexBg: '#000000', hexText: '#F3F4F6', hexBarBg: '#0F0F11', hexBorder: '#27272A', accent: '#14B8A6', name: 'OLED Black' },
        sepia: { hexBg: '#FBF0D9', hexText: '#382816', hexBarBg: '#F4E5C4', hexBorder: '#E6D3AF', accent: '#B45309', name: 'Warm Paper' },
        slate: { hexBg: '#0B0F19', hexText: '#E2E8F0', hexBarBg: '#131B2E', hexBorder: '#1E293B', accent: '#6366F1', name: 'Midnight' },
        light: { hexBg: '#FFFFFF', hexText: '#0F172A', hexBarBg: '#F8FAFC', hexBorder: '#E2E8F0', accent: '#4F46E5', name: 'Clean White' }
      };
      const activeTheme = themeConfig[normalizedTheme] || themeConfig.oled;

      const fontFamilies = {
        serif: 'Georgia, Cambria, "Times New Roman", serif',
        sans: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
        mono: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace'
      };

      const marginPaddings = {
        tight: 'max-w-4xl px-4 sm:px-8',
        normal: 'max-w-3xl px-6 sm:px-12',
        wide: 'max-w-2xl px-8 sm:px-16'
      };

      const highlightColors = {
        amber: { sentenceStyle: { backgroundColor: 'rgba(251, 191, 36, 0.35)', borderRadius: '4px', padding: '2px 4px' }, wordStyle: { backgroundColor: '#FBBF24', color: '#000000', fontWeight: 'bold', borderRadius: '3px', padding: '0 2px' } },
        cyan: { sentenceStyle: { backgroundColor: 'rgba(34, 211, 238, 0.35)', borderRadius: '4px', padding: '2px 4px' }, wordStyle: { backgroundColor: '#22D3EE', color: '#000000', fontWeight: 'bold', borderRadius: '3px', padding: '0 2px' } },
        emerald: { sentenceStyle: { backgroundColor: 'rgba(52, 211, 153, 0.35)', borderRadius: '4px', padding: '2px 4px' }, wordStyle: { backgroundColor: '#34D399', color: '#000000', fontWeight: 'bold', borderRadius: '3px', padding: '0 2px' } },
        purple: { sentenceStyle: { backgroundColor: 'rgba(192, 132, 252, 0.35)', borderRadius: '4px', padding: '2px 4px' }, wordStyle: { backgroundColor: '#C084FC', color: '#FFFFFF', fontWeight: 'bold', borderRadius: '3px', padding: '0 2px' } },
        rose: { sentenceStyle: { backgroundColor: 'rgba(251, 113, 133, 0.35)', borderRadius: '4px', padding: '2px 4px' }, wordStyle: { backgroundColor: '#FB7185', color: '#FFFFFF', fontWeight: 'bold', borderRadius: '3px', padding: '0 2px' } }
      };
      const activeHighlight = highlightColors[ttsHighlightColor] || highlightColors.amber;

      // Tokenize paragraphs into sentences for TTS
      useEffect(() => {
        if (!rawContent) return;
        const paragraphs = rawContent.split(/\r?\n/).map(p => p.trim()).filter(Boolean);
        const sentenceList = [];
        paragraphs.forEach((p, pIdx) => {
          const matched = p.match(/[^.!?。！？]+[.!?。！？]*/g) || [p];
          matched.forEach((s, sIdx) => {
            const trimmed = s.trim();
            if (trimmed) {
              sentenceList.push({ text: trimmed, paragraphIdx: pIdx, sentenceIdx: sIdx, fullId: `s-${pIdx}-${sIdx}` });
            }
          });
        });
        setTtsSentences(sentenceList);
      }, [rawContent, activeChapterIdx]);

      // Scroll progress tracking
      const handleScroll = (e) => {
        const el = e.currentTarget;
        const total = el.scrollHeight - el.clientHeight;
        if (total > 0) {
          const pct = Math.min(100, Math.max(0, Math.round((el.scrollTop / total) * 100)));
          setScrollPercent(pct);
        }
      };

      // TTS Controller (Dual Native + Web Speech Engine)
      const startTTS = (startSentenceIdx = 0) => {
        if (ttsSentences.length === 0) return;
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        window.NativeBridge?.stopNativeSpeech?.();

        setIsTtsActive(true);
        setIsTtsPlaying(true);
        let sIdx = Math.max(0, Math.min(startSentenceIdx, ttsSentences.length - 1));

        const speakNext = (idx) => {
          if (idx >= ttsSentences.length) {
            if (activeChapterIdx < safeChapters.length - 1) {
              const nextChap = activeChapterIdx + 1;
              setActiveChapterIdx(nextChap);
              onChapterChange?.(nextChap);
              setTimeout(() => startTTS(0), 600);
            } else {
              setIsTtsActive(false);
              setIsTtsPlaying(false);
            }
            return;
          }

          setCurrentSentenceIdx(idx);
          const sentenceObj = ttsSentences[idx];

          // Try native TTS on Android first
          if (window.NativeBridge?.speakNative) {
            window.NativeBridge.speakNative(sentenceObj.text, ttsSpeed);
          }

          if (window.speechSynthesis) {
            const utter = new SpeechSynthesisUtterance(sentenceObj.text);
            utter.rate = ttsSpeed;
            utter.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const targetVoice = voices.find(v => (v.lang || '').toLowerCase().startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Premium'))) ||
                               voices.find(v => (v.lang || '').toLowerCase().startsWith('en')) || voices[0];
            if (targetVoice) utter.voice = targetVoice;

            utter.onboundary = (event) => {
              if (event.name === 'word') {
                setCurrentWordRange({ start: event.charIndex, length: event.charLength || 5 });
              }
            };

            utter.onend = () => speakNext(idx + 1);
            utter.onerror = () => speakNext(idx + 1);

            utteranceRef.current = utter;
            window.speechSynthesis.speak(utter);
          } else {
            // Native auto-advance timer fallback
            const duration = Math.max(1500, (sentenceObj.text.length / 15) * 1000 / ttsSpeed);
            setTimeout(() => {
              if (isTtsActive) speakNext(idx + 1);
            }, duration);
          }

          const sentenceEl = document.getElementById(sentenceObj.fullId);
          if (sentenceEl) {
            sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        };

        speakNext(sIdx);
      };

      const pauseTTS = () => {
        if (isTtsPlaying) {
          if (window.speechSynthesis) window.speechSynthesis.pause();
          window.NativeBridge?.stopNativeSpeech?.();
          setIsTtsPlaying(false);
        } else {
          if (window.speechSynthesis) window.speechSynthesis.resume();
          else startTTS(currentSentenceIdx >= 0 ? currentSentenceIdx : 0);
          setIsTtsPlaying(true);
        }
      };

      const stopTTS = () => {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        window.NativeBridge?.stopNativeSpeech?.();
        setIsTtsActive(false);
        setIsTtsPlaying(false);
        setCurrentSentenceIdx(-1);
        setCurrentWordRange(null);
      };

      const skipTTSSentence = (direction) => {
        const next = Math.max(0, Math.min(currentSentenceIdx + direction, ttsSentences.length - 1));
        startTTS(next);
      };

      const changeChapter = (newIdx) => {
        const target = Math.max(0, Math.min(newIdx, safeChapters.length - 1));
        setActiveChapterIdx(target);
        onChapterChange?.(target);
        stopTTS();
        if (contentContainerRef.current) {
          contentContainerRef.current.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.NativeBridge?.haptic?.('selection');
      };

      const paragraphs = rawContent.split(/\r?\n/).map(p => p.trim()).filter(Boolean);

      return h('div', {
        style: {
          position: 'fixed',
          top: 0,
          left: 0,
          width: '100vw',
          height: '100vh',
          zIndex: 99999,
          backgroundColor: activeTheme.hexBg,
          color: activeTheme.hexText,
          fontFamily: fontFamilies[font] || fontFamilies.serif,
          overflow: 'hidden'
        }
      },
        // ── TOP OVERLAY HEADER (Moon+ Style) ──
        h('header', {
          style: {
            position: 'absolute',
            top: 0,
            left: 0,
            right: 0,
            width: '100%',
            height: '56px',
            zIndex: 50,
            backgroundColor: activeTheme.hexBarBg,
            borderBottom: `1px solid ${activeTheme.hexBorder}`,
            color: activeTheme.hexText,
            transform: showOverlay ? 'translateY(0)' : 'translateY(-100%)',
            transition: 'transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)'
          },
          className: 'px-3 py-2 flex items-center justify-between shadow-2xl backdrop-blur-md'
        },
          // Left: Back Arrow to Exit Reader
          h('button', {
            onClick: (e) => {
              e.stopPropagation();
              stopTTS();
              onClose();
              window.NativeBridge?.haptic?.('selection');
            },
            className: 'px-3 py-1.5 rounded-xl hover:bg-white/10 active:scale-90 transition-all text-inherit cursor-pointer flex items-center gap-1.5 font-bold',
            'aria-label': 'Back to App'
          },
            ic(ArrowLeft, 20),
            h('span', { className: 'text-xs font-semibold' }, 'Back')
          ),

          // Center: Book & Chapter Title (Tap to open TOC)
          h('div', {
            className: 'flex-1 min-w-0 px-3 text-center cursor-pointer active:scale-95 transition-transform',
            onClick: (e) => {
              e.stopPropagation();
              setShowTocDrawer(true);
            }
          },
            h('p', { className: 'text-xs sm:text-sm font-bold truncate tracking-tight text-inherit' }, rawTitle),
            h('p', { className: 'text-[10px] opacity-60 truncate font-mono' }, `Part ${activeChapterIdx + 1} of ${safeChapters.length}`)
          ),

          // Right: Visual Options & Palette Toggle
          h('div', { className: 'flex items-center gap-1 shrink-0' },
            h('button', {
              onClick: (e) => {
                e.stopPropagation();
                setShowVisualSheet(prev => !prev);
                window.NativeBridge?.haptic?.('selection');
              },
              className: `p-2 rounded-xl text-inherit transition-all active:scale-90 cursor-pointer ${showVisualSheet ? 'bg-teal-500 text-white shadow' : 'hover:bg-white/10'}`,
              title: 'Visual Options & Typography'
            }, ic(Type, 18)),
            h('button', {
              onClick: (e) => {
                e.stopPropagation();
                const themes = ['oled', 'sepia', 'slate', 'light'];
                const next = themes[(themes.indexOf(normalizedTheme) + 1) % themes.length];
                setTheme(next);
                localStorage.setItem('readerTheme', next);
                window.NativeBridge?.haptic?.('selection');
              },
              className: 'p-2 rounded-xl hover:bg-white/10 text-inherit transition-all active:scale-90 cursor-pointer',
              title: `Theme: ${activeTheme.name}`
            }, ic(Palette, 18))
          )
        ),

        // ── READING BODY (Tap center to toggle overlays) ──
        h('main', {
          ref: contentContainerRef,
          onScroll: handleScroll,
          onClick: (e) => {
            if (!window.getSelection()?.toString()) {
              setShowOverlay(prev => !prev);
              setShowVisualSheet(false);
            }
          },
          style: {
            position: 'absolute',
            top: 0,
            bottom: 0,
            left: 0,
            right: 0,
            overflowY: 'auto',
            WebkitOverflowScrolling: 'touch',
            zIndex: 10,
            backgroundColor: activeTheme.hexBg,
            color: activeTheme.hexText,
            paddingTop: '68px',
            paddingBottom: '110px'
          },
          className: `w-full mx-auto select-text ${marginPaddings[marginWidth] || marginPaddings.normal} transition-colors`
        },
          // Pull down for previous chapter card
          activeChapterIdx > 0 && h('div', {
            onClick: (e) => { e.stopPropagation(); changeChapter(activeChapterIdx - 1); },
            className: 'mb-8 py-3 px-4 rounded-2xl border border-dashed text-center text-xs opacity-60 hover:opacity-100 transition-opacity cursor-pointer flex items-center justify-center gap-2',
            style: { borderColor: activeTheme.hexBorder }
          },
            ic(ChevronUp, 16),
            h('span', null, `Previous: ${safeChapters[activeChapterIdx - 1]?.title || `Chapter ${activeChapterIdx}`}`)
          ),

          // Chapter Header
          h('div', { className: 'mb-8 pt-2 pb-4 border-b text-center', style: { borderColor: activeTheme.hexBorder } },
            h('h1', { className: 'text-xl sm:text-2xl font-bold tracking-tight' }, rawTitle),
            h('p', { className: 'text-xs opacity-50 mt-1 font-mono' }, `Part ${activeChapterIdx + 1} of ${safeChapters.length}`)
          ),

          // Story Paragraphs with dynamic font size and line height
          paragraphs.length === 0 ? h('p', { className: 'opacity-40 italic text-center py-20' }, 'No text content in this chapter...') :
            paragraphs.map((p, pIdx) => {
              const sentencesInP = ttsSentences.filter(s => s.paragraphIdx === pIdx);
              return h('p', {
                key: pIdx,
                className: 'mb-6 text-left tracking-normal text-justify break-words',
                style: {
                  fontSize: `${fontSize}px`,
                  lineHeight: `${lineHeight}`
                }
              },
                sentencesInP.length > 0 ?
                  sentencesInP.map((sObj, sIdx) => {
                    const globalSentenceIdx = ttsSentences.indexOf(sObj);
                    const isSentenceActive = isTtsActive && currentSentenceIdx === globalSentenceIdx;

                    return h('span', {
                      key: sIdx,
                      id: sObj.fullId,
                      onClick: (e) => {
                        if (isTtsActive) {
                          e.stopPropagation();
                          startTTS(globalSentenceIdx);
                        }
                      },
                      style: isSentenceActive ? activeHighlight.sentenceStyle : {},
                      className: 'transition-colors duration-150 rounded px-0.5'
                    },
                      isSentenceActive && currentWordRange ? (() => {
                        const str = sObj.text;
                        const wStart = currentWordRange.start || 0;
                        const wLen = currentWordRange.length || 5;
                        const before = str.substring(0, wStart);
                        const word = str.substring(wStart, wStart + wLen);
                        const after = str.substring(wStart + wLen);
                        return h(React.Fragment, null,
                          before,
                          h('span', { style: activeHighlight.wordStyle }, word),
                          after,
                          ' '
                        );
                      })() : sObj.text + ' '
                    );
                  })
                : p
              );
            }),

          // ── CONTINUOUS INFINITE SCROLL NEXT CHAPTER TRIGGER ──
          activeChapterIdx < safeChapters.length - 1 && h('div', {
            className: 'mt-16 pt-8 pb-12 border-t border-dashed text-center space-y-3',
            style: { borderColor: activeTheme.hexBorder }
          },
            h('p', { className: 'text-xs uppercase tracking-widest opacity-60 font-mono' }, `—— End of Part ${activeChapterIdx + 1} ——`),
            h('button', {
              onClick: (e) => {
                e.stopPropagation();
                changeChapter(activeChapterIdx + 1);
              },
              className: 'px-7 py-3.5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-bold text-xs rounded-2xl shadow-xl shadow-teal-500/25 active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-2 mx-auto'
            },
              ic(ChevronDown, 16),
              h('span', null, `Continue to Part ${activeChapterIdx + 2}: ${safeChapters[activeChapterIdx + 1]?.title || 'Next'}`)
            )
          )
        ),

        // ── FLOATING TTS NARRATION PLAYER BAR ──
        isTtsActive && h('div', {
          onClick: (e) => e.stopPropagation(),
          style: {
            position: 'absolute',
            bottom: '76px',
            left: '16px',
            right: '16px',
            maxWidth: '560px',
            margin: '0 auto',
            zIndex: 60,
            backgroundColor: activeTheme.hexBarBg,
            border: `1px solid ${activeTheme.hexBorder}`,
            color: activeTheme.hexText
          },
          className: 'rounded-2xl p-3.5 shadow-2xl flex flex-col gap-2.5 animate-in slide-in-from-bottom duration-200 backdrop-blur-xl'
        },
          h('div', { className: 'flex items-center justify-between text-xs' },
            h('div', { className: 'flex items-center gap-2 font-bold text-teal-400 truncate' },
              ic(Volume2, 16),
              h('span', { className: 'truncate' }, `Reading Aloud (Sentence ${currentSentenceIdx + 1}/${ttsSentences.length})`)
            ),
            h('button', {
              onClick: (e) => { e.stopPropagation(); stopTTS(); },
              className: 'p-1 text-slate-400 hover:text-white rounded-lg cursor-pointer active:scale-90'
            }, ic(X, 16))
          ),
          h('div', { className: 'flex items-center justify-between gap-3' },
            h('div', { className: 'flex items-center gap-1' },
              [0.75, 1.0, 1.25, 1.5, 2.0].map(spd => h('button', {

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { hasError: false, error: null } }
      static getDerivedStateFromError(e) { return { hasError: true, error: e } }
      render() { if (this.state.hasError) return h('div', { className: 'min-h-screen flex items-center justify-center bg-red-50 dark:bg-gray-900 p-8' }, h('div', { className: 'max-w-lg text-center' }, h('h1', { className: 'text-2xl font-bold text-red-600 mb-4' }, 'Something went wrong'), h('p', { className: 'text-gray-700 dark:text-gray-300 mb-4' }, this.state.error?.message), h('button', { onClick: () => this.setState({ hasError: false, error: null }), className: 'px-6 py-2 bg-indigo-600 text-white rounded-lg' }, 'Try Again'))); return this.props.children }
    }

    function App() {
      // --- Core State ---
      const [inputText, setInputText] = useState('');

      const [webImportData, setWebImportData] = useState(null);
      const [studioSubTab, setStudioSubTab] = useState(() => localStorage.getItem('studioSubTab') || 'split');
      const [error, setError] = useState('');

      // --- Translation State ---
      const [isTranslating, setIsTranslating] = useState(false);
      const [progress, setProgress] = useState(0);
      const [progressLabel, setProgressLabel] = useState('');
      const [translatedChapters, setTranslatedChapters] = useState([]);
      const [chapters, setChapters] = useState([]);
      const [lastUsageStats, setLastUsageStats] = useState(null);

      // --- Provider State ---
      const [provider, setProvider] = useState(() => localStorage.getItem('translationProvider') || 'gemini');
      const [apiKeysByProvider, setApiKeysByProvider] = useState(() => {
        const saved = localStorage.getItem('apiKeysByProvider');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (p && typeof p === 'object') return p;
          } catch (e) {}
        }
        const gKey = localStorage.getItem('geminiApiKey') || '';
        const dsKey = localStorage.getItem('deepseekApiKey') || '';
        const dlKey = localStorage.getItem('deeplApiKey') || '';
        const oaiKey = localStorage.getItem('openaiApiKey') || '';
        const cldKey = localStorage.getItem('claudeApiKey') || '';
        return {
          gemini: gKey ? [{ id: 'gemini-init', name: 'Primary Gemini Key', key: gKey }] : [],
          deepseek: dsKey ? [{ id: 'deepseek-init', name: 'Primary DeepSeek Key', key: dsKey }] : [],
          openai: oaiKey ? [{ id: 'openai-init', name: 'Primary OpenAI Key', key: oaiKey }] : [],
          claude: cldKey ? [{ id: 'claude-init', name: 'Primary Claude Key', key: cldKey }] : [],
          deepl: dlKey ? [{ id: 'deepl-init', name: 'Primary DeepL Key', key: dlKey }] : [],
          libre: []
        };
      });
      const [activeKeyIds, setActiveKeyIds] = useState(() => {
        const saved = localStorage.getItem('activeKeyIds');
        if (saved) {
          try {
            const p = JSON.parse(saved);
            if (p && typeof p === 'object') return p;
          } catch (e) {}
        }
        return {
          gemini: 'gemini-init',
          deepseek: 'deepseek-init',
          openai: 'openai-init',
          claude: 'claude-init',
          deepl: 'deepl-init',
          libre: null
        };
      });
      const [showKeys, setShowKeys] = useState({});

      const [libreUrl, setLibreUrl] = useState(() => localStorage.getItem('libreUrl') || 'https://libretranslate.com');
      const [includeApiKeysInBackup, setIncludeApiKeysInBackup] = useState(() => localStorage.getItem('includeApiKeysInBackup') === 'true');
      const [geminiModel, setGeminiModel] = useState(() => localStorage.getItem('geminiModel') || 'gemini-3.7-flash');
      const [deepseekModel, setDeepseekModel] = useState(() => localStorage.getItem('deepseekModel') || 'deepseek-chat');
      const [openaiModel, setOpenaiModel] = useState(() => localStorage.getItem('openaiModel') || 'gpt-4o-mini');
      const [claudeModel, setClaudeModel] = useState(() => localStorage.getItem('claudeModel') || 'claude-3-5-haiku-20241022');
      const [availableModels, setAvailableModels] = useState([]);
      const [customModel, setCustomModel] = useState('');
      const [useCustomModel, setUseCustomModel] = useState(false);
      const [customDeepseekModel, setCustomDeepseekModel] = useState('');
      const [useCustomDeepseekModel, setUseCustomDeepseekModel] = useState(false);
      const [customOpenaiModel, setCustomOpenaiModel] = useState('');
      const [useCustomOpenaiModel, setUseCustomOpenaiModel] = useState(false);
      const [customClaudeModel, setCustomClaudeModel] = useState('');
      const [useCustomClaudeModel, setUseCustomClaudeModel] = useState(false);
      const isStandalone = typeof window !== 'undefined' && (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true);
      const [deferredPrompt, setDeferredPrompt] = useState(globalDeferredPrompt);

      useEffect(() => {
        const handlePrompt = (e) => {
          e.preventDefault();
          globalDeferredPrompt = e;
          setDeferredPrompt(e);
        };
        const handleReady = () => {
          if (globalDeferredPrompt) setDeferredPrompt(globalDeferredPrompt);
        };
        window.addEventListener('beforeinstallprompt', handlePrompt);
        window.addEventListener('pwa-prompt-ready', handleReady);
        window.addEventListener('appinstalled', () => {
          globalDeferredPrompt = null;
          setDeferredPrompt(null);
          toast('Gemini Translator installed successfully!', 'success');
        });
        return () => {
          window.removeEventListener('beforeinstallprompt', handlePrompt);
          window.removeEventListener('pwa-prompt-ready', handleReady);
        };
      }, []);

      useEffect(() => {
        const handleLoadExtractedText = (e) => {
          const { title, text, count } = e.detail || {};
          if (text) {
            setInputText(text);
            setActiveTab('text');
            toast(`Loaded ${count ? count + ' ' : ''}chapters from EPUB Studio into Translator!`, 'success');
          }
        };
        window.addEventListener('load-extracted-text', handleLoadExtractedText);
        return () => window.removeEventListener('load-extracted-text', handleLoadExtractedText);
      }, []);


      const handleInstallPWA = async () => {
        const promptEvent = deferredPrompt || globalDeferredPrompt;
        if (promptEvent) {
          promptEvent.prompt();
          try {
            const choice = await promptEvent.userChoice;
            if (choice && choice.outcome === 'accepted') {
              toast('Gemini Translator installed successfully!', 'success');
            }
          } catch (e) {}
          globalDeferredPrompt = null;
          setDeferredPrompt(null);
        } else {
          alert('📱 How to install Gemini Translator on Samsung S24 / Microsoft Edge:\n\n1. Tap the "..." menu at the bottom.\n2. Look for "Install app" or tap "Add to phone" -> "Install app".\n   ⚠️ (Make sure to select "Install app", NOT "Add shortcut")\n\n💡 If you previously added a web shortcut, delete that shortcut from your home screen first, then reload this page.');
        }
      };

      // --- Multi-Key Profile Management Helpers ---
      const addApiKey = (prov) => {
        const id = genId();
        const provNames = { gemini: 'Gemini', deepseek: 'DeepSeek', openai: 'OpenAI', claude: 'Claude', deepl: 'DeepL', libre: 'LibreTranslate' };
        const provName = provNames[prov] || prov.toUpperCase();
        const newKey = { id, name: `${provName} Key ${(apiKeysByProvider[prov] || []).length + 1}`, key: '' };
        setApiKeysByProvider(prev => {
          const updated = { ...prev, [prov]: [...(prev[prov] || []), newKey] };
          localStorage.setItem('apiKeysByProvider', JSON.stringify(updated));
          return updated;
        });
        if (!activeKeyIds[prov]) {
          setActiveKeyIds(prev => {
            const updated = { ...prev, [prov]: id };
            localStorage.setItem('activeKeyIds', JSON.stringify(updated));
            return updated;
          });
        }
        toast(`Added new ${provName} key profile.`);
      };

      const deleteApiKey = (prov, id) => {
        confirmAction(`Delete this API key profile?`, () => {
          setApiKeysByProvider(prev => {
            const updated = { ...prev, [prov]: (prev[prov] || []).filter(k => k.id !== id) };
            localStorage.setItem('apiKeysByProvider', JSON.stringify(updated));
            return updated;
          });
          if (activeKeyIds[prov] === id) {
            setActiveKeyIds(prev => {
              const remaining = (apiKeysByProvider[prov] || []).filter(k => k.id !== id);

        let lastH = startH;

        const onTouchMove = (moveEvt) => {
          const curTouch = moveEvt.touches && moveEvt.touches[0];
          if (!curTouch) return;
          const delta = (curTouch.clientY - startY) * 1.85;
          const newH = Math.max(minHeights[boxType] || 80, Math.min(maxHeights[boxType] || 2500, Math.round(startH + delta)));

          if (boxType === 'input') setInputBoxHeight(newH);
          else if (boxType === 'output') setOutputBoxHeight(newH);

Abilities (so you know what word to use when someone uses their abilities):
Pillar/Great Old One/Above The Sequence: Lord of The Mysteries 

Fool,  Error, and  Door Pathways.

This Great Old One is one of the three Pillars.


Authorities & Symbolisms:

  
"He" possesses full authority over the Fool, Error, and Door Pathways and corresponding symbols, which include but are not limited to the following:

- 
- Fool: Authorities over Fooling, Foolishness, Change, Miracles, Bizarreness.
- 
- Error: Authorities over Errors, Time, Theft, Deceit, Destiny.
- 
- Door: Authorities over Doors, Position, Space, Seals, Teleportation.



- Bizarreness: "He" holds the symbolism of Bizarreness.

- One of its manifestations is Grafting.

- Foolishness: "He" holds the symbolism of Foolishness, the ability to turn every rational being into a Fool.

- Deceit: "He" is the symbol of Deceit and wields the ability to Deceive, mislead and manipulate everything.

- Miracles
- Decryption
- Theft

Symbols of other Great Old Ones can counter some of "His" symbols and powers, which include but are not limited to the following:

- Mother Goddess of Depravity:

- New Life, Death, Desolation mutually counteracts Marionettes.

- New Life counters Foolishness.

- However, this doesn't mean that "She" cannot be affected by Foolishnessand be Deceived if "She" were to face the Lord of Mysteries directly.

- Sovereign of the Physical World counters Grafting, Theft, Seal, Banishment, and Blink.

- The Mother Goddess of Depravity can fix mystical connections, spirits, consciousness, etc. in place, thus preventing them from being Grafted and Theft.


- High-Dimensional Overseer:

- Dimensionality and Change, which included space-time, mutually counteracts each other in a one-on-one situation.

- As the Lord of Dimensions, "He" could counter abilities such as Parasitism, Marionettes, and Blink.

- From higher or lower dimensions, Spirit Body Threads were tangible and real-something that could be touched. Blink only allowed movement on a small scale, while those Parasitized were bound together into one entity. This rendered the unique, ubiquitous nature of the Lord of Mysteries' avatars ineffective. Combat against the High-Dimensional Overseercould only rely on the Lord of Mysteries' true body.

- Monarch of Decay:

- Decay and Certain Death counter Avatars, Blink.

- Death of an Avatar equals the death of the main body.
- Decay of an Afterimage equals the decay of the main body.

- Inextinguishable Ravings:

- Source of All Ravings counter Avatars, Marionettes, and Blink.

- "He" can ignore the interference of Marionettes, Avatars, and Afterimages to directly project "His" voice into Sefirot and Uniquenesses transmitting "His" madness and implanting "His" intent.

- Primordial Hunger:

- Convergence and Devouring counter Avatars, Marionettes, and Blink.

- Convergence: "He" could forcibly pull the Lord of Mysteries's true body to "His" side.
- Devouring: If "He" devoured an Avatar or Marionette, "He" could absorb and erase the corresponding abilities, reducing or even temporarily nullifying their symbolic influence.

- Father of Devils:

- Source of Curses counters Avatars, Marionettes:

- "He" is capable of cursing Avatars and Marionettes to indirectly curse the true body.

- Supernova Dominator:

- Density, Gravity, and Attraction can influence Space-Time and distort Dimensions.

- However, for the Lord of Mysteries, who controlled Change and could turn falsehood into truth and vice versa, mere indirect interference was sufficient to stall "Him" without engaging directly.

- Circle of Inevitability:

- Past, Present, Future, Cycle, and Destinycould theoretically impact Avatars, Marionettes, and Blink.

- However, the Circle of Inevitability's symbols were effectively countered by the Lord of Mysteries' other symbols:

- King of Space-Time counters Past, Present, Future.
- Beacon of Destiny counters Cycle.
- Error counters Destiny.

Mythical Creature Form

  

  

The Mythical Creature Form of the Lord of Mysteries is a glowing bluish-black door seemed to flicker in and out of existence within a massive dark vortex bristling with slick tentacles that every gust of wind, droplet of water, and ray of light in the vortex consisted of Worms of Spirit, Worms of Time,and Worms of Stars. The vortex is covered with a coat the inside of it is an abyss, seemingly infinite, as if it contained an entire universe and a Spirit Worldconnected to every planet.

Calamity of Destruction is the title of the Great Old One of the  Demoness, and  Red Priest Pathways.

This Great Old One is one half of the Fourth Pillar, with the other half being the Eternal Darkness. Because of this, Pathways of the Eternal Darkness and the Calamity of Destruction groups are exchangeable. But in that case, there's no way to become a Great Old One, unless one can separate the Beyonder Characteristics from before.

Beyonders of the Calamity of Destruction group also need to contend with a mixture of the Primordial God Almighty's mental imprint, because in the First Epoch, the Primordial God Almighty had accommodated the City of Calamity.

By becoming the Calamity of Destruction, which combines the Red Priest Pathway and the Demoness Pathway, one would become a real hermaphrodite.

 

Honorific Name:



Calamity of Destruction;
Origins of Disaster
根源之祸

Honorific Name OF THE CALAMITY OF DESTRUCTION

TRANSLATION NOTE

"根源之祸" actually means "Disaster of Origin", instead of "Origins of Disaster" from the official Webnovel English translation.

 

Authorities & Symbolisms



- "They" possess full authority over the Red Priest, and Demoness pathways, and the corresponding symbolisms, which include but are not limited to the following:
    -  Demoness: Authorities over Apocalypseand Catastrophe. And the Symbols of Catastrophe and Chaos.
    -  Red Priest: Authorities over War and Conquest. And the Symbols of War and Destruction.
    - The two Pathways represent Disasters of all kinds, both natural and man-made.
