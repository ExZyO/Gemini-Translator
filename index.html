        const startY = touch.clientY;
        const initialHeights = {
          input: inputBoxHeight,
          output: outputBoxHeight,
          instructions: instructionsBoxHeight,

        const minHeights = { input: 120, output: 120, instructions: 50, glossary: 80 };

        const startH = initialHeights[boxType] || 200;
        let lastH = startH;

        const onTouchMove = (moveEvt) => {
          const curTouch = moveEvt.touches && moveEvt.touches[0];
          if (!curTouch) return;
          const delta = (curTouch.clientY - startY) * 1.85;
          const newH = Math.max(minHeights[boxType] || 80, Math.min(maxHeights[boxType] || 2500, Math.round(startH + delta)));
          lastH = newH;
          if (boxType === 'input') setInputBoxHeight(newH);
          else if (boxType === 'output') setOutputBoxHeight(newH);
          else if (boxType === 'instructions') setInstructionsBoxHeight(newH);
          else if (boxType === 'glossary') setGlossaryBoxHeight(newH);
        };

        const onTouchEnd = () => {
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onTouchEnd);
          localStorage.setItem(`${boxType}BoxHeight`, lastH);
        };

        const defaults = { input: 220, output: 250, instructions: 80, glossary: 140 };

X. PILLARS, GREAT OLD ONES & COMPLETE PATHWAY TREES

1. LORD OF THE MYSTERIES (PILLAR) (诡秘之主 - 支柱)

Pathways: Fool (占卜家), Error (偷盗者), Door (学徒).
This Great Old One is one of the three Pillars.

Authorities & Symbolisms:
- Fool (愚者): Authorities over Fooling, Foolishness, Change, Miracles, Bizarreness.
  * Bizarreness: Manifests as Grafting.
  * Foolishness: Ability to turn every rational being into a Fool.
- Error (错误): Authorities over Errors, Time, Theft, Deceit, Destiny.
  * Deceit: Symbol of Deceit, ability to Deceive, mislead, and manipulate everything.
- Door (门): Authorities over Doors, Position, Space, Seals, Teleportation.

Symbolic Counters against other Great Old Ones:
- Mother Goddess of Depravity: New Life, Death, Desolation counter Marionettes. New Life counters Foolishness (though "She" can still be Deceived). Sovereign of the Physical World counters Grafting, Theft, Seal, Banishment, Blink.
- High-Dimensional Overseer: Dimensionality and Change counter each other. Counters Parasitism, Marionettes, Blink.
- Monarch of Decay: Decay and Certain Death counter Avatars and Blink (Death/Decay of Avatar/Afterimage equals death/decay of main body).
- Inextinguishable Ravings: Source of All Ravings counters Avatars, Marionettes, Blink by projecting directly into Sefirot and Uniquenesses.
- Primordial Hunger: Convergence and Devouring counter Avatars, Marionettes, Blink.
- Father of Devils: Source of Curses indirectly curses true body via Avatars and Marionettes.
- Supernova Dominator: Density, Gravity, and Attraction distort Space-Time and Dimensions.

  * New Life: Gives New Life to souls, consciousness, spirits, intellect, and Beyonder powers; immense healing.
  * Beauty and Spirituality: Radiates maternal brilliance causing enemies to hesitate.
  * Death and Desolation: Causes entities to wither and collapse into death.

Abilities (so you know what word to use when someone uses their abilities):
Pillar/Great Old One/Above The Sequence: Lord of The Mysteries 

Fool, Error, and Door Pathways.

This Great Old One is one of the three Pillars.


Authorities & Symbolisms:

  
"He" possesses full authority over the Fool, Error, and Door Pathways and corresponding symbols, which include but are not limited to the following:

- 
- Fool: Authorities over Fooling, Foolishness, Change, Miracles, Bizarreness.
- 
- Error: Authorities over Errors, Time, Theft, Deceit, Destiny.
- 
- Door: Authorities over Doors, Position, Space, Seals, Teleportation.



- Bizarreness: "He" holds the symbolism of Bizarreness.

- One of its manifestations is Grafting.

- Foolishness: "He" holds the symbolism of Foolishness, the ability to turn every rational being into a Fool.

- Deceit: "He" is the symbol of Deceit and wields the ability to Deceive, mislead and manipulate everything.

- Miracles
- Decryption
- Theft

Symbols of other Great Old Ones can counter some of "His" symbols and powers, which include but are not limited to the following:

- Mother Goddess of Depravity:

- New Life, Death, Desolation mutually counteracts Marionettes.

- New Life counters Foolishness.

- However, this doesn't mean that "She" cannot be affected by Foolishnessand be Deceived if "She" were to face the Lord of Mysteries directly.

- Sovereign of the Physical World counters Grafting, Theft, Seal, Banishment, and Blink.

- The Mother Goddess of Depravity can fix mystical connections, spirits, consciousness, etc. in place, thus preventing them from being Grafted and Theft.


- High-Dimensional Overseer:

- Dimensionality and Change, which included space-time, mutually counteracts each other in a one-on-one situation.

- As the Lord of Dimensions, "He" could counter abilities such as Parasitism, Marionettes, and Blink.

- From higher or lower dimensions, Spirit Body Threads were tangible and real-something that could be touched. Blink only allowed movement on a small scale, while those Parasitized were bound together into one entity. This rendered the unique, ubiquitous nature of the Lord of Mysteries' avatars ineffective. Combat against the High-Dimensional Overseercould only rely on the Lord of Mysteries' true body.

- Monarch of Decay:

- Decay and Certain Death counter Avatars, Blink.

- Death of an Avatar equals the death of the main body.
- Decay of an Afterimage equals the decay of the main body.

- Inextinguishable Ravings:

- Source of All Ravings counter Avatars, Marionettes, and Blink.

- "He" can ignore the interference of Marionettes, Avatars, and Afterimages to directly project "His" voice into Sefirot and Uniquenesses transmitting "His" madness and implanting "His" intent.

- Primordial Hunger:

- Convergence and Devouring counter Avatars, Marionettes, and Blink.

- Convergence: "He" could forcibly pull the Lord of Mysteries's true body to "His" side.
- Devouring: If "He" devoured an Avatar or Marionette, "He" could absorb and erase the corresponding abilities, reducing or even temporarily nullifying their symbolic influence.

- Father of Devils:

- Source of Curses counters Avatars, Marionettes:

- "He" is capable of cursing Avatars and Marionettes to indirectly curse the true body.

- Supernova Dominator:

- Density, Gravity, and Attraction can influence Space-Time and distort Dimensions.

- However, for the Lord of Mysteries, who controlled Change and could turn falsehood into truth and vice versa, mere indirect interference was sufficient to stall "Him" without engaging directly.

- Circle of Inevitability:

- Past, Present, Future, Cycle, and Destinycould theoretically impact Avatars, Marionettes, and Blink.

- However, the Circle of Inevitability's symbols were effectively countered by the Lord of Mysteries' other symbols:

- King of Space-Time counters Past, Present, Future.
- Beacon of Destiny counters Cycle.
- Error counters Destiny.

Mythical Creature Form

  

  

The Mythical Creature Form of the Lord of Mysteries is a glowing bluish-black door seemed to flicker in and out of existence within a massive dark vortex bristling with slick tentacles that every gust of wind, droplet of water, and ray of light in the vortex consisted of Worms of Spirit, Worms of Time,and Worms of Stars. The vortex is covered with a coat the inside of it is an abyss, seemingly infinite, as if it contained an entire universe and a Spirit Worldconnected to every planet.

Calamity of Destruction is the title of the Great Old One of the Demoness, and Red Priest Pathways.

This Great Old One is one half of the Fourth Pillar, with the other half being the Eternal Darkness. Because of this, Pathways of the Eternal Darkness and the Calamity of Destruction groups are exchangeable. But in that case, there's no way to become a Great Old One, unless one can separate the Beyonder Characteristics from before.

Beyonders of the Calamity of Destruction group also need to contend with a mixture of the Primordial God Almighty's mental imprint, because in the First Epoch, the Primordial God Almighty had accommodated the City of Calamity.

By becoming the Calamity of Destruction, which combines the Red Priest Pathway and the Demoness Pathway, one would become a real hermaphrodite.

 

Honorific Name:



Calamity of Destruction;
Origins of Disaster
根源之祸

Honorific Name OF THE CALAMITY OF DESTRUCTION

TRANSLATION NOTE

"根源之祸" actually means "Disaster of Origin", instead of "Origins of Disaster" from the official Webnovel English translation.

 

Authorities & Symbolisms



- "They" possess full authority over the Red Priest, and Demoness pathways, and the corresponding symbolisms, which include but are not limited to the following:
    - Demoness: Authorities over Apocalypseand Catastrophe. And the Symbols of Catastrophe and Chaos.
    - Red Priest: Authorities over War and Conquest. And the Symbols of War and Destruction.
    - The two Pathways represent Disasters of all kinds, both natural and man-made.

 Outer Deities are powerful cosmic entities that have attempted to invade Earth. Among them are the Mother Goddess of Depravity, the Mother Tree of Desire, the Son of Chaos, the Primordial Hunger, the Supernova Dominator, and the Inextinguishable Ravings.
Mother Goddess of Depravity
Also known as the Primordial Moon, the Great Mother, the Sovereign of the Physical World, and the Mother of All Things, "She" has occupied the Moon since the First Epoch, terraforming it into the Crimson Moon. "She" is the first child of the Original Creator and ruler of all feminine power in the Cosmos. "She" originally owned the Mother and Moon Pathways and currently possesses the Chaos Primogenitor Pathway.
Authorities & Symbolism
 * Chaos Primogenitor Pathway: Full authority over Reproduction, Propagation, Reality, and Nurturing the nascent Original Creator of the next Universe. This pathway combines "Original Sin, Evil, and Corruption" with "Reality and Procreation."
 * Mother Pathway (partial): Authorities over Life, Desolation, and Birth, symbolizing Motherhood.
 * Moon Pathway (partial): Authorities over Beauty, Creation, and Spirituality, symbolizing the Moon/Crimson Moon.
 * Sovereign of the Physical World: One of the three Pillars supporting the universe. "Her" soul and body are indestructible.
 * Origin of Evil: Innately possesses the Pathway of Evil and Corruption, including the Exploitation of Life.
 * Dominator of Reality: Full control over the Physical World, making "Her" almost impossible to displace, seal, or banish. "She" can "fix" mystical connections, spirits, and consciousness in place, disrupting interference.
 * New Life: Can give "New Life" to all things, including souls, consciousness, spirits, intellect, and Beyonder powers. This also provides immense healing properties.
 * Chaos Primogenitor: A unique symbol pointing to the Original Creator, whom "She" nurtures as the "Original Sin" of the next universe.
 * Beauty and Spirituality: Symbolizes beauty, radiating maternal brilliance that causes enemies to hesitate.
 * Death and Desolation: Can influence entities to wither, collapsing into death.
Appearance
 * Primordial Moon: Appears as a crimson sea flowing on the Moon's surface, digesting it.
 * True Form: Composed of countless haphazardly piled birthing organs, with swirling smoke and crimson moonlight forming an accretion-disk-like extension as clothing. Has a flawless human woman's head with long brown hair and crimson eyes, embodying beauty and maternal brilliance.
History
 * Created by the Original Creator, "She" is highly affected by the Law of Convergence, attracting parts of "Her" Sefirah and characteristics to Earth.
 * "She" had worshippers on Earth in the Pre-Epoch, being the source of all Mother Goddess-type deities.
 * "She" is worshipped by factions like the Life School of Thought and Rose School of Thought. Prayers often lead to cruelty, madness, and intense desire.
 * Suspected and later confirmed to have corrupted Roselle.
 * During Project Vortex, "She" traded Roselle Gustav's corruption for the Shadow of the Beauty Goddess.
 * Cooperated with the Mother Tree of Desire in "The Fool's Dream" to store Klein's traumas and grant "New Life" to Panatiya's corpse. Later betrayed the Celestial Worthy by siding with the Primordial God Almighty.
 * Descended onto Earth during "The Day of Many Disasters" and captured the Brood Hive.
 * During "The Apocalypse," "She" was dealt a critical blow by Lumian Lee and later saved the Goddess of Fate from being sealed by Klein. "She" eventually left the solar system after a temporary truce with Klein, but is contract-bound to return to help the Primordial God Almighty revive.
Mother Tree of Desire
The second child of the Original Creator, "She" is one of "His" three direct children along with the Mother Goddess of Depravity and the Son of Chaos. "She" originally owned the Abyss and Chained Pathways and currently possesses the Patriarch Pathway. "She" amplifies desire, including greed, hunger, sloth, lust, and reproduction.
Authorities & Symbolism
 * Patriarch Pathway (full): Authorities over Love, Envy, Reason, and Sentient Beings, symbolizing Desires. This pathway is a mix of "Desires (Reasons)" and "Blathering."
 * Abyss Pathway (partial): Authorities over Blood, Filth, and Corruption.
 * Chained Pathway (partial): Authorities over Curses and Binding.
 * Father of Devils (former): Holds corruptive influence over "Her" former pathways.
 * Perpetual Blatherer: Initiator of Reason and endless Desires; can awaken survival instincts and locate targets via desire.
 * Reason: "Her" existence blesses all Sentient Beings with Rationality.
Appearance
 * True Form: A humanoid giant tree covered in chaotic scales, adorned with enticing crystalline fruits, glistening alluring flowers, various metallic emblems, black hearts, bare tumors, and coins. Has two heads: a lower male head exuding bizarre desires, and an upper female head of extraordinary beauty with green hair.
History
 * Created by the Original Creator, "She" was heavily affected by the Law of Convergence, attracting parts of "Her" Sefirot and Beyonder characteristics to Earth.
 * Corrupted the Chained God in the Fifth Epoch, turning the Rose School of Thought into an evil organization.
 * Has a conflict with the Primordial Moon within the Rose School of Thought.
 * "Her" influence has significantly grown, with cooperation among "Her" worshiping organizations and signs of worship among Devil families.
 * Participated in Project Vortex by trading the Shadow of the Beauty Goddess for Roselle Gustav's corruption.
 * Exerted influence in Klein's dream, running Mushoku Hospital alongside the Mother Goddess of Depravity, later withdrawing before the final confrontation.
 * Attempted to fully grow the Tree of Shadow and descend onto Earth during "The Day of Many Disasters."
 * During "The Apocalypse," "She" was held off by Klein, severely wounded by the Master of the Shadow Cottage and Farbauti, and escaped into the Astral World with the Tenebrous World's help. "She" is expected to take a long time to recover.
Son of Chaos
The third child of the Original Creator, "He" is one of "His" three direct children along with the Mother Goddess of Depravity and the Mother Tree of Desire. "He" originally owned the Sefirah Nation of Disorder and its corresponding Black Emperor and Justiciar Pathways. "He" is the current owner of the Chaos Mist Pathway.
Authorities & Symbolism
 * Chaos Mist Pathway (full): Authorities over Blasphemy, Truth, and Chaos.
 * Contracts: Can make Contracts that even Great Old Ones must honor.
Appearance
 * As the Genie: A blurred and distorted pale golden figure formed from viscous light.
 * As the Uncertain Mist: Occupies a massive planet shrouded in layers of ever-changing white mist.
History
 * Created by the Original Creator, "He" was affected by the Law of Beyonder Characteristics Convergence, attracting parts of "His" characteristics to Earth.
 * In the First Epoch, "His" consciousness, the Genie, was sealed in the Magic Wishing Lamp by the Celestial Worthy of Heaven and Earth for Blessings.
 * Most of "His" remaining parts formed the Outer Deity known as the Uncertain Mist, worshipped by the School of Truth.
 * Heavily injured during Project Vortex, forcing "Him" to retreat and sleep for decades, preventing "Him" from bestowing boons until "The Apocalypse."
 * Without the Uncertain Mist to coordinate them, other Outer Deities were less willing to confront the Lord of Mysteries during "The Apocalypse."
Primordial Hunger
One of the Outer Deities that attempted to invade Earth. "He" is the current owner of the Tail-Devourer Pathway.
Authorities & Symbolism
 * Tail-Devourer Pathway (full): Authorities over Devouring, Convergence, and Hunger. Symbolizes Devouring and Convergence.
 * Convergence: Instinctively pulls others' true bodies to "His" side and can influence Fate.
 * Devour: Can Devour everything, including black holes, avatars, marionettes, and even ravings within "His" own mind. "His" power governs Digestion, utilization, and Erasure.
 * Counters: "His" symbols can be countered by the Calamity of Destruction's "Return of All Things to Chaos" and the God Almighty's "Creator."
Appearance
 * True Form: A dark vortex revealing bared white teeth and chaotic liquid encompassing all colors. Elongated black shadows with different heads, previously on "His" exterior, appear to have been consumed.
Personality
 * The most primitive and vulnerable Outer Deity, driven by desires of Convergence, with only a basic sense of self-preservation. Can still communicate.
History
 * Gathered around Earth with other powerful Outer Deities, seeking to retrieve their Sefirot and Beyonder Characteristics or accommodate neighboring ones.
 * Aimed to consume the City of Calamity, ingest the Chaos Sea, and absorb Uniquenesses of certain pathways.
 * "His" subordinate Angel, Ludwig Phil, was captured and sealed by the Church of the God of Knowledge and Wisdom.
 * During "The Apocalypse," "He" was held off by Adam and later dealt a critical blow by Lumian Lee, forcing "Him" to withdraw.
 * If "He" were to Devour the Chaos Primogenitor, it would cause an aggressive Convergence, leading to the return of the Original Creator.
Supernova Dominator
One of the Outer Deities that attempted to invade Earth. "He" is the current owner of the Condenser Pathway.
Authorities & Symbolism
 * Condenser Pathway (full): Authorities over Fusion, Cosmic Laws, and Fundamental Forces. Symbols of Density, Weight, Gravity, and Attraction.
 * Ruler of Stars: Controls and summons Stars, creating Supernovae and Black Holes. Can control millions of stars.
 * Great Attractor: Controls the Great Attractor, influencing galactic motion.
 * Symbolism of Weight and Density: Influences space-time and distorts dimensions through Density, Gravity, and Attraction. "His" gravitational pull affects both physical and intangible matter like Fate and Spirit Bodies.
 * Controller of Fundamental Forces: Controls Fundamental Forces of reality. Can manipulate particles to trigger nuclear fusions and create matter. Can emit blinding light.
 * Supernova: Creates Supernovae, either directly or by massing stars.
 * Black Hole: Creates massive Black Holes with immense gravitational force.
 * White Hole: Can reverse a Black Hole's collapse into a powerful explosion, strong enough to obliterate other Great Old Ones. This symbolism is fundamental and unremovable.
Appearance
 * True Form: A star cluster composed of myriad explosive suns, too large to be contained within a Solar System.
Personality
 * Wants to embody the symbol of Civilization, but "He" is quite mad, leading to periodic disasters in civilizations under "Him."
History
 * Served as Earth's "Sun" during much of the Second Epoch after the death of the Primordial God Almighty.
 * In the Fourth Epoch, "He" sent a spaceship with an embryonic black hole to Earth, thwarted by Mr. Door and Amon.
 * Agreed to suppress the Astral Barrier during Project Vortex in exchange for the seal on the spaceship being broken.
 * During "The Apocalypse," "He" was the first Outer Deity to affect Earth, tearing the planet into fragments with "His" star cluster form.
 * Held off by Klein, who handicapped "His" strength and eventually sealed "Him" in an Abomination Beyonder Characteristic.
 * After breaking "His" seal, "He" was affected by Klein's "Foolishness" and "Virtual Persona," making "Him" believe "He" is an ally of Earth's Great Old Ones.
Inextinguishable Ravings
One of the Outer Deities that attempted to invade Earth. "He" is the current owner of the Everlasting Pathway and seems to share "His" origin with the residual psyche of the Original Creator, the source of all ravings.
Authorities & Symbolism
 * Everlasting Pathway (full): Authorities and Symbols of Consciousness and Spirit. This pathway is a mix of two others.
 * Inextinguishable Ravings: "His" ravings awaken the spiritual imprint of the Original Creator within all Sefirot, Uniquenesses, and Beyonder characteristics, affecting everyone. Can directly project "His" voice into Sefirot and Uniquenesses.
 * Consciousness & Spirit: Symbolizes Consciousness and Spirit; injuring "Him" causes chaotic Consciousness and disoriented Spirits.
 * The Symbol of Life's Spirit: Awakens and corrupts lingering Spirits within aggregates.
 * Eternal Consciousness: Intwined with Consciousness and Spirits, making "Him" immortal.
 * The Philosophical Essence: Transmits the First Philosophy, causing physical and mental anguish in Beyonders who hear "His" voice.
 * Counters: Can be countered by "Darkness" (Eternal Darkness) which induces slumber, and "Devouring" (Primordial Hunger) which consumes ravings.
Appearance
 * Doesn't have a true physical form; attaches "Himself" to objects, causing them to exhibit specific colors or appearances.
History
 * Gathered around Earth with other powerful Outer Deities, seeking Sefirot and Beyonder Characteristics.
 * Coveted the Knowledge Moor and aimed to control the Chaos Sea.
 * During Project Vortex, "He" sent a bit of "His" power through the barrier, transmitting the First Philosophy and affecting Beyonders who heard "His" voice.
 * Followers planned to approach the remnants of the Knowledge Moor in Fourth Epoch Trier.

            const candidateParts = j?.candidates?.[0]?.content?.parts || [];
            const actualParts = candidateParts.filter(p => !p.thought);
            optimizedResult = actualParts.length > 0
              ? actualParts.map(p => p.text || '').join('')
              : (candidateParts.map(p => p.text || '').join(''));
          }

          if (!optimizedResult.trim()) throw new Error('Received empty response from AI.');
          setTerminology(optimizedResult.trim());
          toast('Glossary successfully cleaned and structured by AI!');
        } catch (err) {
          setError('AI Glossary Optimization failed: ' + err.message);

          setIsOptimizingGlossary(false);

      // --- Full App Backup & Restore ---
      const exportFullBackup = async (forceIncludeKeys = null) => {

        const currentSavedGlossaries = (savedGlossaries && savedGlossaries.length > 0)

        const currentTerminology = (terminology && terminology.trim())

        let fullHistory = await dbGetAll('history');
        if (!fullHistory || fullHistory.length === 0) {

            try { return JSON.parse(localStorage.getItem('translationHistory') || '[]'); } catch (e) { return []; }

        const backup = {
          version: VERSION,

          terminology: currentTerminology,

        };
        if (shouldIncludeKeys) {
          const exportKeys = {};

            const legacyKey = localStorage.getItem(`${prov}ApiKey`) || (prov === 'gemini' ? (localStorage.getItem('apiKey') || '') : '');
            const profiles = (apiKeysByProvider && apiKeysByProvider[prov]) ? [...apiKeysByProvider[prov]] : [];
            if (profiles.length > 0) {

          backup.deepseekApiKey = exportKeys.deepseek?.[0]?.key || localStorage.getItem('deepseekApiKey') || '';
          backup.openaiApiKey = exportKeys.openai?.[0]?.key || localStorage.getItem('openaiApiKey') || '';

        const jsonStr = JSON.stringify(backup, null, 2);

        const blob = new Blob([jsonStr], { type: 'application/json' });

      const applyRestoredData = (data) => {

        if (data.translationHistory && Array.isArray(data.translationHistory)) {

          data.translationHistory.forEach(h => dbPut('history', h));
        }
        if (data.exportHistory && Array.isArray(data.exportHistory)) {

        if (data.provider) {

          localStorage.setItem('translationProvider', data.provider);

        if (data.geminiModel) {
          setGeminiModel(data.geminiModel);
          localStorage.setItem('geminiModel', data.geminiModel);
        }
        if (data.deepseekModel) {
          setDeepseekModel(data.deepseekModel);
          localStorage.setItem('deepseekModel', data.deepseekModel);
        }
        if (data.openaiModel) {
          setOpenaiModel(data.openaiModel);
          localStorage.setItem('openaiModel', data.openaiModel);
        }
        if (data.claudeModel) {
          setClaudeModel(data.claudeModel);
          localStorage.setItem('claudeModel', data.claudeModel);
        }
        if (data.concurrency) {
          setConcurrency(data.concurrency);
        }
        if (data.contextAware !== undefined) {
          setContextAware(data.contextAware);
          localStorage.setItem('contextAware', data.contextAware);
        }

        // Restore API Key Profiles (Robust Multi-Format Parsing)
        if (data.apiKeysByProvider && typeof data.apiKeysByProvider === 'object') {
          ['gemini', 'deepseek', 'openai', 'claude', 'deepl', 'libre'].forEach(prov => {
            const list = data.apiKeysByProvider[prov];
            if (Array.isArray(list) && list.length > 0) {
              restoredKeys[prov] = list.filter(k => k && (k.key || typeof k === 'string')).map((k, idx) => {
                if (typeof k === 'string') return { id: `${prov}-${Date.now()}-${idx}`, name: `${prov.toUpperCase()} Key ${idx + 1}`, key: k.trim() };
                return k;
              });
              restoredKeys[prov].forEach(k => {
                if (k.key && k.key.trim()) keyCount++;
              });
              if (restoredKeys[prov][0]?.key) {
                localStorage.setItem(`${prov}ApiKey`, restoredKeys[prov][0].key);
                if (prov === 'gemini') localStorage.setItem('apiKey', restoredKeys[prov][0].key);
              }
            }
          });
        }

        // Support Legacy Single Keys in backup
        const legacyMappings = {
          gemini: data.geminiApiKey || data.apiKey || '',
          deepseek: data.deepseekApiKey || '',
          openai: data.openaiApiKey || '',
          claude: data.claudeApiKey || '',
          deepl: data.deeplApiKey || ''
        };

        Object.entries(legacyMappings).forEach(([prov, lKey]) => {
          if (lKey && lKey.trim()) {
            localStorage.setItem(`${prov}ApiKey`, lKey);
            if (prov === 'gemini') localStorage.setItem('apiKey', lKey);
            if (!restoredKeys[prov] || restoredKeys[prov].length === 0) {
              const provNames = { gemini: 'Gemini', deepseek: 'DeepSeek', openai: 'OpenAI', claude: 'Claude', deepl: 'DeepL', libre: 'LibreTranslate' };
              restoredKeys[prov] = [{ id: `${prov}-init`, name: `Primary ${provNames[prov] || prov} Key`, key: lKey }];
              keyCount++;
            } else if (!restoredKeys[prov][0].key) {
              restoredKeys[prov][0].key = lKey;
              keyCount++;
            }
          }
        });

        if (Object.keys(restoredKeys).length > 0) {
          setApiKeysByProvider(prev => {
            const updated = { ...prev, ...restoredKeys };
            localStorage.setItem('apiKeysByProvider', JSON.stringify(updated));
            return updated;
          });
        }

        if (data.activeKeyIds && typeof data.activeKeyIds === 'object') {
          setActiveKeyIds(data.activeKeyIds);
          localStorage.setItem('activeKeyIds', JSON.stringify(data.activeKeyIds));
        }

        if (data.libreUrl) {
          setLibreUrl(data.libreUrl);
          localStorage.setItem('libreUrl', data.libreUrl);
        }

        const parts = [];
        if (keyCount > 0) parts.push(`${keyCount} API key(s)`);
        if (glossaryCount > 0) parts.push(`${glossaryCount} glossary profile(s)`);
        else if (data.terminology && data.terminology.trim()) parts.push('active glossary');
        parts.push('settings');
        toast(` Restored ${parts.join(', ')} successfully!`);
      };

      const readFileContentAsText = (file) => {
        return new Promise((resolve, reject) => {
          if (file.text) {
            file.text().then(resolve).catch(() => {
              const reader = new FileReader();
              reader.onload = (evt) => resolve(evt.target.result);
              reader.onerror = (err) => reject(err);
              reader.readAsText(file);
            });
          } else {
            const reader = new FileReader();
            reader.onload = (evt) => resolve(evt.target.result);
            reader.onerror = (err) => reject(err);
            reader.readAsText(file);
          }
        });
      };

      const importFullBackup = async (e) => {
        const f = e.target?.files?.[0];
        if (!f) return;
        try {
          const txt = await readFileContentAsText(f);
          const data = JSON.parse(txt);
          applyRestoredData(data);
        } catch (err) {
          console.error("Backup import error:", err);
          setError('Failed to restore backup: ' + err.message);
          toast('Failed to restore backup: ' + err.message, 'error');
        }
        if (e.target) e.target.value = '';
      };

      const pasteAndRestoreBackup = async () => {
        try {
          let text = '';
          if (navigator.clipboard?.readText) {
            try { text = await navigator.clipboard.readText(); } catch (e) {}
          }
          const input = prompt('Paste your backup JSON content below:', text);
          if (!input || !input.trim()) return;
          const data = JSON.parse(input.trim());
          applyRestoredData(data);
        } catch (err) {
          setError('Failed to parse backup JSON: ' + err.message);
          toast('Failed to parse backup JSON: ' + err.message, 'error');
        }
      };

      // --- Modal ---
      const confirmAction = (msg, cb) => { setModalMessage(msg); setModalCallback(() => () => { cb(); setShowModal(false) }); setShowModal(true) };

      // --- History (IndexedDB Unlimited Storage + LocalStorage Fallback) ---
      const addToHistory = async (src, tgt, prov, input, output, stats = null) => {
        try {
          const entry = {
            id: genId(),
            ts: new Date().toISOString(),
            srcLang: src,
            tgtLang: tgt,
            provider: prov,
            inputPreview: (input || '').substring(0, 200),
            outputPreview: (output || '').substring(0, 200),
            fullInput: input || '',
            fullOutput: output || '',
            stats
          };
          
          // 1. Unlimited storage in IndexedDB
          await dbPut('history', entry);

          // 2. React state update
          setHistory(prev => [entry, ...(prev || [])]);

          // 3. Fallback sync to localStorage
          try {
            const lightList = [entry, ...(history || []).slice(0, 9)].map(h => ({
              ...h,
              fullInput: (h.fullInput && h.fullInput.length > 3000) ? (h.fullInput.substring(0, 3000) + '...[Full text in IndexedDB]') : h.fullInput,
              fullOutput: (h.fullOutput && h.fullOutput.length > 3000) ? (h.fullOutput.substring(0, 3000) + '...[Full text in IndexedDB]') : h.fullOutput
            }));
            localStorage.setItem('translationHistory', JSON.stringify(lightList));
          } catch (e) {}

          // 4. Mirror translated books into the unified Library (one store)
          try {
            const heading = /^(?:第[0-9零一二三四五六七八九十百千万]+[章回卷节篇]|Chapter\s*\d+|CHAPTER\s*\d+)/;
            const chaps = [];
            let cur = null;
            for (const line of (output || '').split(/\r?\n/)) {
              const t = line.trim();
              if (heading.test(t)) { if (cur) chaps.push(cur); cur = { title: t, content: '' }; }
              else if (cur) cur.content += line + '\n';
              else if (t) cur = { title: 'Chapter 1', content: line + '\n' };
            }
            if (cur) chaps.push(cur);
            if (chaps.length >= 2) {
              await saveNovelToHistory({
                title: ((chaps[0].title || '').replace(heading, '') || 'Translated Book').trim() + ' (Translated)',
                author: 'Gemini Translator',
                chapters: chaps.map(c => ({ title: c.title, content: c.content.trim() }))
              });
            }
          } catch (e) {}
        } catch (e) {
          console.warn('History storage note:', e);
        }
      };

      const loadFromHistory = async entry => {

        let fullOut = entry.fullOutput;
        if (!fullIn || !fullOut || fullIn.includes('[Full text in IndexedDB]')) {
          const all = await dbGetAll('history');
          const found = (all || []).find(x => x.id === entry.id);
          if (found) {
            fullIn = found.fullInput || fullIn;
            fullOut = found.fullOutput || fullOut;

        setInputText(fullIn || '');
        setAssembledText(fullOut || '');
        setSrcLang(entry.srcLang || 'Auto-detect');

      const clearHistory = () => {

          toast('Translation history cleared.', 'info');
        });
      };

      const deleteHistoryItem = async (id) => {
        await dbDelete('history', id);
        const u = history.filter(h => h.id !== id);
        setHistory(u);
        try { localStorage.setItem('translationHistory', JSON.stringify(u.slice(0, 10))); } catch (e) {}
      };

      const exportHistoryJSON = async () => {
        let historyData = await dbGetAll('history');
        if (!historyData || historyData.length === 0) {
          historyData = (history && history.length > 0) ? history : (() => {
            try { return JSON.parse(localStorage.getItem('translationHistory') || '[]'); } catch (e) { return []; }
          })();
        }

        if (!historyData || historyData.length === 0) {
          return toast('No translation history to export.', 'warning');
        }

        const sorted = historyData.sort((a, b) => new Date(b.ts) - new Date(a.ts));
        const exportObj = {
          app: 'Gemini EPUB Translator',
          type: 'history_export',
          storageEngine: 'IndexedDB',
          version: VERSION,
          exportedAt: new Date().toISOString(),
          totalEntries: sorted.length,
          history: sorted
        };

        const jsonStr = JSON.stringify(exportObj, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const d = new Date().toISOString().slice(0, 10);
        a.download = `gemini_translation_history_${d}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast(`Exported ${sorted.length} history records (IndexedDB)!`, 'success');
      };

      const exportSingleHistoryItem = (entry) => {
        const title = `${(entry.tgtLang ? `${entry.srcLang || 'Auto'} to ${entry.tgtLang}` : 'Translation')}_${new Date(entry.ts).toISOString().slice(0, 10)}`;
        const content = `====================================================\nGEMINI TRANSLATION HISTORY ENTRY\nProvider: ${entry.provider || 'AI'}\nLanguage: ${entry.srcLang || 'Auto'} -> ${entry.tgtLang}\nDate: ${new Date(entry.ts).toLocaleString()}\nTokens: ${entry.stats?.totalTokens?.toLocaleString() || 'N/A'}\nCost: ${entry.stats?.cost || 'N/A'}\n====================================================\n\n[INPUT TEXT]:\n${entry.fullInput || entry.inputPreview || ''}\n\n====================================================\n[TRANSLATED OUTPUT]:\n${entry.fullOutput || entry.outputPreview || ''}\n`;

        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('History entry exported as .txt file!', 'success');
      };

      // --- Translation ---
      const getTranslateOpts = (signal) => ({
        apiKey: provider === 'deepseek' ? deepseekKey : geminiKey,
        rotateApiKey,
        deepseekApiKey: deepseekKey,
        deeplApiKey: deeplKey,
        model: provider === 'deepseek'
          ? (useCustomDeepseekModel && customDeepseekModel ? customDeepseekModel : deepseekModel)
          : (useCustomModel && customModel ? customModel : geminiModel),
        srcLang,
        tgtLang,
        glossary: terminology,
        instructions: customInstructions,
        smartGlossary,
        epubSmartQuotes,
        epubCleanWebArtifacts,
        enableThinking,
        signal,
        provider,
        libreUrl
      });

      // --- HTML DOM Node Extraction Helper ---
      // Extracts all non-empty text nodes from a DOM element (supporting all CJK, Latin, symbols)
      const extractTextNodes = (element) => {
        const nodes = [];
        if (!element) return nodes;
        const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
        let n;
        while (n = walk.nextNode()) {
          const parentTag = n.parentElement ? n.parentElement.tagName.toLowerCase() : '';
          if (parentTag === 'script' || parentTag === 'style' || parentTag === 'noscript') continue;
          if (n.nodeValue && n.nodeValue.trim().length > 0) {
            nodes.push(n);
          }
        }
        return nodes;
      };

      const handleTranslateText = async (resume = false) => {
        if (!inputText.trim()) return setError('Paste some text to translate.');
        let wakeLock = null;
        if (typeof navigator !== 'undefined' && 'wakeLock' in navigator) {
          try { navigator.wakeLock.request('screen').then(wl => { wakeLock = wl }).catch(() => {}); } catch(e) {}
        }
        const startTime = performance.now();
        setIsTranslating(true); setProgress(0); setProgressLabel(resume ? 'Resuming...' : 'Preparing...'); setError('');
        window.NativeBridge?.acquireWakeLock();
        window.NativeBridge?.showProgressNotification('Gemini Translator', resume ? 'Resuming translation...' : 'Starting text translation...', 0);
        if (!resume) { setAssembledText(''); setTranslatedChapters([]); }

        const ctrl = new AbortController(); abortRef.current = ctrl;
        const jobId = generateJobId(inputText);

        try {
          const opts = getTranslateOpts(ctrl.signal);
          const effectiveTerm = enableGlossary ? terminology : '';
          const chunks = splitChunks(inputText, effectiveTerm.length, smartGlossary);
          const isAIProvider = provider === 'gemini' || provider === 'deepseek';
          const useContext = contextAware && chunks.length > 1 && isAIProvider;

          let result = resume && activeSession ? activeSession.result : '';
          let ctx = resume && activeSession ? activeSession.ctx : '';
          let startIndex = resume && activeSession ? activeSession.completedCount : 0;
          let totalPromptTokens = 0;
          let totalOutputTokens = 0;
          let totalTokensUsed = 0;

          const saveState = (res, c, count) => {
            const state = { result: res, ctx: c, completedCount: count, total: chunks.length };
            localStorage.setItem(jobId, JSON.stringify(state));
            setActiveSession(state);
          };

          if (isAIProvider && enableStreaming) {
            for (let i = startIndex; i < chunks.length; i++) {
              setProgressLabel(`Streaming chunk ${i + 1}/${chunks.length}${useContext ? ' (with context)' : ''}...`);
              const pct = Math.round(((i + 1) / chunks.length) * 100);
              window.NativeBridge?.showProgressNotification('Gemini Translator', `Chunk ${i + 1}/${chunks.length} (${pct}%)`, pct);
              window.NativeBridge?.haptic('milestone');
              let chunkResult = '';
              const onChunkStream = t => {
                if (chunkResult === '' && result !== '' && !result.endsWith('\n')) {
                  result += '\n\n';
                }
                chunkResult += t;
                result += t;
                setAssembledText(result);
              };
              let streamRes = await streamWithRotation(chunks[i], {
                ...opts,
                context: useContext ? ctx : undefined,
                onChunk: onChunkStream
              });
              // Fallback: if the context-memory pass returned no translation body, retry once without context
              if ((!chunkResult.trim() || (chunks[i].trim().length > 300 && chunkResult.trim().length < 100)) && useContext) {
                chunkResult = '';
                streamRes = await streamWithRotation(chunks[i], { ...opts, context: undefined, onChunk: onChunkStream });
              }
              if (useContext) { ctx = streamRes.newContext || ctx; }
              if (streamRes?.usage) {
                totalPromptTokens += streamRes.usage.promptTokens || 0;
                totalOutputTokens += streamRes.usage.outputTokens || 0;
                totalTokensUsed += streamRes.usage.totalTokens || 0;
              }
              setProgress(Math.floor(((i + 1) / chunks.length) * 100));
              saveState(result, ctx, i + 1);
            }
            result = stripContextLeak(result);
            if (!(result || '').trim()) throw new Error('Provider returned an empty stream. Check the selected model in Settings · Engine.');
            setTranslatedChapters([{ title: 'Translated Document', content: result }]);
            localStorage.removeItem(jobId); setActiveSession(null);
          } else if (useContext) {
            for (let i = startIndex; i < chunks.length; i++) {
              setProgressLabel(`Translating chunk ${i + 1}/${chunks.length} (with context)...`);
              let translated = null;
              try {
                translated = await translateWithRotation(chunks[i], { ...opts, context: ctx });
              } catch (err) {
                if (err.name === 'AbortError' || opts?.signal?.aborted) throw err;
                const isFatalQuota = (err.message || '').includes('429') || (err.message || '').includes('quota') || (err.message || '').includes('billing');
                if (isFatalQuota) {

          await handleTranslateEbook(cleaned, false, isEpub, originalZip);
        } catch (e) { setError(e.message); toast(e.message, 'error') }
        finally { setUploadingFile(false); if (fileInputRef.current) fileInputRef.current.value = '' }
      };

      // --- Drag & Drop ---
      const onDragOver = e => { e.preventDefault(); setIsDragOver(true) };
      const onDragLeave = () => setIsDragOver(false);
      const onDrop = e => { e.preventDefault(); setIsDragOver(false); const f = e.dataTransfer.files[0]; if (f) processFile(f) };

      // Restored handlers referenced by the render tree (were undefined)
      const handlePasteFromClipboard = async () => {
        try {
          const t = await navigator.clipboard.readText();
          if (t && t.trim()) { setInputText(t); localStorage.setItem('inputText', t); toast('Pasted from clipboard.'); }
        } catch (e) { toast('Clipboard access denied by browser.', 'error'); }
      };

      const handleAutoDetectSplit = () => {
        const text = (inputText || '').trim();
        if (!text) return;
        const lines = text.split(/\r?\n/);
        const heading = /^(?:第[0-9零一二三四五六七八九十百千万]+[章回卷节篇]|Chapter\s*\d+|CHAPTER\s*\d+)/;
        const parts = [];
        let cur = null;
        for (const line of lines) {
          const trimmed = line.trim();
          if (heading.test(trimmed)) {
            if (cur) parts.push(cur);
            cur = { title: trimmed, content: '' };
          } else if (cur) {
            cur.content += line + '\n';
          } else {
            cur = { title: 'Chapter 1', content: line + '\n' };
          }
        }
        if (cur) parts.push(cur);
        if (parts.length > 1) {
          setChapters(parts.map(p => ({ title: p.title, content: p.content.trim() })));
          toast(`Split into ${parts.length} chapters.`, 'success');
        } else {
          toast('No chapter headings detected — using whole text as one chapter.', 'info');
          setChapters([{ title: 'Chapter 1', content: text }]);
        }
      };

      const handleSwapLanguages = () => {
        if (srcLang === 'Auto-detect') { toast('Auto-detect cannot be swapped — pick a source language first.', 'info'); return; }
        const s = srcLang; setSrcLang(tgtLang); setTgtLang(s);
      };

      // --- Download Handlers ---
      const sanitizeTextForPdf = (str) => {
        if (!str) return '';
        let s = str
          .replace(/[ōŌ]/g, m => m === 'ō' ? 'o' : 'O')
          .replace(/[ūŪ]/g, m => m === 'ū' ? 'u' : 'U')
          .replace(/[āĀ]/g, m => m === 'ā' ? 'a' : 'A')
          .replace(/[īĪ]/g, m => m === 'ī' ? 'i' : 'I')
          .replace(/[ēĒ]/g, m => m === 'ē' ? 'e' : 'E')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');

        s = s
          .replace(/[\u3000\u00A0\u2000-\u200B\u202F\u205F\uFEFF]/g, ' ')
          .replace(/[\u2018\u2019\u201A\u201B\u2032\u2035]/g, "'")
          .replace(/[\u201C\u201D\u201E\u201F\u2033\u2036]/g, '"')
          .replace(/[\u2013\u2014\u2015\u2E3A\u2E3B]/g, ' - ')
          .replace(/\u2026/g, '...')
          .replace(/[«»「」『』]/g, '"')
          .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/g, '')
          .replace(/[^\x20-\x7E\xA0-\xFF]/g, '')
          .replace(/[ \t]+/g, ' ')
          .trim();
        return s;
      };

      const isGenericTitle = t => !t || t.trim() === '' || /^translated\s*(document|file)?$/i.test(t.trim());

      const getExportChapters = () => {
        if (translatedChapters && translatedChapters.length > 0) {
          const valid = translatedChapters.filter(ch => ch && ch.content && ch.content.trim() && !ch.content.startsWith('[Error:'));
          if (valid.length > 0) return valid;
        }
        const curText = assembledText || (translatedChapters || []).map(c => `${c.title}\n\n${c.content}`).join('\n\n\n').trim();
        if (curText && curText.trim()) {
          return [{ title: 'Translated Document', content: curText.trim() }];
        }
        return [];
      };

      const handleDownloadPDF = async () => {
        const chaptersToExport = getExportChapters();
        if (!chaptersToExport.length) return setError('No translated content available yet to download.');
        setDownloadingPdf(true); setError('');
        try {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
          doc.setFont('Helvetica', 'normal');
          const m = 18;
          const mw = doc.internal.pageSize.getWidth() - 2 * m;
          const pageHeight = doc.internal.pageSize.getHeight();
          const lh = 6.2;
          let y = m + 5;

          chaptersToExport.forEach((ch, i) => {
            if (i > 0) { doc.addPage(); y = m + 5; }
            const hasRealTitle = ch.title && ch.title.trim() && !isGenericTitle(ch.title);
            if (hasRealTitle) {
              const cleanTitle = sanitizeTextForPdf(ch.title);
              doc.setFontSize(16);
              doc.setFont('Helvetica', 'bold');
              doc.text(cleanTitle, m, y);
              y += lh * 2.2;
              doc.setFont('Helvetica', 'normal');
            }
            doc.setFontSize(10.5);
            const rawLines = (ch.content || '').split(/\r?\n/);
            for (const rawLine of rawLines) {
              const p = sanitizeTextForPdf(rawLine);
              if (!p) continue;

              const isSceneDivider = /^(\*|\*{3,}|\.{3,}|—{2,}|-{3,})$/.test(p);
              const splitLines = doc.splitTextToSize(p, mw);

              if (y + (splitLines.length * lh) > pageHeight - m) {
                doc.addPage();
                y = m + 5;
              }

              splitLines.forEach(l => {
                if (isSceneDivider) {
                  doc.text(l, doc.internal.pageSize.getWidth() / 2, y, { align: 'center' });
                } else {
                  doc.text(l, m, y);
                }
                y += lh;
              });
              y += isSceneDivider ? lh * 0.8 : lh * 0.45;
            }
          });
          const pdfBlob = doc.output('blob');
          const docTitle = chaptersToExport.length === 1 && !isGenericTitle(chaptersToExport[0].title) ? chaptersToExport[0].title.trim() : `Translated Novel (${tgtLang})`;
          const cleanDocName = docTitle && !isGenericTitle(docTitle) ? sanitizeFilename(docTitle).replace(/\s+/g, '_') : `translated_${tgtLang.toLowerCase().replace(/\s/g, '-')}`;
          const fileName = `${cleanDocName}.pdf`;
          await saveUniversalBlob(pdfBlob, fileName, 'application/pdf');
        } catch (e) { setError(`PDF error: ${e.message}`) } finally { setDownloadingPdf(false) }
      };

      // (escapeXml is global)

      const handleDownloadEPUB = async () => {
        const chaptersToExport = getExportChapters();
        if (!chaptersToExport.length) return setError('No translated content available yet to download.');
        setDownloadingEpub(true);
        setError('');
        try {
          const docTitle = chaptersToExport.length === 1 && !isGenericTitle(chaptersToExport[0].title)
            ? chaptersToExport[0].title.trim()
            : `Translated Novel (${tgtLang})`;
          const author = 'Gemini Translator';
          const lang = tgtLang.split(/[-_ ]/)[0].toLowerCase() || 'en';

          // Preserve the ORIGINAL EPUB structure (OPF/TOC/format) when translating from an EPUB file
          if (currentIsEpub && currentOriginalZip && typeof currentOriginalZip.generateAsync === 'function') {
            setEpubPackagingModal({ title: docTitle, status: ' Packaging original EPUB structure…', pct: 40 });
            await updateOriginalEpubNavigation(currentOriginalZip, chaptersToExport);
            const zipBlob = await currentOriginalZip.generateAsync({ type: 'blob', mimeType: 'application/epub+zip' });
            setEpubPackagingModal(null);
            const cleanDocName = sanitizeFilename(docTitle).replace(/\s+/g, '_');
            const fileName = `${cleanDocName}.epub`;
            const res = await saveUniversalBlob(zipBlob, fileName, 'application/epub+zip');
            toast(' EPUB downloaded with the original structure!', 'success');
            return { blob: zipBlob, fileName, path: res?.path };
          }

          // Always compile a clean, standardized EPUB with translated TOC and proper paragraph spacing
          setEpubPackagingModal({ title: docTitle, status: ' Assembling translated EPUB archive...', pct: 10 });
          const blob = await generateEpubFromChapters(chaptersToExport, docTitle, author, lang, (status, pct, elapsed) => {
            setEpubPackagingModal({ title: docTitle, status, pct, elapsed });
          });
          setEpubPackagingModal(null);
          toast(' EPUB downloaded successfully!', 'success');
          const cleanDocName = docTitle && !isGenericTitle(docTitle) ? sanitizeFilename(docTitle).replace(/\s+/g, '_') : `translated_${tgtLang.toLowerCase().replace(/\s/g, '-')}`;
          const fileName = `${cleanDocName}.epub`;
          const res = await saveUniversalBlob(blob, fileName, 'application/epub+zip');
          return { blob, fileName, path: res?.path };
        } catch (e) {
          setError(`EPUB error: ${e.message}`);
          toast(`EPUB error: ${e.message}`, 'error');
        } finally {
          setDownloadingEpub(false);
        }
      };

      const handleDownloadDOCX = async () => {
        const chaptersToExport = getExportChapters();
        if (!chaptersToExport.length) return setError('No content to download.');
        setDownloadingDocx(true);
        setError('');
        try {
          const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = window.docx;
          const sections = chaptersToExport.map((ch, i) => {
            const hasRealTitle = ch.title && ch.title.trim() && !isGenericTitle(ch.title);
            const paragraphElements = [];

            if (hasRealTitle) {
              paragraphElements.push(new Paragraph({
                text: ch.title.trim(),
                heading: HeadingLevel.HEADING_1,
                spacing: { before: 240, after: 280 }
              }));
            }

            const lines = (ch.content || '').split(/\r?\n/);
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed) continue;

              // Center divider markers (e.g. *, ***, ..., ---)
              const isSceneDivider = /^(\*|\*{3,}|\.{3,}|—{2,}|-{3,})$/.test(trimmed);

              paragraphElements.push(new Paragraph({
                alignment: isSceneDivider ? AlignmentType.CENTER : AlignmentType.LEFT,
                children: [
                  new TextRun({
                    text: trimmed,
                    font: 'Calibri',
                    size: 24 // 12pt
                  })
                ],
                spacing: {
                  line: 360, // 1.5 line height
                  after: isSceneDivider ? 240 : 180 // Webnovel spacing after sentence/dialogue
                }
              }));
            }

            return {
              properties: i > 0 ? { type: (window.docx?.SectionType?.NEXT_PAGE || 'nextPage'), page: { pageBreaks: { before: true } } } : {},
              children: paragraphElements
            };
          });

          const doc = new Document({
            sections,
            styles: {
              default: {
                document: {
                  run: { font: 'Calibri', size: 24 }
                }
              }
            }
          });
          const blob = await Packer.toBlob(doc);
          const docTitle = chaptersToExport.length === 1 && !isGenericTitle(chaptersToExport[0].title) ? chaptersToExport[0].title.trim() : `Translated Novel (${tgtLang})`;
          const cleanDocName = docTitle && !isGenericTitle(docTitle) ? sanitizeFilename(docTitle).replace(/\s+/g, '_') : `translated_${tgtLang.toLowerCase().replace(/\s/g, '-')}`;
          const fileName = `${cleanDocName}.docx`;
          await saveUniversalBlob(blob, fileName, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
        } catch (e) {
          setError(`DOCX error: ${e.message}`);
          toast(`DOCX error: ${e.message}`, 'error');
        } finally {
          setDownloadingDocx(false);
        }
      };

      // --- Helpers for render ---
      const btn = (props, ...ch) => h('button', props, ...ch);
      const ic = (Icon, size = 18) => {
        const comp = Icon || LucideIcons?.['BookText'] || LucideIcons?.['FileText'] || 'span';
        return h(comp, { size, className: 'shrink-0' });
      };
      const disabled = isTranslating || uploadingFile;
      const activeModel = useCustomModel && customModel ? customModel : geminiModel;

      // ═══════════════════════════════════════
      // RENDER
      // ═══════════════════════════════════════
      // ═══════════════════════════════════
      // TWO LIGHTS RENDER (Phase 1)
      // ═══════════════════════════════════
      const [sheetOpen, setSheetOpen] = useState(false);
      const [glossaryEditorOpen, setGlossaryEditorOpen] = useState(false);
      const [elapsedSec, setElapsedSec] = useState(0);
      const [libCollapsed, setLibCollapsed] = useState({ books: false, history: false });
      const [libQuery, setLibQuery] = useState('');
      const libQ = libQuery.trim().toLowerCase();
      const filteredBooks = libQ ? webImportHistory.filter(item => `${item.title || ''} ${item.chapterCount || ''} ${new Date(item.timestamp || 0).toLocaleDateString()} ${new Date(item.timestamp || 0).toLocaleString()}`.toLowerCase().includes(libQ)) : webImportHistory;
      const filteredHistory = libQ ? history.filter(entry => `${new Date(entry.ts).toLocaleDateString()} ${new Date(entry.ts).toLocaleString()} ${entry.srcLang || ''} ${entry.tgtLang || ''} ${entry.outputPreview || ''}`.toLowerCase().includes(libQ)) : history;
      useEffect(() => {
        if (!isTranslating) { setElapsedSec(0); return; }
        const t = setInterval(() => setElapsedSec(s => s + 1), 1000);
        return () => clearInterval(t);
      }, [isTranslating]);

      useEffect(() => { localStorage.setItem('readerTheme', readerTheme); }, [readerTheme]);
      useEffect(() => { localStorage.setItem('readerFont', readerFont); }, [readerFont]);
      useEffect(() => { localStorage.setItem('readerFontSize', String(readerFontSize)); }, [readerFontSize]);

      useEffect(() => {
        const openGloss = () => setGlossaryEditorOpen(true);
        window.addEventListener('open-glossary-editor', openGloss);
        return () => window.removeEventListener('open-glossary-editor', openGloss);
      }, []);

      useEffect(() => {
        const esc = (e) => {
          if (e.key === 'Escape') {
            setSheetOpen(false);
            setGlossaryEditorOpen(false);
          }
        };
        window.addEventListener('keydown', esc);
        return () => window.removeEventListener('keydown', esc);
      }, []);

      const importGlossaryFile = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        readFileAsText(f)
          .then(t => { setTerminology(t); localStorage.setItem('terminology', t); toast('Glossary imported.'); })
          .catch(err => toast('Import failed: ' + err.message, 'error'));
        e.target.value = '';
      };

      const removeImportChapter = (idx) => {
        setWebImportData(prev => {
          if (!prev || !prev.chapters) return prev;
          const chapters = prev.chapters.filter((_, i) => i !== idx);
          return { ...prev, chapters };
        });
      };

      const moveImportChapter = (idx, dir) => {
        setWebImportData(prev => {
          if (!prev || !prev.chapters) return prev;
          const chapters = [...prev.chapters];
          const j = idx + dir;
          if (j < 0 || j >= chapters.length) return prev;
          [chapters[idx], chapters[j]] = [chapters[j], chapters[idx]];
          return { ...prev, chapters };
        });
      };

      const handleExportRow = async (kind) => {
        if (kind === 'epub') { setSheetOpen(false); await handleDownloadEPUB(); return; }
        if (kind === 'reader') {
          setSheetOpen(false);
          const res = await handleDownloadEPUB();
          if (res && res.fileName) {
            const opened = await window.NativeBridge?.openWithReader(res.fileName, res.path);
            if (!opened) toast('EPUB saved to Downloads! Tap to open with your favorite reader.', 'info');
          }
          return;
        }
        if (kind === 'pdf') { setSheetOpen(false); await handleDownloadPDF(); return; }
        if (kind === 'docx') { setSheetOpen(false); await handleDownloadDOCX(); return; }
      };

      const switchRow = (label, checked, onChange) => h('div', { className: 'set-row' },
        h('span', { className: 'l' }, label),
        h('button', { type: 'button', className: `switch ${checked ? 'on' : ''}`, onClick: () => onChange(!checked), 'aria-pressed': checked })
      );

      const chipSelectStyle = { background: 'var(--void)', border: '1px solid var(--hairline)', color: 'var(--paper-dim)', borderRadius: 8, padding: '4px 6px', fontSize: 11, outline: 'none', maxWidth: 170 };

      const glossaryTermCount = (terminology || '').split(/\r?\n/).filter(l => l.trim().startsWith('-')).length;

      const tabTitle = activeTab === 'text' ? 'Translate' : activeTab === 'web_importer' ? 'Import' : activeTab === 'studio' ? 'Studio' : activeTab === 'history' ? 'Library' : 'Settings';
      const tabSub = activeTab === 'text'
        ? `${provider.toUpperCase()} · ${provider === 'gemini' ? geminiModel : provider === 'deepseek' ? deepseekModel : provider}`
        : activeTab === 'web_importer' ? 'AO3 · Lofter · Syosetu · Witch Cult'
        : activeTab === 'studio' ? 'Lossless EPUB Splitter & Merger'
        : activeTab === 'history' ? 'Novel Library & Saved Sessions'
        : 'API Keys, Typography & Sync';

      const navItems = [['text', 'Translate', Languages], ['web_importer', 'Import', Globe], ['studio', 'Studio', Layers], ['history', 'Library', Library], ['settings', 'Settings', Settings]];
      const fontThemes = [{ id: 'literata', label: 'Literata' }, { id: 'georgia', label: 'Georgia' }, { id: 'inter', label: 'Inter' }, { id: 'none', label: 'Default' }];

      return h(React.Fragment, null,
        h('div', { className: 'tl-app' },

          // ── HEADER ──
          h('header', { className: 'tl-head' },
            h('div', { className: 'tl-head-inner' },
              h('div', null,
                h('div', { className: 'tl-title' }, tabTitle),
                h('div', { className: 'tl-subtitle' }, tabSub)
              ),
              h('div', { style: { display: 'flex', gap: 8, alignItems: 'center' } },
                h('button', { type: 'button', className: 'version-chip', title: 'Check for updates', onClick: () => checkForAppUpdate(true) },
                  `v${VERSION}`, availableUpdate ? h('span', { className: 'dot' }) : null
                ),
                !isStandalone && h('button', { type: 'button', className: 'icon-btn', title: 'Install App on Device', onClick: handleInstallPWA }, ic(Download, 16))
              )
            )
          ),

          // ── UPDATE BANNER ──
          availableUpdate && h('div', { className: 'tl-wrap', style: { marginTop: 16 } },
            h('div', { className: 'card', style: { borderColor: 'rgba(124,135,255,.5)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', marginBottom: 0 } },
              h('div', null,
                h('div', { style: { fontWeight: 700, fontSize: 13 } }, `Update Ready: v${availableUpdate.latestVersion}`),
                h('div', { style: { fontSize: 11.5, color: 'var(--slate)' } }, 'Tap to install the latest features and fixes.')
              ),
              h('div', { style: { display: 'flex', gap: 8, alignItems: 'center' } },
                h('button', { type: 'button', className: 'mini-btn', disabled: isUpdating, onClick: handlePerformUpdate }, isUpdating ? 'Downloading…' : 'Update Now'),
                h('button', { type: 'button', className: 'icon-btn', onClick: () => setAvailableUpdate(null) }, '✕')
              )
            )
          ),

          h('main', { className: 'tl-wrap', style: { paddingTop: 16 } },

            // ═══ TAB 1: TRANSLATE ═══
            activeTab === 'text' && h(React.Fragment, null,
              h('div', { className: 'langrow' },
                h('select', { className: 'lang', value: srcLang, onChange: e => setSrcLang(e.target.value), disabled }, LANGUAGES.map(l => h('option', { key: l, value: l }, l))),
                h('button', { type: 'button', className: 'swap', title: 'Swap Languages', disabled: disabled || srcLang === 'Auto-detect', onClick: handleSwapLanguages }, ic(ArrowRightLeft, 14)),
                h('select', { className: 'lang', value: tgtLang, onChange: e => setTgtLang(e.target.value), disabled }, TARGET_LANGUAGES.map(l => h('option', { key: l, value: l }, l)))
              ),
              h('div', { className: 'meta' },
                h('span', { className: 'chip' }, `${concurrency} streams`),
                h('span', null, `${glossaryTermCount} glossary terms${smartGlossary ? ' · Smart' : ''}`)
              ),

              h('div', { className: 'pane', onDragOver, onDragLeave, onDrop, style: isDragOver ? { borderColor: 'var(--iris-deep)' } : null },
                h('div', { className: 'pane-head' },
                  h('span', { className: 'lbl' }, 'Source'),
                  h('div', { className: 'pane-acts' },
                    inputText.trim() && h('button', { type: 'button', className: 'chip-act', disabled, onClick: () => { setInputText(''); setChapters([]); localStorage.removeItem('inputText'); } }, 'Clear'),
                    h('button', { type: 'button', className: 'chip-act', disabled, onClick: handlePasteFromClipboard }, 'Paste'),
                    h('button', { type: 'button', className: 'chip-act', disabled: disabled || uploadingFile, onClick: () => fileInputRef.current && fileInputRef.current.click() }, uploadingFile ? 'Loading…' : 'File'),
                    inputText.trim() && h('span', { className: 'count' }, `${charCount(inputText).toLocaleString()} chars · ~${estimateTokens(inputText).toLocaleString()} tok`)
                  )
                ),
                h('textarea', {
                  className: 'pane-textarea', ref: inputRef, value: inputText, disabled,
                  onChange: e => { setInputText(e.target.value); localStorage.setItem('inputText', e.target.value); },
                  placeholder: 'Paste raw novel text or drop an EPUB/TXT/DOCX/PDF book here…',
                  style: { height: `${inputBoxHeight}px` }
                }),
                h('input', { type: 'file', ref: fileInputRef, onChange: (e) => { const f = e.target.files && e.target.files[0]; if (f) processFile(f); }, accept: '.txt,.epub,.docx,.pdf,.md,.html,.xml', style: { display: 'none' } })
              ),
              renderBoxResizeBar('input'),

              h('div', { className: 'pane' },
                h('div', { className: 'pane-head' },
                  h('span', { className: 'lbl' }, 'Translated'),
                  h('div', { className: 'pane-acts' },
                    h('button', { type: 'button', className: 'chip-act', disabled: !assembledText.trim(), onClick: () => { if (assembledText) copyText(assembledText).then(() => toast('Copied!')); } }, 'Copy'),
                    h('button', { type: 'button', className: 'chip-act', disabled: !assembledText.trim(), onClick: () => { setReaderOpen(true); setReaderChapterIdx(0); } }, 'Reader'),
                    assembledText.trim() && h('span', { className: 'count' }, `${wordCount(assembledText).toLocaleString()} words`)
                  )
                ),
                h('textarea', {
                  className: 'pane-textarea out', ref: outputRef, value: assembledText,
                  onChange: e => setAssembledText(e.target.value),
                  placeholder: 'Translated text will appear here…',
                  style: { height: `${outputBoxHeight}px` }
                })
              ),
              renderBoxResizeBar('output'),

              isTranslating && h('div', { className: 'card', style: { borderColor: 'rgba(124,135,255,.45)' } },
                h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, marginBottom: 10 } },
                  h('span', { style: { fontSize: 12.5, fontWeight: 700, color: 'var(--iris)' } }, progressLabel || 'Translating…'),
                  h('div', { style: { display: 'flex', gap: 10, alignItems: 'center' } },
                    h('span', { className: 'count' }, `${Math.floor(elapsedSec / 60)}:${String(elapsedSec % 60).padStart(2, '0')}`),
                    h('button', { type: 'button', className: 'mini-btn danger', onClick: cancelTranslation }, 'Cancel')
                  )
                ),
                h('div', { className: 'mini-progress' }, h('i', { style: { width: `${progress}%` } })),
                h('div', { className: 'count', style: { marginTop: 8 } }, `${progress}%`)
              ),

              lastUsageStats && !isTranslating && h('div', { className: 'card' },
                h('div', { className: 'card-title' },
                  h('span', null, 'Last Translation'),
                  h('button', { type: 'button', className: 'chip-act', onClick: () => setLastUsageStats(null) }, '✕')
                ),

                    h('input', { type: 'file', accept: '.json', style: { display: 'none' }, onChange: (e) => { const f = e.target.files && e.target.files[0]; if (f) importFullBackup({ target: { files: [f] } }); } })
                  )
                )
              ),

              h('div', { className: 'card' },
                h('div', { className: 'card-title' }, h('span', null, 'App')),
                h('div', { className: 'set-row' }, h('span', { className: 'l' }, 'Check for updates'), h('button', { type: 'button', className: 'chip-act', onClick: () => checkForAppUpdate(true) }, `v${VERSION}`)),
                h('div', { className: 'set-row' }, h('span', { className: 'l' }, 'Install App'), h('button', { type: 'button', className: 'chip-act', onClick: handleInstallPWA }, 'Install')),
                h('div', { className: 'set-row' }, h('span', { className: 'l' }, 'Shortcuts'), h('span', { className: 'count' }, 'Ctrl+Enter · Ctrl+Shift+C · Ctrl+Alt+R'))
              )
            )
          ),

          // ── BOTTOM NAV ──
          h('nav', { className: 'bottomnav' },
            navItems.map(([key, label, Icon]) => {
              const isActive = activeTab === key;
              return h('button', {
                key,
                type: 'button',
                className: `nav-item ${isActive ? 'active' : ''}`,
                onClick: () => {
                  setActiveTab(key);
                  localStorage.setItem('activeTab', key);
                  window.scrollTo({ top: 0, behavior: 'smooth' });
                }
              }, ic(Icon, 18), h('span', null, label));
            })
          )
        ),

        // ── EXPORT / TOOLS SHEET ──
        sheetOpen && h('div', { className: 'sheet-backdrop', onClick: () => setSheetOpen(false) },
          h('div', { className: 'sheet', onClick: (e) => e.stopPropagation() },
            h('div', { className: 'sheet-handle' }),
            h('div', { className: 'sheet-lbl' }, 'Export'),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => handleExportRow('epub') }, h('span', { className: 'ic' }, '⇩'), 'EPUB', h('span', { className: 'chev' }, '›')),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => handleExportRow('reader') }, h('span', { className: 'ic' }, '◈'), 'Open in Reader', h('span', { className: 'chev' }, '›')),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => handleExportRow('pdf') }, h('span', { className: 'ic' }, '⇩'), 'PDF', h('span', { className: 'chev' }, '›')),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => handleExportRow('docx') }, h('span', { className: 'ic' }, '⇩'), 'DOCX', h('span', { className: 'chev' }, '›')),
            h('div', { className: 'sheet-lbl' }, 'Tools'),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => { setSheetOpen(false); handleAutoDetectSplit(); } }, h('span', { className: 'ic' }, '✂'), 'Split Chapters', h('span', { className: 'chev' }, '›')),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => { setBoxPreset('input', 'auto'); setBoxPreset('output', 'auto'); setSheetOpen(false); } }, h('span', { className: 'ic' }, '↕'), 'Fit Text Height', h('span', { className: 'chev' }, '›')),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => { setBoxPreset('input', 'S'); setBoxPreset('output', 'S'); setSheetOpen(false); } }, h('span', { className: 'ic' }, '↺'), 'Reset Box Heights', h('span', { className: 'chev' }, '›')),
            h('button', { type: 'button', className: 'sheet-row', onClick: () => { setSheetOpen(false); setGlossaryEditorOpen(true); } }, h('span', { className: 'ic' }, '📖'), 'Glossary Editor', h('span', { className: 'chev' }, '›'))
          )
        ),

        // ── GLOSSARY FULL-SCREEN EDITOR ──
        glossaryEditorOpen && h('div', { className: 'gloss-overlay' },
          h('div', { className: 'tl-head-inner' },
            h('div', null,
              h('div', { className: 'tl-title' }, 'Glossary'),
              h('div', { className: 'tl-subtitle' }, `${glossaryTermCount} terms · full-screen editor`)
            ),
            h('div', { className: 'pane-acts' },
              h('button', { type: 'button', className: 'chip-act', onClick: () => applyGlossaryPreset('ri') }, 'RI'),
              h('button', { type: 'button', className: 'chip-act', onClick: () => applyGlossaryPreset('lotm') }, 'LOTM'),
              h('button', { type: 'button', className: 'chip-act', onClick: () => applyGlossaryPreset('xianxia') }, 'Xianxia'),
              h('button', { type: 'button', className: 'chip-act accent', disabled: isOptimizingGlossary, onClick: handleAiOptimizeGlossary }, isOptimizingGlossary ? 'Optimizing…' : 'AI Optimize ✦'),
              h('button', { type: 'button', className: 'icon-btn', onClick: () => setGlossaryEditorOpen(false) }, '✕')
            )
          ),
          h('div', { className: 'gloss-editor' },
            h('textarea', {
              value: terminology,
              onChange: e => { setTerminology(e.target.value); localStorage.setItem('terminology', e.target.value); },
              placeholder: 'Enter character names and lore terms (e.g. - Fang Yuan -> Fang Yuan (MC))'
            })
          ),
          h('div', { className: 'gloss-foot' },
            h('span', null, `${glossaryTermCount} terms · ${(terminology || '').split(/\s+/).filter(Boolean).length} words`),
            h('div', { className: 'pane-acts' },
              h('label', { className: 'chip-act', style: { cursor: 'pointer' } },
                '⇧ Import',
                h('input', { type: 'file', accept: '.txt', style: { display: 'none' }, onChange: importGlossaryFile })
              ),
              h('button', { type: 'button', className: 'chip-act', onClick: exportGlossaryTxt }, '⇩ Export'),
              h('button', { type: 'button', className: `chip-act ${smartGlossary ? '' : 'ghost'}`, onClick: () => { setSmartGlossary(!smartGlossary); localStorage.setItem('smartGlossary', !smartGlossary); } }, `Smart ✦ ${smartGlossary ? 'on' : 'off'}`)
            )
          )
        ),

        // ── TOASTS ──
        h('div', { className: 'toast-wrap' },
          toasts.map(t => h('div', { key: t.id, className: `toast ${t.type || 'success'}` }, t.msg))
        ),

        // ── CONFIRM DIALOG ──
        showModal && h('div', { className: 'confirm-backdrop', onClick: () => { setShowModal(false); setModalCallback(null); } },
          h('div', { className: 'confirm-box', onClick: (e) => e.stopPropagation() },
            h('p', null, modalMessage),
            h('div', { className: 'confirm-actions' },
              h('button', { type: 'button', className: 'mini-btn', onClick: () => { if (modalCallback) modalCallback(); } }, 'Confirm'),
              h('button', { type: 'button', className: 'mini-btn ghost', onClick: () => { setShowModal(false); setModalCallback(null); } }, 'Cancel')
            )
          )
        ),

        // ── EPUB PACKAGING PROGRESS ──
        epubPackagingModal && h('div', { className: 'toast-wrap', style: { zIndex: 125 } },
          h('div', { className: 'toast info' },
            h('div', null, epubPackagingModal.title || 'Compiling EPUB…'),
            h('div', { style: { fontSize: 11, marginTop: 6, fontFamily: "'IBM Plex Mono', monospace" } },
              `${epubPackagingModal.status || ''} · ${epubPackagingModal.pct || 0}%${epubPackagingModal.elapsed ? ' · ' + epubPackagingModal.elapsed : ''}`)
          )
        ),

        // ── DOWNLOAD SUCCESS MODAL ──
        downloadSuccessModal && h('div', { className: 'confirm-backdrop', style: { zIndex: 126 }, onClick: () => setDownloadSuccessModal(null) },
          h('div', { className: 'confirm-box', onClick: (e) => e.stopPropagation() },
            h('p', null, 'File Saved Successfully!'),
            h('p', { style: { fontSize: 12, color: 'var(--slate)', textAlign: 'center', wordBreak: 'break-all', marginBottom: 14, fontWeight: 500 } }, downloadSuccessModal.fileName),
            h('div', { className: 'confirm-actions' },
              h('button', { type: 'button', className: 'mini-btn', onClick: () => setDownloadSuccessModal(null) }, 'OK')
            )
          )
        ),

        // ── READER ──
        h(MoonReaderModal, {
          open: readerOpen,
          onClose: () => setReaderOpen(false),
          text: assembledText,
          chapters: getExportChapters(),
          currentIdx: readerChapterIdx,
          onChapterChange: setReaderChapterIdx,
          theme: readerTheme,
          setTheme: setReaderTheme,
          font: readerFont,
          setFont: setReaderFont,
          fontSize: readerFontSize,
          setFontSize: setReaderFontSize,
          tgtLang
        }),

        // ── EPUB STUDIO PREVIEW MODAL ──
        h('div', { dangerouslySetInnerHTML: { __html: modalHtml } })
      );
    }


    const root = document.getElementById('root');
    if (root) ReactDOM.createRoot(root).render(h(ErrorBoundary, null, h(App)));
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      if (window.Capacitor || window.NativeAndroidBridge) {
        // In native Android app, unregister service worker to prevent stale caching
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (const reg of regs) reg.unregister();
        });
      } else if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            registration.update();
            console.log('ServiceWorker registration active: ', registration.scope);
          }).catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    }
  </script>
</body>

</html>
