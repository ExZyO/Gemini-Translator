 Outer Deities are powerful cosmic entities that have attempted to invade Earth. Among them are the Mother Goddess of Depravity, the Mother Tree of Desire, the Son of Chaos, the Primordial Hunger, the Supernova Dominator, and the Inextinguishable Ravings.
Mother Goddess of Depravity
Also known as the Primordial Moon, the Great Mother, the Sovereign of the Physical World, and the Mother of All Things, "She" has occupied the Moon since the First Epoch, terraforming it into the Crimson Moon. "She" is the first child of the Original Creator and ruler of all feminine power in the Cosmos. "She" originally owned the Mother and Moon Pathways and currently possesses the Chaos Primogenitor Pathway.
Authorities & Symbolism
 * Chaos Primogenitor Pathway: Full authority over Reproduction, Propagation, Reality, and Nurturing the nascent Original Creator of the next Universe. This pathway combines "Original Sin, Evil, and Corruption" with "Reality and Procreation."
 * Mother Pathway (partial): Authorities over Life, Desolation, and Birth, symbolizing Motherhood.
 * Moon Pathway (partial): Authorities over Beauty, Creation, and Spirituality, symbolizing the Moon/Crimson Moon.
 * Sovereign of the Physical World: One of the three Pillars supporting the universe. "Her" soul and body are indestructible.
 * Origin of Evil: Innately possesses the Pathway of Evil and Corruption, including the Exploitation of Life.
 * Dominator of Reality: Full control over the Physical World, making "Her" almost impossible to displace, seal, or banish. "She" can "fix" mystical connections, spirits, and consciousness in place, disrupting interference.
 * New Life: Can give "New Life" to all things, including souls, consciousness, spirits, intellect, and Beyonder powers. This also provides immense healing properties.
 * Chaos Primogenitor: A unique symbol pointing to the Original Creator, whom "She" nurtures as the "Original Sin" of the next universe.
 * Beauty and Spirituality: Symbolizes beauty, radiating maternal brilliance that causes enemies to hesitate.
 * Death and Desolation: Can influence entities to wither, collapsing into death.
Appearance
 * Primordial Moon: Appears as a crimson sea flowing on the Moon's surface, digesting it.
 * True Form: Composed of countless haphazardly piled birthing organs, with swirling smoke and crimson moonlight forming an accretion-disk-like extension as clothing. Has a flawless human woman's head with long brown hair and crimson eyes, embodying beauty and maternal brilliance.
History
 * Created by the Original Creator, "She" is highly affected by the Law of Convergence, attracting parts of "Her" Sefirah and characteristics to Earth.
 * "She" had worshippers on Earth in the Pre-Epoch, being the source of all Mother Goddess-type deities.
 * "She" is worshipped by factions like the Life School of Thought and Rose School of Thought. Prayers often lead to cruelty, madness, and intense desire.
 * Suspected and later confirmed to have corrupted Roselle.
 * During Project Vortex, "She" traded Roselle Gustav's corruption for the Shadow of the Beauty Goddess.
 * Cooperated with the Mother Tree of Desire in "The Fool's Dream" to store Klein's traumas and grant "New Life" to Panatiya's corpse. Later betrayed the Celestial Worthy by siding with the Primordial God Almighty.
 * Descended onto Earth during "The Day of Many Disasters" and captured the Brood Hive.
 * During "The Apocalypse," "She" was dealt a critical blow by Lumian Lee and later saved the Goddess of Fate from being sealed by Klein. "She" eventually left the solar system after a temporary truce with Klein, but is contract-bound to return to help the Primordial God Almighty revive.
Mother Tree of Desire
The second child of the Original Creator, "She" is one of "His" three direct children along with the Mother Goddess of Depravity and the Son of Chaos. "She" originally owned the Abyss and Chained Pathways and currently possesses the Patriarch Pathway. "She" amplifies desire, including greed, hunger, sloth, lust, and reproduction.
Authorities & Symbolism
 * Patriarch Pathway (full): Authorities over Love, Envy, Reason, and Sentient Beings, symbolizing Desires. This pathway is a mix of "Desires (Reasons)" and "Blathering."
 * Abyss Pathway (partial): Authorities over Blood, Filth, and Corruption.
 * Chained Pathway (partial): Authorities over Curses and Binding.
 * Father of Devils (former): Holds corruptive influence over "Her" former pathways.
 * Perpetual Blatherer: Initiator of Reason and endless Desires; can awaken survival instincts and locate targets via desire.
 * Reason: "Her" existence blesses all Sentient Beings with Rationality.
Appearance
 * True Form: A humanoid giant tree covered in chaotic scales, adorned with enticing crystalline fruits, glistening alluring flowers, various metallic emblems, black hearts, bare tumors, and coins. Has two heads: a lower male head exuding bizarre desires, and an upper female head of extraordinary beauty with green hair.
History
 * Created by the Original Creator, "She" was heavily affected by the Law of Convergence, attracting parts of "Her" Sefirot and Beyonder characteristics to Earth.
 * Corrupted the Chained God in the Fifth Epoch, turning the Rose School of Thought into an evil organization.
 * Has a conflict with the Primordial Moon within the Rose School of Thought.
 * "Her" influence has significantly grown, with cooperation among "Her" worshiping organizations and signs of worship among Devil families.
 * Participated in Project Vortex by trading the Shadow of the Beauty Goddess for Roselle Gustav's corruption.
 * Exerted influence in Klein's dream, running Mushoku Hospital alongside the Mother Goddess of Depravity, later withdrawing before the final confrontation.
 * Attempted to fully grow the Tree of Shadow and descend onto Earth during "The Day of Many Disasters."
 * During "The Apocalypse," "She" was held off by Klein, severely wounded by the Master of the Shadow Cottage and Farbauti, and escaped into the Astral World with the Tenebrous World's help. "She" is expected to take a long time to recover.
Son of Chaos
The third child of the Original Creator, "He" is one of "His" three direct children along with the Mother Goddess of Depravity and the Mother Tree of Desire. "He" originally owned the Sefirah Nation of Disorder and its corresponding Black Emperor and Justiciar Pathways. "He" is the current owner of the Chaos Mist Pathway.
Authorities & Symbolism
 * Chaos Mist Pathway (full): Authorities over Blasphemy, Truth, and Chaos.
 * Contracts: Can make Contracts that even Great Old Ones must honor.
Appearance
 * As the Genie: A blurred and distorted pale golden figure formed from viscous light.
 * As the Uncertain Mist: Occupies a massive planet shrouded in layers of ever-changing white mist.
History
 * Created by the Original Creator, "He" was affected by the Law of Beyonder Characteristics Convergence, attracting parts of "His" characteristics to Earth.
 * In the First Epoch, "His" consciousness, the Genie, was sealed in the Magic Wishing Lamp by the Celestial Worthy of Heaven and Earth for Blessings.
 * Most of "His" remaining parts formed the Outer Deity known as the Uncertain Mist, worshipped by the School of Truth.
 * Heavily injured during Project Vortex, forcing "Him" to retreat and sleep for decades, preventing "Him" from bestowing boons until "The Apocalypse."
 * Without the Uncertain Mist to coordinate them, other Outer Deities were less willing to confront the Lord of Mysteries during "The Apocalypse."
Primordial Hunger
One of the Outer Deities that attempted to invade Earth. "He" is the current owner of the Tail-Devourer Pathway.
Authorities & Symbolism
 * Tail-Devourer Pathway (full): Authorities over Devouring, Convergence, and Hunger. Symbolizes Devouring and Convergence.
 * Convergence: Instinctively pulls others' true bodies to "His" side and can influence Fate.
 * Devour: Can Devour everything, including black holes, avatars, marionettes, and even ravings within "His" own mind. "His" power governs Digestion, utilization, and Erasure.
 * Counters: "His" symbols can be countered by the Calamity of Destruction's "Return of All Things to Chaos" and the God Almighty's "Creator."
Appearance
 * True Form: A dark vortex revealing bared white teeth and chaotic liquid encompassing all colors. Elongated black shadows with different heads, previously on "His" exterior, appear to have been consumed.
Personality
 * The most primitive and vulnerable Outer Deity, driven by desires of Convergence, with only a basic sense of self-preservation. Can still communicate.
History
 * Gathered around Earth with other powerful Outer Deities, seeking to retrieve their Sefirot and Beyonder Characteristics or accommodate neighboring ones.
 * Aimed to consume the City of Calamity, ingest the Chaos Sea, and absorb Uniquenesses of certain pathways.
 * "His" subordinate Angel, Ludwig Phil, was captured and sealed by the Church of the God of Knowledge and Wisdom.
 * During "The Apocalypse," "He" was held off by Adam and later dealt a critical blow by Lumian Lee, forcing "Him" to withdraw.
 * If "He" were to Devour the Chaos Primogenitor, it would cause an aggressive Convergence, leading to the return of the Original Creator.
Supernova Dominator
One of the Outer Deities that attempted to invade Earth. "He" is the current owner of the Condenser Pathway.
Authorities & Symbolism
 * Condenser Pathway (full): Authorities over Fusion, Cosmic Laws, and Fundamental Forces. Symbols of Density, Weight, Gravity, and Attraction.
 * Ruler of Stars: Controls and summons Stars, creating Supernovae and Black Holes. Can control millions of stars.
 * Great Attractor: Controls the Great Attractor, influencing galactic motion.
 * Symbolism of Weight and Density: Influences space-time and distorts dimensions through Density, Gravity, and Attraction. "His" gravitational pull affects both physical and intangible matter like Fate and Spirit Bodies.
 * Controller of Fundamental Forces: Controls Fundamental Forces of reality. Can manipulate particles to trigger nuclear fusions and create matter. Can emit blinding light.
 * Supernova: Creates Supernovae, either directly or by massing stars.
 * Black Hole: Creates massive Black Holes with immense gravitational force.
 * White Hole: Can reverse a Black Hole's collapse into a powerful explosion, strong enough to obliterate other Great Old Ones. This symbolism is fundamental and unremovable.
Appearance
 * True Form: A star cluster composed of myriad explosive suns, too large to be contained within a Solar System.
Personality
 * Wants to embody the symbol of Civilization, but "He" is quite mad, leading to periodic disasters in civilizations under "Him."
History
 * Served as Earth's "Sun" during much of the Second Epoch after the death of the Primordial God Almighty.
 * In the Fourth Epoch, "He" sent a spaceship with an embryonic black hole to Earth, thwarted by Mr. Door and Amon.
 * Agreed to suppress the Astral Barrier during Project Vortex in exchange for the seal on the spaceship being broken.
 * During "The Apocalypse," "He" was the first Outer Deity to affect Earth, tearing the planet into fragments with "His" star cluster form.
 * Held off by Klein, who handicapped "His" strength and eventually sealed "Him" in an Abomination Beyonder Characteristic.
 * After breaking "His" seal, "He" was affected by Klein's "Foolishness" and "Virtual Persona," making "Him" believe "He" is an ally of Earth's Great Old Ones.
Inextinguishable Ravings
One of the Outer Deities that attempted to invade Earth. "He" is the current owner of the Everlasting Pathway and seems to share "His" origin with the residual psyche of the Original Creator, the source of all ravings.
Authorities & Symbolism
 * Everlasting Pathway (full): Authorities and Symbols of Consciousness and Spirit. This pathway is a mix of two others.
 * Inextinguishable Ravings: "His" ravings awaken the spiritual imprint of the Original Creator within all Sefirot, Uniquenesses, and Beyonder characteristics, affecting everyone. Can directly project "His" voice into Sefirot and Uniquenesses.
 * Consciousness & Spirit: Symbolizes Consciousness and Spirit; injuring "Him" causes chaotic Consciousness and disoriented Spirits.
 * The Symbol of Life's Spirit: Awakens and corrupts lingering Spirits within aggregates.
 * Eternal Consciousness: Intwined with Consciousness and Spirits, making "Him" immortal.
 * The Philosophical Essence: Transmits the First Philosophy, causing physical and mental anguish in Beyonders who hear "His" voice.
 * Counters: Can be countered by "Darkness" (Eternal Darkness) which induces slumber, and "Devouring" (Primordial Hunger) which consumes ravings.
Appearance
 * Doesn't have a true physical form; attaches "Himself" to objects, causing them to exhibit specific colors or appearances.
History
 * Gathered around Earth with other powerful Outer Deities, seeking Sefirot and Beyonder Characteristics.
 * Coveted the Knowledge Moor and aimed to control the Chaos Sea.
 * During Project Vortex, "He" sent a bit of "His" power through the barrier, transmitting the First Philosophy and affecting Beyonders who heard "His" voice.
 * Followers planned to approach the remnants of the Knowledge Moor in Fourth Epoch Trier.

              const provNames = { gemini: 'Gemini', deepseek: 'DeepSeek', openai: 'OpenAI', claude: 'Claude', deepl: 'DeepL', libre: 'LibreTranslate' };
              exportKeys[prov] = [{ id: `${prov}-init`, name: `Primary ${provNames[prov] || prov} Key`, key: legacyKey }];
            } else {
              exportKeys[prov] = [];
            }
          });

          backup.apiKeysByProvider = exportKeys;
          backup.activeKeyIds = activeKeyIds;
          backup.geminiApiKey = exportKeys.gemini?.[0]?.key || localStorage.getItem('geminiApiKey') || localStorage.getItem('apiKey') || '';
          backup.deepseekApiKey = exportKeys.deepseek?.[0]?.key || localStorage.getItem('deepseekApiKey') || '';
          backup.openaiApiKey = exportKeys.openai?.[0]?.key || localStorage.getItem('openaiApiKey') || '';
          backup.claudeApiKey = exportKeys.claude?.[0]?.key || localStorage.getItem('claudeApiKey') || '';
          backup.deeplApiKey = exportKeys.deepl?.[0]?.key || localStorage.getItem('deeplApiKey') || '';
          backup.libreUrl = libreUrl;
        }
        const jsonStr = JSON.stringify(backup, null, 2);
        const fileName = `gemini_translator_backup_${shouldIncludeKeys ? 'with_keys_' : ''}${new Date().toISOString().slice(0, 10)}.json`;
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const file = new File([blob], fileName, { type: 'application/json' });

        // Android & Mobile: Use Share Sheet so user can pick save location (Files, Drive, etc.)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Gemini Translator Backup', text: 'Full app backup' });
            toast(shouldIncludeKeys ? 'Backup shared (+ API Keys)!' : 'Backup shared (No Keys)!');
            return;
          } catch (shareErr) {
            if (shareErr.name === 'AbortError') return; // user cancelled
            console.warn('Share API failed, falling back to download:', shareErr);
          }
        }

        // Desktop: Try native file picker (Save As dialog)
        if (window.showSaveFilePicker) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [{ description: 'JSON Backup', accept: { 'application/json': ['.json'] } }]
            });
            const writable = await handle.createWritable();
            await writable.write(blob);
            await writable.close();
            toast(shouldIncludeKeys ? 'Full backup saved (+ API Keys)!' : 'Full backup saved (No Keys)!');
            return;
          } catch (pickerErr) {
            if (pickerErr.name === 'AbortError') return;
            console.warn('File picker failed, falling back to download:', pickerErr);
          }
        }

        // Fallback: classic invisible anchor download
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(a.href);
        toast(shouldIncludeKeys ? 'Full backup (+ API Keys) downloaded!' : 'Full backup (No Keys) downloaded!');
      };

      const applyRestoredData = (data) => {
        if (!data || typeof data !== 'object') throw new Error('Invalid backup data format.');
        
        // 1. Array format (Glossary export)
        if (Array.isArray(data)) {
          const merged = [...savedGlossaries];
          data.forEach(g => {
            if (g.name && g.content && !merged.find(x => x.name === g.name)) merged.push(g);
          });
          setSavedGlossaries(merged);
          localStorage.setItem('savedGlossaries', JSON.stringify(merged));
          if (merged.length > 0 && !terminology) {
            setTerminology(merged[0].content || '');
            localStorage.setItem('terminology', merged[0].content || '');
            setActiveGlossaryId(merged[0].name);
          }

        }

        // 2. Full Backup format
        let keyCount = 0;
        let glossaryCount = 0;
        let restoredKeys = {};

        if (data.savedGlossaries && Array.isArray(data.savedGlossaries)) {
          setSavedGlossaries(data.savedGlossaries);
          try { localStorage.setItem('savedGlossaries', JSON.stringify(data.savedGlossaries)); } catch (e) {}
          data.savedGlossaries.forEach(g => dbPut('glossaries', g));
          glossaryCount = data.savedGlossaries.length;
        }
        if (data.translationHistory && Array.isArray(data.translationHistory)) {
          setHistory(data.translationHistory);
          try { localStorage.setItem('translationHistory', JSON.stringify(data.translationHistory.slice(0, 10))); } catch (e) {}
          data.translationHistory.forEach(h => dbPut('history', h));
        }
        if (data.exportHistory && Array.isArray(data.exportHistory)) {
          localStorage.setItem('exportHistory', JSON.stringify(data.exportHistory));
        }
        if (data.terminology !== undefined && data.terminology !== null) {
          setTerminology(data.terminology);
          localStorage.setItem('terminology', data.terminology);
        } else if (data.savedGlossaries && data.savedGlossaries.length > 0) {
          setTerminology(data.savedGlossaries[0].content || '');
          localStorage.setItem('terminology', data.savedGlossaries[0].content || '');
          setActiveGlossaryId(data.savedGlossaries[0].name);
        }
        if (data.customInstructions !== undefined && data.customInstructions !== null) {
          setCustomInstructions(data.customInstructions);
          localStorage.setItem('customInstructions', data.customInstructions);
        } else if (data.savedGlossaries && data.savedGlossaries.length > 0 && data.savedGlossaries[0].instructions) {
          setCustomInstructions(data.savedGlossaries[0].instructions);
          localStorage.setItem('customInstructions', data.savedGlossaries[0].instructions);
        }
        if (data.defaultGlossaryName) {
          setDefaultGlossaryName(data.defaultGlossaryName);
          localStorage.setItem('defaultGlossaryName', data.defaultGlossaryName);
        }
        if (data.smartGlossary !== undefined) {
          setSmartGlossary(data.smartGlossary);
          localStorage.setItem('smartGlossary', data.smartGlossary);
        }
        if (data.provider) {
          setProvider(data.provider);
          localStorage.setItem('translationProvider', data.provider);
        }
        if (data.geminiModel) {
          setGeminiModel(data.geminiModel);
          localStorage.setItem('geminiModel', data.geminiModel);
        }
        if (data.deepseekModel) {
          setDeepseekModel(data.deepseekModel);
          localStorage.setItem('deepseekModel', data.deepseekModel);
        }
        if (data.openaiModel) {
          setOpenaiModel(data.openaiModel);
          localStorage.setItem('openaiModel', data.openaiModel);
        }
        if (data.claudeModel) {
          setClaudeModel(data.claudeModel);
          localStorage.setItem('claudeModel', data.claudeModel);
        }
        if (data.concurrency) {
          setConcurrency(data.concurrency);
        }
        if (data.contextAware !== undefined) {
          setContextAware(data.contextAware);
          localStorage.setItem('contextAware', data.contextAware);
        }

        // Restore API Key Profiles (Robust Multi-Format Parsing)
        if (data.apiKeysByProvider && typeof data.apiKeysByProvider === 'object') {
          ['gemini', 'deepseek', 'openai', 'claude', 'deepl', 'libre'].forEach(prov => {
            const list = data.apiKeysByProvider[prov];
            if (Array.isArray(list) && list.length > 0) {
              restoredKeys[prov] = list.filter(k => k && (k.key || typeof k === 'string')).map((k, idx) => {
                if (typeof k === 'string') return { id: `${prov}-${Date.now()}-${idx}`, name: `${prov.toUpperCase()} Key ${idx + 1}`, key: k.trim() };
                return k;
              });
              restoredKeys[prov].forEach(k => {
                if (k.key && k.key.trim()) keyCount++;
              });
              if (restoredKeys[prov][0]?.key) {
                localStorage.setItem(`${prov}ApiKey`, restoredKeys[prov][0].key);
                if (prov === 'gemini') localStorage.setItem('apiKey', restoredKeys[prov][0].key);
              }
            }
          });
        }

        // Support Legacy Single Keys in backup
        const legacyMappings = {
          gemini: data.geminiApiKey || data.apiKey || '',
          deepseek: data.deepseekApiKey || '',
          openai: data.openaiApiKey || '',
          claude: data.claudeApiKey || '',
          deepl: data.deeplApiKey || ''
        };

        Object.entries(legacyMappings).forEach(([prov, lKey]) => {
          if (lKey && lKey.trim()) {
            localStorage.setItem(`${prov}ApiKey`, lKey);
            if (prov === 'gemini') localStorage.setItem('apiKey', lKey);
            if (!restoredKeys[prov] || restoredKeys[prov].length === 0) {
              const provNames = { gemini: 'Gemini', deepseek: 'DeepSeek', openai: 'OpenAI', claude: 'Claude', deepl: 'DeepL', libre: 'LibreTranslate' };
              restoredKeys[prov] = [{ id: `${prov}-init`, name: `Primary ${provNames[prov] || prov} Key`, key: lKey }];
              keyCount++;
            } else if (!restoredKeys[prov][0].key) {
              restoredKeys[prov][0].key = lKey;
              keyCount++;
            }
          }
        });

        if (Object.keys(restoredKeys).length > 0) {
          setApiKeysByProvider(prev => {
            const updated = { ...prev, ...restoredKeys };
            localStorage.setItem('apiKeysByProvider', JSON.stringify(updated));
            return updated;
          });
        }

        if (data.activeKeyIds && typeof data.activeKeyIds === 'object') {
          setActiveKeyIds(data.activeKeyIds);
          localStorage.setItem('activeKeyIds', JSON.stringify(data.activeKeyIds));
        }

        if (data.libreUrl) {
          setLibreUrl(data.libreUrl);
          localStorage.setItem('libreUrl', data.libreUrl);
        }

        const parts = [];
        if (keyCount > 0) parts.push(`${keyCount} API key(s)`);
        if (glossaryCount > 0) parts.push(`${glossaryCount} glossary profile(s)`);
        else if (data.terminology && data.terminology.trim()) parts.push('active glossary');
        parts.push('settings');
        toast(`✅ Restored ${parts.join(', ')} successfully!`);
      };

      const readFileContentAsText = (file) => {
        return new Promise((resolve, reject) => {
          if (file.text) {
            file.text().then(resolve).catch(() => {
              const reader = new FileReader();
              reader.onload = (evt) => resolve(evt.target.result);
              reader.onerror = (err) => reject(err);
              reader.readAsText(file);
            });
          } else {
            const reader = new FileReader();
            reader.onload = (evt) => resolve(evt.target.result);
            reader.onerror = (err) => reject(err);
            reader.readAsText(file);
          }
        });
      };

      const importFullBackup = async (e) => {
        const f = e.target?.files?.[0];
        if (!f) return;
        try {
          const txt = await readFileContentAsText(f);
          const data = JSON.parse(txt);
          applyRestoredData(data);
        } catch (err) {
          console.error("Backup import error:", err);
          setError('Failed to restore backup: ' + err.message);
          toast('Failed to restore backup: ' + err.message, 'error');
        }
        if (e.target) e.target.value = '';
      };

      const pasteAndRestoreBackup = async () => {
        try {
          let text = '';
          if (navigator.clipboard?.readText) {
            try { text = await navigator.clipboard.readText(); } catch (e) {}
          }
          const input = prompt('Paste your backup JSON content below:', text);
          if (!input || !input.trim()) return;
          const data = JSON.parse(input.trim());
          applyRestoredData(data);
        } catch (err) {
          setError('Failed to parse backup JSON: ' + err.message);
          toast('Failed to parse backup JSON: ' + err.message, 'error');
        }
      };

      // --- Modal ---
      const confirmAction = (msg, cb) => { setModalMessage(msg); setModalCallback(() => () => { cb(); setShowModal(false) }); setShowModal(true) };

      // --- History (IndexedDB Unlimited Storage + LocalStorage Fallback) ---
      const addToHistory = async (src, tgt, prov, input, output, stats = null) => {
        try {
          const entry = {
            id: genId(),
            ts: new Date().toISOString(),
            srcLang: src,
            tgtLang: tgt,
            provider: prov,
            inputPreview: (input || '').substring(0, 200),
            outputPreview: (output || '').substring(0, 200),
            fullInput: input || '',
            fullOutput: output || '',
            stats
          };
          
          // 1. Unlimited storage in IndexedDB
          await dbPut('history', entry);

          // 2. React state update
          setHistory(prev => [entry, ...(prev || [])]);

          // 3. Fallback sync to localStorage
          try {
            const lightList = [entry, ...(history || []).slice(0, 9)].map(h => ({
              ...h,
              fullInput: (h.fullInput && h.fullInput.length > 3000) ? (h.fullInput.substring(0, 3000) + '...[Full text in IndexedDB]') : h.fullInput,
              fullOutput: (h.fullOutput && h.fullOutput.length > 3000) ? (h.fullOutput.substring(0, 3000) + '...[Full text in IndexedDB]') : h.fullOutput
            }));
            localStorage.setItem('translationHistory', JSON.stringify(lightList));
          } catch (e) {}
        } catch (e) {

      };

      const loadFromHistory = async entry => {
        let fullIn = entry.fullInput;
        let fullOut = entry.fullOutput;
        if (!fullIn || !fullOut || fullIn.includes('[Full text in IndexedDB]')) {
          const all = await dbGetAll('history');

          if (found) {

        }
        setInputText(fullIn || '');
        setAssembledText(fullOut || '');
        setSrcLang(entry.srcLang || 'Auto-detect');

        toast('Loaded translation from history!');

      const clearHistory = () => {
        confirmAction('Clear all translation history?', async () => {
          await dbClear('history');
          setHistory([]);
          localStorage.setItem('translationHistory', '[]');
          toast('Translation history cleared.', 'info');

      const deleteHistoryItem = async (id) => {
        await dbDelete('history', id);
        const u = history.filter(h => h.id !== id);
        setHistory(u);
        try { localStorage.setItem('translationHistory', JSON.stringify(u.slice(0, 10))); } catch (e) {}
      };

      const exportHistoryJSON = async () => {
        let historyData = await dbGetAll('history');
        if (!historyData || historyData.length === 0) {
          historyData = (history && history.length > 0) ? history : (() => {
            try { return JSON.parse(localStorage.getItem('translationHistory') || '[]'); } catch (e) { return []; }
          })();
        }

        if (!historyData || historyData.length === 0) {
          return toast('No translation history to export.', 'warning');
        }

        const sorted = historyData.sort((a, b) => new Date(b.ts) - new Date(a.ts));
        const exportObj = {
          app: 'Gemini EPUB Translator',
          type: 'history_export',

        };

        const jsonStr = JSON.stringify(exportObj, null, 2);

      const exportSingleHistoryItem = (entry) => {

        const content = `====================================================\nGEMINI TRANSLATION HISTORY ENTRY\nProvider: ${entry.provider || 'AI'}\nLanguage: ${entry.srcLang || 'Auto'} -> ${entry.tgtLang}\nDate: ${new Date(entry.ts).toLocaleString()}\nTokens: ${entry.stats?.totalTokens?.toLocaleString() || 'N/A'}\nCost: ${entry.stats?.cost || 'N/A'}\n====================================================\n\n[INPUT TEXT]:\n${entry.fullInput || entry.inputPreview || ''}\n\n====================================================\n[TRANSLATED OUTPUT]:\n${entry.fullOutput || entry.outputPreview || ''}\n`;
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });

      // --- Translation ---
      const getTranslateOpts = (signal) => ({
        apiKey: provider === 'deepseek' ? deepseekKey : geminiKey,
        rotateApiKey,
        deepseekApiKey: deepseekKey,
        deeplApiKey: deeplKey,
        model: provider === 'deepseek'
          ? (useCustomDeepseekModel && customDeepseekModel ? customDeepseekModel : deepseekModel)
          : (useCustomModel && customModel ? customModel : geminiModel),
        srcLang,
        tgtLang,
        glossary: terminology,
        instructions: customInstructions,
        smartGlossary,
        enableThinking,
        signal,
        provider,
        libreUrl
      });

      // --- HTML DOM Node Extraction Helper ---
      // Extracts all non-empty text nodes from a DOM element (supporting all CJK, Latin, symbols)
      const extractTextNodes = (element) => {
        const nodes = [];
        if (!element) return nodes;
        const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
        let n;
        while (n = walk.nextNode()) {
          const parentTag = n.parentElement ? n.parentElement.tagName.toLowerCase() : '';
          if (parentTag === 'script' || parentTag === 'style' || parentTag === 'noscript') continue;
          if (n.nodeValue && n.nodeValue.trim().length > 0) {
            nodes.push(n);
          }
        }
        return nodes;
      };

      const handleTranslateText = async (resume = false) => {
        if (!inputText.trim()) return setError('Paste some text to translate.');
        let wakeLock = null;
        if (typeof navigator !== 'undefined' && 'wakeLock' in navigator) {
          try { navigator.wakeLock.request('screen').then(wl => { wakeLock = wl }).catch(() => {}); } catch(e) {}
        }
        const startTime = performance.now();
        setIsTranslating(true); setProgress(0); setProgressLabel(resume ? 'Resuming...' : 'Preparing...'); setError('');
        window.NativeBridge?.acquireWakeLock();
        window.NativeBridge?.showProgressNotification('Gemini Translator', resume ? 'Resuming translation...' : 'Starting text translation...', 0);
        if (!resume) { setAssembledText(''); setTranslatedChapters([]); }

        const ctrl = new AbortController(); abortRef.current = ctrl;
        const jobId = generateJobId(inputText);

        try {
          const opts = getTranslateOpts(ctrl.signal);
          const effectiveTerm = enableGlossary ? terminology : '';
          const chunks = splitChunks(inputText, effectiveTerm.length, smartGlossary);
          const isAIProvider = provider === 'gemini' || provider === 'deepseek';
          const useContext = contextAware && chunks.length > 1 && isAIProvider;

          let result = resume && activeSession ? activeSession.result : '';
          let ctx = resume && activeSession ? activeSession.ctx : '';
          let startIndex = resume && activeSession ? activeSession.completedCount : 0;
          let totalPromptTokens = 0;
          let totalOutputTokens = 0;
          let totalTokensUsed = 0;

          const saveState = (res, c, count) => {
            const state = { result: res, ctx: c, completedCount: count, total: chunks.length };
            localStorage.setItem(jobId, JSON.stringify(state));
            setActiveSession(state);
          };

          if (isAIProvider && enableStreaming) {
            for (let i = startIndex; i < chunks.length; i++) {
              setProgressLabel(`Streaming chunk ${i + 1}/${chunks.length}${useContext ? ' (with context)' : ''}...`);
              const pct = Math.round(((i + 1) / chunks.length) * 100);
              window.NativeBridge?.showProgressNotification('Gemini Translator', `Chunk ${i + 1}/${chunks.length} (${pct}%)`, pct);
              window.NativeBridge?.haptic('milestone');
              let chunkResult = '';
              const streamRes = await streamWithRotation(chunks[i], {
                ...opts,
                context: useContext ? ctx : undefined,
                onChunk: t => {
                  if (chunkResult === '' && result !== '' && !result.endsWith('\n')) {
                    result += '\n\n';
                  }
                  chunkResult += t;
                  result += t;
                  setAssembledText(result);
                }
              });
              if (useContext) { ctx = streamRes.newContext || ctx; }
              if (streamRes?.usage) {
                totalPromptTokens += streamRes.usage.promptTokens || 0;
                totalOutputTokens += streamRes.usage.outputTokens || 0;
                totalTokensUsed += streamRes.usage.totalTokens || 0;
              }
              setProgress(Math.floor(((i + 1) / chunks.length) * 100));
              saveState(result, ctx, i + 1);
            }
            setTranslatedChapters([{ title: 'Translated Document', content: result }]);
            localStorage.removeItem(jobId); setActiveSession(null);
          } else if (useContext) {
            for (let i = startIndex; i < chunks.length; i++) {
              setProgressLabel(`Translating chunk ${i + 1}/${chunks.length} (with context)...`);
              let translated = null;
              try {
                translated = await translateWithRotation(chunks[i], { ...opts, context: ctx });
              } catch (err) {
                if (err.name === 'AbortError' || opts?.signal?.aborted) throw err;
                const isFatalQuota = (err.message || '').includes('429') || (err.message || '').includes('quota') || (err.message || '').includes('billing');
                if (isFatalQuota) {
                  throw new Error(`API Quota exhausted across keys. If on free tier, switch model to Gemini 2.5 Flash. Progress saved at chunk ${i + 1}/${chunks.length}.`);
                }
                translated = { text: `\n\n[Error on chunk ${i + 1}: ${err.message}]\n\n` };
              }
              result += (result ? '\n' : '') + (translated.text || translated);
              ctx = translated.newContext || ctx;
              if (translated?.usage) {
                totalPromptTokens += translated.usage.promptTokens || 0;
                totalOutputTokens += translated.usage.outputTokens || 0;
                totalTokensUsed += translated.usage.totalTokens || 0;
              }
              setAssembledText(result.replace(/\r\n/g, '\n').trim());
              setProgress(Math.floor(((i + 1) / chunks.length) * 100));
              saveState(result, ctx, i + 1);
            }
            const final = result.replace(/\r\n/g, '\n').trim();
            setAssembledText(final); setTranslatedChapters([{ title: 'Translated Document', content: final }]);
            localStorage.removeItem(jobId); setActiveSession(null);
          } else {
            // Parallel batch translation (no context)
            setProgressLabel(`Translating ${chunks.length - startIndex} remaining chunk(s) with ${Math.min(concurrency, chunks.length - startIndex)} parallel...`);
            let completed = startIndex;
            const remainingChunks = chunks.slice(startIndex);
            const availableKeys = (apiKeysByProvider[provider] || []).filter(k => k.key && k.key.trim());
            const effectiveConcurrency = Math.max(concurrency, availableKeys.length > 1 ? availableKeys.length : 1);
            const results = await batchParallel(remainingChunks, async (chunk, idx, workerId = 0) => {
              const workerKey = availableKeys.length > 0 ? availableKeys[workerId % availableKeys.length].key : opts.apiKey;
              const workerOpts = { ...opts, apiKey: workerKey };
              const translated = await translateWithRotation(chunk, workerOpts);
              completed++; setProgress(Math.floor((completed / chunks.length) * 100));
              setProgressLabel(`Completed ${completed}/${chunks.length} chunks`);
              saveState(result + (result ? '\n' : '') + '[Partial Parallel Completion]', '', completed);
              return translated;
            }, effectiveConcurrency, opts.signal);

            results.forEach(r => {
              if (r?.usage) {
                totalPromptTokens += r.usage.promptTokens || 0;
                totalOutputTokens += r.usage.outputTokens || 0;
                totalTokensUsed += r.usage.totalTokens || 0;
              }
            });

            const translated = results.map(r => typeof r === 'string' ? r : (r?.text ? r.text : (r?.error ? `\n\n[Error: ${r.error}]\n\n` : '')));
            const combinedNew = translated.join('').replace(/\r\n/g, '\n').trim();
            result = result ? result + '\n\n' + combinedNew : combinedNew;

            setAssembledText(result); setTranslatedChapters([{ title: 'Translated Document', content: result }]);
            localStorage.removeItem(jobId); setActiveSession(null);
          }

          const elapsedMs = performance.now() - startTime;
          const durationStr = formatDuration(elapsedMs);
          const totalToks = totalTokensUsed || (totalPromptTokens + totalOutputTokens);
          const tokPerSec = elapsedMs > 0 && totalToks ? Math.round((totalToks / (elapsedMs / 1000))) : 0;

          const activeM = provider === 'deepseek'
            ? (useCustomDeepseekModel && customDeepseekModel ? customDeepseekModel : deepseekModel)
            : (useCustomModel && customModel ? customModel : geminiModel);
          const finalCost = calculateRealCost(totalPromptTokens, totalOutputTokens, activeM, provider);
          const stats = {
            promptTokens: totalPromptTokens,
            outputTokens: totalOutputTokens,

          const effectiveConcurrency = Math.max(concurrency, availableKeys.length > 1 ? availableKeys.length : 1);

          window.NativeBridge?.releaseWakeLock();

      const handleStartTranslation = async (resume = false) => {

      const cancelTranslation = () => {

      // --- File Handling ---
      const readFileAsText = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = e => rej(e.target.error); r.readAsText(f) });

      const processFile = async f => {

      const handleDownloadPDF = () => {

                        const isExtraA = /番外|extra|side\s*story|afterword|后记|附录/i.test(titleA);
                        const isExtraB = /番外|extra|side\s*story|afterword|后记|附录/i.test(titleB);
                        if (!isExtraA && isExtraB) return -1;
                        if (isExtraA && !isExtraB) return 1;
                        const matchA = titleA.match(/[\(（](\d+)[\)）]|(?:chapter|ch|第)\s*(\d+)/i) || titleA.match(/(\d+)/);
                        const matchB = titleB.match(/[\(（](\d+)[\)）]|(?:chapter|ch|第)\s*(\d+)/i) || titleB.match(/(\d+)/);
                        const numA = matchA ? parseInt(matchA[1] || matchA[2] || matchA[0], 10) : null;
                        const numB = matchB ? parseInt(matchB[1] || matchB[2] || matchB[0], 10) : null;
                        if (numA !== null && numB !== null) return numA - numB;
                        return 0;
                      });
                      setWebImportData({ ...webImportData, chapters: sorted });
                      toast('🔀 Smart Sorted: Main story in order, Extras at the end!', 'success');
                    },
                    className: 'px-2.5 py-1 bg-teal-50 dark:bg-teal-950/60 hover:bg-teal-100 dark:hover:bg-teal-900/60 text-teal-700 dark:text-teal-300 border border-teal-300 dark:border-teal-700 rounded-lg text-[11px] font-bold transition-all flex items-center gap-1 cursor-pointer',
                    title: 'Group chapters 1..N first and move Extras/Side Stories to the end'
                  }, ic(ArrowUpDown, 12), '🔀 Extras at End'),
                  btn({
                    onClick: () => {
                      if (!webImportData.rawChapters) {
                        webImportData.rawChapters = [...webImportData.chapters];
                      }
                      const reversed = [...webImportData.chapters].reverse();
                      setWebImportData({ ...webImportData, chapters: reversed });
                      toast('🔄 Inverted chapter order', 'info');
                    },
                    className: 'px-2 py-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-lg text-[11px] font-semibold transition-all cursor-pointer'
                  }, '🔄 Reverse')
                )
              ),
              h('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1' },
                webImportData.chapters.map((ch, idx) =>
                  h('div', { key: idx, className: 'p-2.5 bg-slate-50 dark:bg-slate-950 rounded-lg border border-slate-200/80 dark:border-slate-800/80 text-xs flex items-center justify-between gap-2 group hover:border-teal-500/40 transition-all' },
                    h('div', { className: 'min-w-0 flex-1' },
                      h('p', { className: 'font-semibold text-slate-800 dark:text-slate-200 truncate' }, `${idx + 1}. ${ch.title}`),
                      h('span', { className: 'text-[10px] text-slate-400 font-mono' }, `${(ch.text || '').length} chars`)
                    ),
                    h('div', { className: 'flex items-center gap-1 shrink-0' },
                      idx > 0 && btn({
                        onClick: () => {
                          const list = [...webImportData.chapters];
                          const temp = list[idx - 1];
                          list[idx - 1] = list[idx];
                          list[idx] = temp;
                          setWebImportData({ ...webImportData, chapters: list });
                        },
                        className: 'p-1 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 rounded transition-all cursor-pointer',
                        title: 'Move up'
                      }, ic(ChevronUp, 13)),
                      idx < webImportData.chapters.length - 1 && btn({
                        onClick: () => {
                          const list = [...webImportData.chapters];
                          const temp = list[idx + 1];
                          list[idx + 1] = list[idx];
                          list[idx] = temp;
                          setWebImportData({ ...webImportData, chapters: list });
                        },
                        className: 'p-1 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 rounded transition-all cursor-pointer',
                        title: 'Move down'
                      }, ic(ChevronDown, 13)),
                      btn({
                        onClick: () => {
                          const list = webImportData.chapters.filter((_, i) => i !== idx);
                          setWebImportData({ ...webImportData, chapters: list });
                          toast(`Removed "${ch.title}"`, 'info');
                        },
                        className: 'p-1 hover:bg-rose-100 dark:hover:bg-rose-950/60 text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 rounded transition-all cursor-pointer',
                        title: 'Remove chapter'
                      }, ic(X, 13))
                    )
                  )
                )
              )
            )
          )
        ),

        // TAB: HISTORY
        activeTab === 'history' && h('div', { className: 'space-y-4' },
          h('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 p-3.5 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm' },
            h('div', { className: 'flex items-center gap-2' },
              h('h2', { className: 'text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-200 flex items-center gap-2' }, ic(History, 20), 'Translation History'),
              h('span', { className: 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200/80 dark:border-indigo-800/60' }, `${history.length} items`)
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2' },
              btn({
                onClick: exportHistoryJSON,
                className: 'px-3.5 sm:px-4 py-2 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white text-xs font-bold rounded-xl shadow-sm hover:-translate-y-0.5 active:translate-y-0 transition-all inline-flex items-center gap-1.5 cursor-pointer',
                title: 'Export full history as a downloadable JSON file'
              }, ic(Download, 14), 'Export History (JSON)'),
              history.length > 0 && btn({
                onClick: clearHistory,
                className: 'px-3 py-2 bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/40 dark:hover:bg-rose-900/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/60 text-xs font-semibold rounded-xl transition-all inline-flex items-center gap-1 cursor-pointer'
              }, ic(Trash2, 14), 'Clear All')
            )
          ),
          history.length > 0 && h('div', { className: 'relative' },
            h('input', {
              type: 'text',
              value: historySearch,
              onChange: e => setHistorySearch(e.target.value),
              placeholder: 'Search history by keyword or language...',
              className: 'w-full p-2.5 pl-9 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500'
            }),
            h('span', { className: 'absolute left-3 top-1/2 -translate-y-1/2 text-gray-400' }, ic(Search, 15))
          ),
          history.length === 0 ? h('p', { className: 'text-gray-500 dark:text-gray-400 text-center py-8 bg-white dark:bg-slate-900/50 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800' }, 'No translation history yet. Translate your first chapter to see it saved here!') :
            (() => {
              const filtered = history.filter(h => {
                if (!historySearch.trim()) return true;
                const q = historySearch.toLowerCase();
                return (h.inputPreview && h.inputPreview.toLowerCase().includes(q)) ||
                  (h.outputPreview && h.outputPreview.toLowerCase().includes(q)) ||
                  (h.provider && h.provider.toLowerCase().includes(q)) ||
                  (h.tgtLang && h.tgtLang.toLowerCase().includes(q));
              });

              if (filtered.length === 0) {
                return h('p', { className: 'text-gray-400 text-center py-6 text-sm' }, `No history matches "${historySearch}".`);
              }

              return h('div', { className: 'space-y-3' }, filtered.map(entry =>
                h('div', { key: entry.id, className: 'p-4 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800' },
                  h('div', { className: 'flex flex-wrap items-center justify-between gap-2 mb-2' },
                    h('div', { className: 'flex flex-wrap items-center gap-2 text-xs text-gray-500' },
                      h('span', { className: 'font-semibold text-indigo-600 dark:text-indigo-400' }, entry.provider),
                      h('span', null, '·'),
                      h('span', null, `${entry.srcLang || 'Auto'} → ${entry.tgtLang}`),
                      entry.stats && h('span', { className: 'inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50' },
                        ic(Sparkles, 11),
                        `${entry.stats.totalTokens.toLocaleString()} tok · ${entry.stats.cost}${entry.stats.duration ? ' · ' + entry.stats.duration : ''}`
                      ),
                      h('span', null, '·'),
                      h('span', null, new Date(entry.ts).toLocaleString())
                    ),
                    h('div', { className: 'flex flex-wrap items-center gap-1.5' },
                      btn({ onClick: () => loadFromHistory(entry), className: 'px-2.5 py-1 text-xs bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-500 transition-all cursor-pointer inline-flex items-center gap-1' }, ic(Upload, 12), 'Load'),
                      btn({ onClick: () => { if (entry.fullOutput || entry.outputPreview) copyText(entry.fullOutput || entry.outputPreview).then(() => toast('Copied translation!')); }, className: 'px-2.5 py-1 text-xs bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 font-semibold rounded-md hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer inline-flex items-center gap-1', title: 'Copy translation output' }, ic(Copy, 12), 'Copy'),
                      btn({ onClick: () => exportSingleHistoryItem(entry), className: 'px-2.5 py-1 text-xs bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 border border-teal-200 dark:border-teal-800/60 font-semibold rounded-md hover:bg-teal-100 dark:hover:bg-teal-900/60 transition-all cursor-pointer inline-flex items-center gap-1', title: 'Export this translation as .txt file' }, ic(Download, 12), 'TXT'),
                      btn({ onClick: () => deleteHistoryItem(entry.id), className: 'px-2.5 py-1 text-xs bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/60 rounded-md hover:bg-rose-100 dark:hover:bg-rose-900/60 transition-all cursor-pointer' }, 'Del')
                    )
                  ),
                  h('p', { className: 'text-sm text-gray-600 dark:text-gray-400 line-clamp-2' }, entry.outputPreview || entry.inputPreview)
                )
              ));
            })()
        ),

        // TAB: EPUB STUDIO (SPLIT & MERGE)
        activeTab === 'studio' && h('div', { className: 'space-y-6 max-w-full overflow-hidden' },
          h('div', { className: 'p-4 sm:p-6 bg-white dark:bg-slate-900 sm:backdrop-blur-md rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm max-w-full overflow-hidden' },
            h('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-200/80 dark:border-slate-800/80' },
              h('div', null,
                h('h2', { className: 'text-xl sm:text-2xl font-black bg-gradient-to-r from-indigo-500 via-purple-500 to-fuchsia-500 bg-clip-text text-transparent flex items-center gap-2.5' },
                  ic(Layers, 24),
                  'EPUB Studio'
                ),
                h('p', { className: 'text-xs text-slate-500 dark:text-slate-400 mt-1' },
                  'Split massive eBooks into lightweight volumes or merge multi-part translations into a single seamless EPUB.'
                )
              ),
              // Sub-tab switcher pills
              h('div', { className: 'inline-flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-inner w-full sm:w-auto shrink-0' },
                h('button', {
                  type: 'button',
                  onClick: () => { setStudioSubTab('split'); localStorage.setItem('studioSubTab', 'split'); },
                  className: `flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 sm:px-5 py-2 rounded-lg text-xs font-bold transition-all cursor-pointer ${studioSubTab === 'split' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`
                }, ic(Scissors, 14), 'Split EPUB'),
                h('button', {
                  type: 'button',
                  onClick: () => { setStudioSubTab('merge'); localStorage.setItem('studioSubTab', 'merge'); },
                  className: `flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 sm:px-5 py-2 rounded-lg text-xs font-bold transition-all cursor-pointer ${studioSubTab === 'merge' ? 'bg-fuchsia-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`
                }, ic(Rows2, 14), 'Merge EPUB')
              )
            ),

            // Subtab views
            studioSubTab === 'split' ?
              h('div', { dangerouslySetInnerHTML: { __html: window.splitHtml || (typeof splitHtml !== 'undefined' ? splitHtml : '') } }) :
              h('div', { dangerouslySetInnerHTML: { __html: window.mergeHtml || (typeof mergeHtml !== 'undefined' ? mergeHtml : '') } })
          )
        ),

        // Error display
        error && h('div', { className: 'flex items-center justify-between p-4 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 rounded-r-lg', 'role': 'alert' },
          h('p', { className: 'text-sm font-medium text-red-700 dark:text-red-400' }, error),
          btn({ onClick: () => setError(''), className: 'text-red-500 hover:text-red-700 cursor-pointer', 'aria-label': 'Dismiss error' }, ic(X, 18))
        )
      ),

        // TOASTS
        h('div', { className: 'fixed bottom-4 right-4 z-50 space-y-2', role: 'status', 'aria-live': 'polite' },
          toasts.map(t => h('div', { key: t.id, className: `toast-enter flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium ${t.type === 'error' ? 'bg-red-600 text-white' : t.type === 'info' ? 'bg-blue-600 text-white' : 'bg-green-600 text-white'}` },
            ic(t.type === 'error' ? AlertCircle : t.type === 'info' ? Info : CheckCircle2, 16), t.msg
          ))
        ),

        // MODAL
        showModal && h('div', { className: 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4', role: 'dialog', 'aria-modal': 'true' },
          h('div', { className: 'bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 max-w-sm w-full space-y-4' },
            h('p', { className: 'text-lg font-semibold text-center' }, modalMessage),
            h('div', { className: 'flex justify-center gap-3' },
              btn({ onClick: () => { if (modalCallback) modalCallback() }, className: 'px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold cursor-pointer' }, 'Confirm'),
              btn({ onClick: () => { setShowModal(false); setModalCallback(null) }, className: 'px-6 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 font-semibold cursor-pointer' }, 'Cancel')
            )
          )
        ),

        
        // ── DOWNLOAD SUCCESS ACTION MODAL ──
        downloadSuccessModal && h('div', {
          className: 'fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4',
          onClick: () => setDownloadSuccessModal(null)
        },
          h('div', {
            className: 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4 animate-in zoom-in-95 duration-200 text-center',
            onClick: (e) => e.stopPropagation()
          },
            h('div', { className: 'w-14 h-14 bg-teal-50 dark:bg-teal-950/60 border border-teal-200 dark:border-teal-800/60 rounded-2xl flex items-center justify-center mx-auto text-teal-600 dark:text-teal-400' },
              ic(FileDown, 28)
            ),
            h('div', { className: 'space-y-1' },
              h('h3', { className: 'text-base font-bold text-slate-900 dark:text-white' }, 'File Saved Successfully! ✨'),
              h('p', { className: 'text-xs text-slate-600 dark:text-slate-400 break-all font-semibold' }, downloadSuccessModal.fileName),
              h('div', { className: 'p-2.5 bg-slate-100 dark:bg-slate-800/70 rounded-xl text-[11px] text-slate-500 dark:text-slate-400 font-mono text-left' },
                h('p', null, '📁 Folder: Download/GeminiTranslator/'),
                h('p', { className: 'opacity-70 text-[10px] truncate' }, '📍 Path: ' + (downloadSuccessModal.path || 'Internal Storage/Download/GeminiTranslator'))
              )
            ),
            h('div', { className: 'space-y-2 pt-2' },
              h('button', {
                onClick: () => {
                  window.NativeBridge?.openWithReader(downloadSuccessModal.fileName, downloadSuccessModal.path);
                  setDownloadSuccessModal(null);
                },
                className: 'w-full py-3 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white text-xs font-bold rounded-xl shadow-lg shadow-teal-500/20 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer'
              }, ic(BookOpen, 16), 'Open in Moon+ Reader / ReadEra'),
              h('button', {
                onClick: () => setDownloadSuccessModal(null),
                className: 'w-full py-2.5 border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition-all cursor-pointer'
              }, 'Done')
            )
          )
        ),

        // READER VIEW MODAL
        h(MoonReaderModal, {
          open: readerOpen,
          onClose: () => setReaderOpen(false),
          text: assembledText,
          chapters: (translatedChapters && translatedChapters.length > 0 ? translatedChapters : chapters),
          currentIdx: readerChapterIdx,
          onChapterChange: setReaderChapterIdx,
          theme: readerTheme,
          setTheme: setReaderTheme,
          font: readerFont,
          setFont: setReaderFont,
          fontSize: readerFontSize,
          setFontSize: setReaderFontSize,
          tgtLang
        }),

        // EPUB STUDIO PREVIEW MODAL
        h('div', { dangerouslySetInnerHTML: { __html: modalHtml } }),

        // FOOTER
        h('footer', { className: 'text-center text-xs text-slate-400 dark:text-slate-600 py-4' }, 'Gemini Translator v', VERSION, ' · Powered by Gemini, DeepSeek, DeepL & LibreTranslate')
      )
    }

    const root = document.getElementById('root');
    if (root) ReactDOM.createRoot(root).render(h(ErrorBoundary, null, h(App)));
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      if (window.Capacitor || window.NativeAndroidBridge) {
        // In native Android app, unregister service worker to prevent stale caching
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (const reg of regs) reg.unregister();
        });
      } else if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            registration.update();
            console.log('ServiceWorker registration active: ', registration.scope);
          }).catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    }
  </script>
</body>
