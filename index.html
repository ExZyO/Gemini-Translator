  <script>
    // Automatic cache purger & Service Worker unregisterer
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) {
            caches.delete(k);
          });
        });
      }
    })();
  </script>

  <script>
    const { useState, useEffect, useRef, useCallback } = React;
    const h = React.createElement;
    window.studioSubTab = 'split';

    // Bulletproof Lucide Icon Component Factory (Dynamic UMD Adapter)
    const createLucideIcon = (name) => {
      return function IconComponent(props) {
        const size = (props && props.size) || 18;
        const className = (props && props.className) || '';
        const nameKebab = String(name || '').replace(/([A-Z])/g, '-$1').toLowerCase().replace(/^-/, '');
        const nameLower = String(name || '').toLowerCase();
        const iconDef = (window.LUCIDE_ICONS && (
          window.LUCIDE_ICONS[name] ||
          window.LUCIDE_ICONS[nameLower] ||
          window.LUCIDE_ICONS[nameKebab]
        )) || (window.lucide && (
          window.lucide[name] ||
          window.lucide[nameLower] ||
          window.lucide[nameKebab] ||
          (window.lucide.icons && (
            window.lucide.icons[name] ||
            window.lucide.icons[nameLower] ||
            window.lucide.icons[nameKebab]
          ))
        )) || [];
        return h('svg', {
          xmlns: 'http://www.w3.org/2000/svg',
          width: size,
          height: size,
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          strokeWidth: '2',
          strokeLinecap: 'round',
          strokeLinejoin: 'round',
          className
        },
          iconDef.map((el, i) => h(el[0], { key: i, ...el[1] }))
        );
      };
    };

    const LucideIcons = new Proxy({}, {
      get: (target, prop) => {
        if (!target[prop]) target[prop] = createLucideIcon(prop);
        return target[prop];
      }
    });

    const iconNamesList = [
      'Download', 'Clipboard', 'Link', 'BookText', 'FileText', 'XCircle', 'Copy',
      'Loader2', 'Eye', 'EyeOff', 'RefreshCcw', 'Save', 'Upload', 'Sun', 'Moon',
      'Columns2', 'Rows2', 'History', 'ChevronDown', 'ChevronUp', 'Zap', 'X',
      'CheckCircle2', 'AlertCircle', 'Info', 'Search', 'Trash2', 'RotateCcw',
      'Square', 'FileDown', 'Settings', 'Globe', 'Sparkles', 'Brain', 'Languages',
      'Check', 'ArrowRightLeft', 'Star', 'Clock', 'Layers', 'Scissors', 'Sliders',
      'Plus', 'Minus', 'Maximize2', 'Minimize2', 'BookOpen', 'Key', 'Shield', 'Lock', 'Unlock'
    ];
    iconNamesList.forEach(name => {
      window[name] = LucideIcons[name];
    });

    const { Download, Clipboard, Link, BookText, FileText, XCircle, Copy, Loader2, Eye, EyeOff, RefreshCcw, Save, Upload, Sun, Moon, Columns2, Rows2, History, ChevronDown, ChevronUp, Zap, X, CheckCircle2, AlertCircle, Info, Search, Trash2, RotateCcw, Square, FileDown, Settings, Globe, Sparkles, Brain, Languages, Check, ArrowRightLeft, Star, Clock, Layers, Scissors, Sliders, Plus, Minus, Maximize2, Minimize2, BookOpen, Key, Shield, Lock, Unlock } = LucideIcons;
    const ic = (Icon, size = 18, className = 'shrink-0') => {
      const comp = typeof Icon === 'string' ? (LucideIcons[Icon] || createLucideIcon(Icon)) : Icon;
      return h(comp || 'span', { size, className });
    };
    const btn = (props, ...ch) => h('button', props, ...ch);
    const splitHtml = window.splitHtml || '';
    const mergeHtml = window.mergeHtml || '';
    const modalHtml = window.modalHtml || '';

    // ═══════════════════════════════════════
    // CONSTANTS
    // ═══════════════════════════════════════
    const VERSION = '5.2.7';
    const MAX_PAYLOAD = 4500;
    const PROMPT_OVERHEAD = 800;
    const MAX_HISTORY = 20;
    const DEFAULT_CONCURRENCY = 3;
    const LANGUAGES = ['Auto-detect', 'English', 'Spanish', 'French', 'German', 'Italian', 'Portuguese', 'Chinese (Simplified)', 'Chinese (Traditional)', 'Japanese', 'Korean', 'Russian', 'Arabic', 'Hindi', 'Bengali', 'Urdu', 'Vietnamese', 'Turkish', 'Polish', 'Dutch', 'Swedish', 'Norwegian', 'Danish', 'Finnish', 'Greek', 'Hebrew', 'Thai', 'Indonesian', 'Malay', 'Filipino', 'Romanian', 'Hungarian', 'Czech', 'Slovak', 'Bulgarian', 'Serbian', 'Croatian', 'Ukrainian', 'Lithuanian', 'Latvian', 'Estonian', 'Slovenian', 'Catalan', 'Basque', 'Galician'];
    const TARGET_LANGUAGES = LANGUAGES.filter(l => l !== 'Auto-detect');

    const DEEPL_LANG_MAP = { 'English': 'EN', 'Spanish': 'ES', 'French': 'FR', 'German': 'DE', 'Italian': 'IT', 'Portuguese': 'PT', 'Chinese (Simplified)': 'ZH', 'Chinese (Traditional)': 'ZH', 'Japanese': 'JA', 'Korean': 'KO', 'Russian': 'RU', 'Arabic': 'AR', 'Hindi': 'HI', 'Vietnamese': 'VI', 'Turkish': 'TR', 'Polish': 'PL', 'Dutch': 'NL', 'Swedish': 'SV', 'Norwegian': 'NB', 'Danish': 'DA', 'Finnish': 'FI', 'Greek': 'EL', 'Hebrew': 'HE', 'Indonesian': 'ID', 'Romanian': 'RO', 'Hungarian': 'HU', 'Czech': 'CS', 'Slovak': 'SK', 'Bulgarian': 'BG', 'Serbian': 'SR', 'Croatian': 'HR', 'Ukrainian': 'UK', 'Lithuanian': 'LT', 'Latvian': 'LV', 'Estonian': 'ET', 'Slovenian': 'SL' };
    const LIBRE_LANG_MAP = { 'English': 'en', 'Spanish': 'es', 'French': 'fr', 'German': 'de', 'Italian': 'it', 'Portuguese': 'pt', 'Chinese (Simplified)': 'zh', 'Chinese (Traditional)': 'zt', 'Japanese': 'ja', 'Korean': 'ko', 'Russian': 'ru', 'Arabic': 'ar', 'Hindi': 'hi', 'Vietnamese': 'vi', 'Turkish': 'tr', 'Polish': 'pl', 'Dutch': 'nl', 'Swedish': 'sv', 'Norwegian': 'nb', 'Danish': 'da', 'Finnish': 'fi', 'Greek': 'el', 'Hebrew': 'he', 'Indonesian': 'id', 'Filipino': 'tl', 'Romanian': 'ro', 'Hungarian': 'hu', 'Czech': 'cs', 'Slovak': 'sk', 'Bulgarian': 'bg', 'Serbian': 'sr', 'Croatian': 'hr', 'Ukrainian': 'uk' };
    const DEFAULT_GEMINI_MODELS = [
      { id: 'gemini-3.6-flash', name: 'Gemini 3.6 Flash (Official 2026 Recommended)' },
      { id: 'gemini-1.5-flash', name: 'Gemini 1.5 Flash (Highest Free Quota & Ultra Fast)' },
      { id: 'gemini-2.0-flash', name: 'Gemini 2.0 Flash (Fast & Stable)' },
      { id: 'gemini-3.7-flash', name: 'Gemini 3.7 Flash (Hybrid Reasoning)' },
      { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash' },
      { id: 'gemini-3.5-flash-lite', name: 'Gemini 3.5 Flash-Lite' },
      { id: 'gemini-3.1-pro', name: 'Gemini 3.1 Pro' },
      { id: 'gemini-2.5-pro', name: 'Gemini 2.5 Pro (Deep Literary Quality)' }
    ];

    const DEFAULT_DEEPSEEK_MODELS = [
      { id: 'deepseek-chat', name: 'DeepSeek V3 / V4 Chat (Ultra Fast & Cheap)' },
      { id: 'deepseek-reasoner', name: 'DeepSeek R1 / V4 Pro (Deep Reasoning)' }
    ];

    const estimateTokens = (text) => {
      if (!text) return 0;
      const cjkMatch = text.match(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g) || [];
      const nonCjk = text.replace(/[\u4e00-\u9fa5\u3040-\u30ff\uac00-\ud7af]/g, '');
      const words = nonCjk.trim().split(/\s+/).filter(Boolean);
      return Math.ceil(cjkMatch.length * 1.2 + words.length * 1.3);
    };

    const estimateCost = (tokens, modelId = 'gemini-3.7-flash', provider = 'gemini') => {
      let perMillion = 0.075;
      if (provider === 'deepseek') {
        if (modelId === 'deepseek-reasoner') perMillion = 0.55;
        else perMillion = 0.14;
      } else {
        if (modelId.includes('3.1-pro') || modelId.includes('pro')) perMillion = 1.25;
        else if (modelId.includes('flash-lite') || modelId.includes('8b')) perMillion = 0.0375;
        else if (modelId.includes('3.7-flash') || modelId.includes('3.6-flash') || modelId.includes('3.5-flash') || modelId.includes('3-flash')) perMillion = 0.075;
      }
      return ((tokens / 1000000) * perMillion).toFixed(4);
    };

    const calculateRealCost = (promptTokens, outputTokens, modelId = 'gemini-3.7-flash', provider = 'gemini') => {
      let inPerM = 0.075;
      let outPerM = 0.30;
      if (provider === 'deepseek') {
        if (modelId === 'deepseek-reasoner') {
          inPerM = 0.55;
          outPerM = 2.19;
        } else {
          inPerM = 0.14;
          outPerM = 0.28;
        }
      } else {
        if (modelId.includes('3.1-pro') || modelId.includes('pro')) {
          inPerM = 1.25;
          outPerM = 5.00;
        } else if (modelId.includes('flash-lite') || modelId.includes('8b')) {
          inPerM = 0.0375;
          outPerM = 0.15;
        } else {
          inPerM = 0.075;
          outPerM = 0.30;
        }
      }
      const cost = ((promptTokens / 1000000) * inPerM) + ((outputTokens / 1000000) * outPerM);
      return cost < 0.0001 && cost > 0 ? '$0.0001' : `$${cost.toFixed(4)}`;
    };

    // ═══════════════════════════════════════
    // INDEXEDDB ENGINE (High-Capacity Storage)
    // ═══════════════════════════════════════
    const DB_NAME = 'GeminiTranslatorDB';
    const DB_VERSION = 1;

    const openAppDB = () => {
      return new Promise((resolve) => {
        if (!window.indexedDB) return resolve(null);
        try {
          const req = window.indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('history')) {
              db.createObjectStore('history', { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains('glossaries')) {
              db.createObjectStore('glossaries', { keyPath: 'name' });
            }
            if (!db.objectStoreNames.contains('kv')) {
              db.createObjectStore('kv', { keyPath: 'key' });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    };

    const dbGetAll = async (storeName) => {
      const db = await openAppDB();
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    };

    const dbPut = async (storeName, value) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(value);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    const dbDelete = async (storeName, key) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    const dbClear = async (storeName) => {
      const db = await openAppDB();
      if (!db) return false;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.clear();
          req.onsuccess = () => resolve(true);
          req.onerror = () => resolve(false);
        } catch (e) {
          resolve(false);
        }
      });
    };

    // ═══════════════════════════════════════
    // BACKGROUND WEB WORKER BRIDGE (Zero UI Stutter)
    // ═══════════════════════════════════════
    let appWorker = null;
    let workerMsgId = 0;
    const workerCallbacks = new Map();

    const initAppWorker = () => {
      try {
        if (typeof window !== 'undefined' && window.Worker && !appWorker) {
          appWorker = new Worker('./worker.js');
          appWorker.onmessage = (e) => {
            const { id, success, error, ...rest } = e.data || {};
            if (workerCallbacks.has(id)) {
              const { resolve, reject } = workerCallbacks.get(id);
              workerCallbacks.delete(id);
              if (success) resolve(rest);
              else reject(new Error(error || 'Worker operation failed'));
            }
          };
          appWorker.onerror = (err) => {
            console.warn('Worker error:', err);
          };
        }
      } catch (e) {
        console.warn('Web Worker not available, falling back seamlessly to main thread:', e);
      }
    };

    const callWorker = (type, payload) => {
      return new Promise((resolve, reject) => {
        try {
          if (!appWorker) initAppWorker();
          if (!appWorker) return resolve(null);
          const id = ++workerMsgId;
          workerCallbacks.set(id, { resolve, reject });
          appWorker.postMessage({ id, type, payload });
        } catch (e) {
          resolve(null);
        }
      });
    };

    const formatDuration = (ms) => {
      if (!ms || ms <= 0) return '0.0s';
      const totalSec = ms / 1000;
      if (totalSec < 1) {
        return `${totalSec.toFixed(2)}s`;
      }
      if (totalSec < 60) {
        return `${totalSec.toFixed(1)}s`;
      }
      const totalMin = Math.floor(totalSec / 60);
      const remSec = Math.floor(totalSec % 60);
      if (totalMin < 60) {
        return `${totalMin}m ${remSec}s`;
      }
      const totalHours = Math.floor(totalMin / 60);
      const remMin = totalMin % 60;
      if (totalHours < 24) {
        return `${totalHours}h ${remMin}m ${remSec}s`;
      }
      const days = Math.floor(totalHours / 24);
      const remHours = totalHours % 24;
      return `${days}d ${remHours}h ${remMin}m`;
    };

    // ═══════════════════════════════════════
    // UTILITY FUNCTIONS
    // ═══════════════════════════════════════
    const fetchRetry = async (url, opts, retries = 3, timeoutMs = 45000) => {
      let delay = 1500;
      for (let i = 0; i < retries; i++) {
        if (opts?.signal?.aborted) {
          const err = new Error('Translation paused.');
          err.name = 'AbortError';
          throw err;
        }

        const attemptController = new AbortController();
        let timeoutId = setTimeout(() => {
          attemptController.abort(new Error('Request timed out (45s).'));
        }, timeoutMs);

        const onParentAbort = () => {
          clearTimeout(timeoutId);
          attemptController.abort(opts.signal?.reason || new Error('Translation paused.'));
        };

        if (opts?.signal) {
          opts.signal.addEventListener('abort', onParentAbort, { once: true });
        }

        try {
          const fetchOpts = { ...opts, signal: attemptController.signal };
          const r = await fetch(url, fetchOpts);
          clearTimeout(timeoutId);
          if (opts?.signal) opts.signal.removeEventListener('abort', onParentAbort);

          if (r.status === 429) {
            const errText = await r.text().catch(() => '');
            const err = new Error(`Rate limit (429): ${errText.substring(0, 150)}`);
            err.status = 429;
            throw err;
          }
          if (r.status >= 500 && i < retries - 1) {
            if (opts?.signal?.aborted) {
              const err = new Error('Translation paused.');
              err.name = 'AbortError';
              throw err;
            }
            const msg = r.status === 503
              ? `Google server high demand (503). Retrying in ${(delay / 1000).toFixed(1)}s... (${i + 1}/${retries})`
              : `API Error ${r.status}. Retrying in ${(delay / 1000).toFixed(1)}s... (${i + 1}/${retries})`;
            console.warn(msg);
            
            await new Promise((resolve, reject) => {
              const timer = setTimeout(resolve, delay);
              if (opts?.signal) {
                const onAbort = () => {
                  clearTimeout(timer);
                  const err = new Error('Translation paused.');
                  err.name = 'AbortError';
                  reject(err);
                };
                opts.signal.addEventListener('abort', onAbort, { once: true });
              }
            });
            delay *= 1.5;
            continue;
          }
          return r;
        } catch (e) {
          clearTimeout(timeoutId);
          if (opts?.signal) opts.signal.removeEventListener('abort', onParentAbort);

          if (opts?.signal?.aborted || (e.name === 'AbortError' && opts?.signal?.aborted)) {
            const err = new Error('Translation paused.');
            err.name = 'AbortError';
            throw err;
          }

          if (e.status === 429 || (e.message || '').includes('429')) {
            throw e;
          }

          if (i === retries - 1) throw e;
          const msg = e.message?.includes('timed out')
            ? `Request timed out. Retrying in ${(delay / 1000).toFixed(1)}s... (${i + 1}/${retries})`
            : `Connection busy. Retrying in ${(delay / 1000).toFixed(1)}s... (${i + 1}/${retries})`;
          console.warn(msg);
          
          await new Promise((resolve, reject) => {
            const timer = setTimeout(resolve, delay);
            if (opts?.signal) {
              const onAbort = () => {
                clearTimeout(timer);
                const err = new Error('Translation paused.');
                err.name = 'AbortError';

    const streamDeepSeek = async (text, { apiKey, deepseekApiKey, model = 'deepseek-chat', srcLang, tgtLang, glossary, instructions, signal, onChunk, context, smartGlossary = true, enableThinking = false }) => {
      const key = deepseekApiKey || apiKey;
      if (!key) throw new Error('DeepSeek API key required.');
      const chosenModel = enableThinking && model === 'deepseek-chat' ? 'deepseek-reasoner' : (model || 'deepseek-chat');
      const prompt = buildPrompt(text, srcLang, tgtLang, glossary, instructions, context, smartGlossary);
      const r = await fetchRetry('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${key}`
        },
        body: JSON.stringify({
          model: chosenModel,
          messages: [
            { role: 'system', content: 'You are an expert literary translator. Follow all glossary terms and tone instructions accurately. Output only the translated text.' },
            { role: 'user', content: prompt }
          ],
          stream: true,
          stream_options: { include_usage: true }
        }),
        signal
      });
      if (!r || !r.ok) {
        const b = await r?.text().catch(() => '') || '';
        throw new Error(`DeepSeek stream error ${r?.status || 'network'}: ${b.substring(0, 200)}`);
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let isContextContext = false;
      let finalContext = '';
      let slidingWindow = '';
      let accumulatedOutput = '';
      let lastUsage = null;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed.startsWith('data: ')) {
            const dataStr = trimmed.slice(6).trim();
            if (dataStr === '[DONE]') break;
            try {
              const j = JSON.parse(dataStr);
              if (j?.usage) lastUsage = j.usage;
              const t = j.choices?.[0]?.delta?.content;
              if (t) {
                if (context !== undefined) {
                  if (isContextContext) {
                    finalContext += t;
                  } else {
                    slidingWindow += t;
                    const splitMatch = slidingWindow.match(/\n*---CONTEXT_UPDATE---\n*/i);
                    if (splitMatch) {
                      const idx = splitMatch.index;
                      const textPart = slidingWindow.substring(0, idx);
                      if (textPart) { onChunk(textPart); accumulatedOutput += textPart; }
                      finalContext += slidingWindow.substring(idx + splitMatch[0].length);
                      isContextContext = true;
                      slidingWindow = '';
                    } else {
                      if (slidingWindow.length > 40) {
                        const safeToEmit = slidingWindow.substring(0, slidingWindow.length - 40);
                        onChunk(safeToEmit);
                        accumulatedOutput += safeToEmit;
                        slidingWindow = slidingWindow.substring(slidingWindow.length - 40);
                      }
                    }
                  }
                } else {
                  onChunk(t);
                  accumulatedOutput += t;
                }
              }
            } catch (e) { }
          }
        }
      }
      if (slidingWindow && !isContextContext) { onChunk(slidingWindow); accumulatedOutput += slidingWindow; }
      const pTok = lastUsage?.prompt_tokens || estimateTokens(prompt);
      const oTok = lastUsage?.completion_tokens || estimateTokens(accumulatedOutput);
      return { text: accumulatedOutput, newContext: finalContext.trim() || context || '', usage: { promptTokens: pTok, outputTokens: oTok, totalTokens: lastUsage?.total_tokens || (pTok + oTok) } };
    };

    const translateDeepL = async (text, { apiKey, srcLang, tgtLang, signal }) => {
      if (!apiKey) throw new Error('DeepL API key required.');
      const tgt = DEEPL_LANG_MAP[tgtLang]; if (!tgt) throw new Error(`DeepL doesn't support ${tgtLang}.`);
      const src = srcLang && srcLang !== 'Auto-detect' ? DEEPL_LANG_MAP[srcLang] : undefined;
      const params = new URLSearchParams({ text, target_lang: tgt });
      if (src) params.append('source_lang', src);
      const base = apiKey.endsWith(':fx') ? 'https://api-free.deepl.com' : 'https://api.deepl.com';
      const r = await fetchRetry(`${base}/v2/translate`, { method: 'POST', headers: { 'Authorization': `DeepL-Auth-Key ${apiKey}`, 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString(), signal });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`DeepL error ${r.status}: ${b.substring(0, 200)}`); }
      const j = await r.json();
      const resText = j.translations?.[0]?.text || '';
      return { text: resText, usage: { promptTokens: estimateTokens(text), outputTokens: estimateTokens(resText), totalTokens: estimateTokens(text) + estimateTokens(resText) } };
    };

    const translateLibre = async (text, { srcLang, tgtLang, signal, libreUrl }) => {
      const tgt = LIBRE_LANG_MAP[tgtLang]; if (!tgt) throw new Error(`LibreTranslate doesn't support ${tgtLang}.`);
      const src = srcLang && srcLang !== 'Auto-detect' ? (LIBRE_LANG_MAP[srcLang] || 'auto') : 'auto';
      const url = libreUrl || 'https://libretranslate.com';
      const r = await fetchRetry(`${url}/translate`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q: text, source: src, target: tgt, format: 'text' }), signal });
      if (!r.ok) { const b = await r.text().catch(() => ''); throw new Error(`LibreTranslate error ${r.status}: ${b.substring(0, 200)}`); }
      const j = await r.json();
      const resText = j.translatedText || '';
      return { text: resText, usage: { promptTokens: estimateTokens(text), outputTokens: estimateTokens(resText), totalTokens: estimateTokens(text) + estimateTokens(resText) } };
    };

    const translateWithRotation = async (text, opts) => {
      let currentOpts = { ...opts };
      const rotateFn = opts?.rotateApiKey || (typeof window !== 'undefined' ? window.rotateApiKey : null);
      const maxAttempts = 10;
      let backoffDelay = 2000;
      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        try {
          const res = await translateChunk(text, currentOpts);
          if (res) return res;
          throw new Error('Empty response from translation provider');
        } catch (err) {
          if (err.name === 'AbortError' || opts?.signal?.aborted) throw err;
          const errMsg = (err.message || '').toLowerCase();
          const isRateLimit = errMsg.includes('429') || errMsg.includes('rate') || errMsg.includes('quota') || errMsg.includes('resource_exhausted') || errMsg.includes('503') || errMsg.includes('demand');
          if (isRateLimit) {
            if (typeof rotateFn === 'function') {
              const nextKey = rotateFn();
              if (nextKey && nextKey !== currentOpts.apiKey) {
                console.warn(`Rate limit encountered → Rotated to next key (attempt ${attempt + 1}/${maxAttempts})`);
                currentOpts.apiKey = nextKey;
                await new Promise(r => setTimeout(r, 600));
                continue;
              }
            }
            console.warn(`Rate limit cooling pause for ${(backoffDelay / 1000).toFixed(1)}s (attempt ${attempt + 1}/${maxAttempts})...`);
            await new Promise(r => setTimeout(r, backoffDelay));
            backoffDelay = Math.min(backoffDelay * 1.5, 10000);
            continue;
          }
          throw err;
        }
      }
    };

    const translateChunk = async (text, opts) => {
      switch (opts.provider) {
        case 'deepseek': return translateDeepSeek(text, opts);
        case 'deepl': return translateDeepL(text, opts);
        case 'libre': return translateLibre(text, opts);
        default: return translateGemini(text, { ...opts, context: opts.context });
      }
    };

    const formatModelName = (id, displayName) => {
      if (displayName && displayName !== id && !displayName.startsWith('models/')) return displayName;
      if (id.startsWith('gemini-')) {
        return id
          .split('-')
          .map((part, idx) => {
            if (idx === 0) return 'Gemini';
            if (/^\d+(\.\d+)?$/.test(part)) return part;
            if (part.toLowerCase() === '8b') return '8B';
            return part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join(' ');
      }
      if (id.startsWith('gemma-')) {
        return id
          .split('-')
          .map((part, idx) => {
            if (idx === 0) return 'Gemma';
            return part.toUpperCase();
          })
          .join(' ');
      }
      return id.split('-').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
    };

    const groupModelsByCompany = (models) => {
      const groups = {
        '⭐ RECOMMENDED FREE TIER': [],
        '👑 FLAGSHIP & DEEP REASONING': [],
        '⚡ ULTRA FAST & LITE': [],
        '🧪 OTHER & OPEN WEIGHTS': []
      };

      for (const m of models) {
        const id = (m.id || '').toLowerCase();
        const name = (m.name || '').toLowerCase();

        if (id === 'gemini-2.5-flash' || id === 'gemini-2.0-flash' || id === 'gemini-1.5-flash' || name.includes('recommended free tier') || name.includes('fast & stable') || name.includes('highest free quota')) {
          groups['⭐ RECOMMENDED FREE TIER'].push(m);
        } else if (id.includes('pro') || id.startsWith('gemini-3.7') || (id.startsWith('gemini-3.5-flash') && !id.includes('lite')) || name.includes('flagship') || name.includes('literary')) {
          groups['👑 FLAGSHIP & DEEP REASONING'].push(m);
        } else if (id.includes('lite') || id.includes('8b') || id.includes('nano') || name.includes('lite') || name.includes('lowest cost') || name.includes('high speed')) {
          groups['⚡ ULTRA FAST & LITE'].push(m);
        } else {
          groups['🧪 OTHER & OPEN WEIGHTS'].push(m);
        }
      }

      return Object.entries(groups).filter(([_, list]) => list.length > 0);
    };

    const fetchGeminiModels = async (apiKey) => {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}&pageSize=100`);
      if (!r.ok) throw new Error('Failed to fetch models');
      const j = await r.json();
      const valid = (j.models || [])
        .filter(m => m.supportedGenerationMethods?.includes('generateContent') &&
          !m.name.includes('embedding') &&
          !m.name.includes('aqa') &&
          !m.name.includes('imagen') &&
          !m.name.includes('tts') &&
          !m.name.includes('audio') &&
          !m.name.includes('bison') &&
          !m.name.includes('gecko'))
        .map(m => {
          const id = m.name.replace('models/', '');
          return { id, name: formatModelName(id, m.displayName) };
        });

      // Sort models logically: Recommended -> Flagship -> Lite
      valid.sort((a, b) => {
        const getRank = id => {
          if (id === 'gemini-2.5-flash') return -40;
          if (id === 'gemini-2.0-flash') return -39;
          if (id === 'gemini-1.5-flash') return -38;
          if (id === 'gemini-2.5-pro') return -37;
          if (id.startsWith('gemini-3.7-flash')) return -36;
          if (id.startsWith('gemini-3.5-flash-lite')) return -35;
          if (id.startsWith('gemini-3.5-flash')) return -34;
          if (id.startsWith('gemini-1.5-flash-8b')) return -33;
          if (id.startsWith('gemini-3.1-pro')) return -32;
          if (id.startsWith('gemini-3-flash')) return -31;
          return 0;
        };
        return getRank(a.id) - getRank(b.id);
      });
      return valid;
    };

            return updated;
          });
          if (activeKeyIds[prov] === id) {
            setActiveKeyIds(prev => {

      // --- Resizable Text Boxes Height State (Touch & Desktop) ---
      const [inputBoxHeight, setInputBoxHeight] = useState(() => parseInt(localStorage.getItem('inputBoxHeight'), 10) || 220);
      const [outputBoxHeight, setOutputBoxHeight] = useState(() => parseInt(localStorage.getItem('outputBoxHeight'), 10) || 250);
      const [instructionsBoxHeight, setInstructionsBoxHeight] = useState(() => parseInt(localStorage.getItem('instructionsBoxHeight'), 10) || 80);
      const [glossaryBoxHeight, setGlossaryBoxHeight] = useState(() => parseInt(localStorage.getItem('glossaryBoxHeight'), 10) || 140);

      const handleTouchResizeStart = (e, boxType) => {
        const touch = e.touches && e.touches[0];
        if (!touch) return;
        const startY = touch.clientY;
        const initialHeights = {
          input: inputBoxHeight,
          output: outputBoxHeight,
          instructions: instructionsBoxHeight,
          glossary: glossaryBoxHeight
        };
        const minHeights = { input: 120, output: 120, instructions: 50, glossary: 80 };
        const maxHeights = { input: 3500, output: 3500, instructions: 1200, glossary: 2500 };
        const startH = initialHeights[boxType] || 200;
        let lastH = startH;

        const onTouchMove = (moveEvt) => {
          const curTouch = moveEvt.touches && moveEvt.touches[0];
          if (!curTouch) return;
          const delta = (curTouch.clientY - startY) * 1.85;
          const newH = Math.max(minHeights[boxType] || 80, Math.min(maxHeights[boxType] || 2500, Math.round(startH + delta)));
          lastH = newH;
          if (boxType === 'input') setInputBoxHeight(newH);
          else if (boxType === 'output') setOutputBoxHeight(newH);
          else if (boxType === 'instructions') setInstructionsBoxHeight(newH);
          else if (boxType === 'glossary') setGlossaryBoxHeight(newH);
        };

        const onTouchEnd = () => {
          window.removeEventListener('touchmove', onTouchMove);
          window.removeEventListener('touchend', onTouchEnd);
          localStorage.setItem(`${boxType}BoxHeight`, lastH);
        };

        window.addEventListener('touchmove', onTouchMove, { passive: true });
        window.addEventListener('touchend', onTouchEnd, { passive: true });
      };

      const setBoxPreset = (boxType, preset) => {
        const refs = {
          input: inputRef,
          output: outputRef,
          instructions: instructionsRef,
          glossary: glossaryRef
        };
        const defaults = { input: 220, output: 250, instructions: 80, glossary: 140 };
        const talls = { input: 820, output: 820, instructions: 380, glossary: 600 };

        let targetH = defaults[boxType];
        if (preset === 'S') targetH = defaults[boxType];
        else if (preset === 'auto') {
          const el = refs[boxType]?.current;
          if (el) {
            targetH = Math.max(defaults[boxType], Math.min(4000, el.scrollHeight + 25));
          } else {
            targetH = talls[boxType];
          }
        }

        if (boxType === 'input') setInputBoxHeight(targetH);
        else if (boxType === 'output') setOutputBoxHeight(targetH);
        else if (boxType === 'instructions') setInstructionsBoxHeight(targetH);
        else if (boxType === 'glossary') setGlossaryBoxHeight(targetH);
        localStorage.setItem(`${boxType}BoxHeight`, targetH);
      };

      const toggleBoxExpand = (boxType) => {
        const defaults = { input: 220, output: 250, instructions: 80, glossary: 140 };
        const expanded = { input: 750, output: 750, instructions: 350, glossary: 550 };
        const curHeights = {
          input: inputBoxHeight,
          output: outputBoxHeight,
          instructions: instructionsBoxHeight,
          glossary: glossaryBoxHeight
        };
        const cur = curHeights[boxType] || defaults[boxType];
        const target = (cur >= expanded[boxType] - 60) ? defaults[boxType] : expanded[boxType];
        
        if (boxType === 'input') setInputBoxHeight(target);

              if (useContext) { ctx = streamRes.newContext || ctx; }
              if (streamRes?.usage) {

                }

                        const isVisible = showKeys[k.id] || false;
                        return h('div', {
                          key: k.id,
                          className: `p-3.5 rounded-xl border transition-all ${isActive ? 'border-indigo-400/90 dark:border-indigo-600 bg-white dark:bg-slate-900 shadow-sm' : 'border-slate-200 dark:border-slate-800 bg-slate-50/60 dark:bg-slate-950/40'}`
                        },
                          h('div', { className: 'flex items-center justify-between gap-2 mb-2' },
                            h('input', {
                              type: 'text',
                              value: k.name || '',
                              onChange: e => updateApiKey(provider, k.id, 'name', e.target.value),
                              placeholder: 'Profile name (e.g. Primary, Work, Backup)...',
                              className: 'text-xs font-bold text-slate-800 dark:text-slate-200 bg-transparent border-b border-transparent hover:border-slate-300 dark:hover:border-slate-700 focus:border-indigo-500 focus:outline-none px-1 py-0.5 min-w-0 flex-1'
                            }),
                            h('div', { className: 'flex items-center gap-1.5 shrink-0' },
                              isActive ?
                                h('span', { className: 'px-2.5 py-0.5 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 text-[10px] font-bold rounded-full border border-emerald-300 dark:border-emerald-700 flex items-center gap-1' }, ic(Check, 10), 'Active Key') :
                                btn({
                                  onClick: () => setActiveKey(provider, k.id),
                                  className: 'px-2.5 py-0.5 bg-slate-200 dark:bg-slate-800 hover:bg-indigo-600 hover:text-white text-slate-700 dark:text-slate-300 text-[10px] font-bold rounded-full transition-all cursor-pointer'
                                }, 'Set Active'),
                              btn({
                                onClick: () => deleteApiKey(provider, k.id),
                                className: 'p-1 text-slate-400 hover:text-rose-500 transition-colors cursor-pointer',
                                title: 'Delete Key Profile'
                              }, ic(Trash2, 13))
                            )
                          ),
                          h('div', { className: 'relative' },
                            h('input', {
                              type: isVisible ? 'text' : 'password',
                              value: k.key || '',
                              onChange: e => updateApiKey(provider, k.id, 'key', e.target.value),
                              placeholder: `Enter ${provider.toUpperCase()} API Key...`,
                              className: 'w-full p-2 pr-9 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg text-xs font-mono text-slate-900 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500'
                            }),
                            h('button', {
                              type: 'button',
                              onClick: () => setShowKeys(prev => ({ ...prev, [k.id]: !isVisible })),
                              className: 'absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer'
                            }, ic(isVisible ? EyeOff : Eye, 14))
                          )
                        );
                      })
                  )
                ),

                // Backup & Restore Card
                h('div', { className: 'pt-4 border-t border-slate-200 dark:border-slate-800 space-y-3' },
                  h('div', { className: 'flex items-center justify-between' },
                    h('div', { className: 'flex items-center gap-2' },
                      h('label', { className: 'text-sm font-bold text-slate-800 dark:text-slate-200' }, 'Backup & Restore All Data'),
                      h(InfoTooltip, {
                        title: 'Full Application Backup & Migration',
                        text: 'Export all your glossaries, translation histories, and settings to a JSON file. You can migrate everything to another phone, laptop, or browser seamlessly.',
                        tip: 'Enable "Include API Keys" if you want to migrate your saved API key profiles without re-entering them.'
                      })
                    )
                  ),
                  h('p', { className: 'text-xs text-slate-500 dark:text-slate-400 font-medium' }, 'Migrate your entire setup (glossaries, translation history, preferences, and API key profiles) between your laptop and phone.'),

                  h('div', { className: 'flex flex-wrap gap-2 pt-1' },
                    btn({
                      onClick: () => exportFullBackup(true),
                      className: 'px-3.5 sm:px-4 py-2 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white text-xs font-bold rounded-xl shadow-md shadow-amber-500/20 hover:shadow-amber-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all inline-flex items-center gap-1.5 cursor-pointer'
                    }, ic(Key, 14), 'Export Backup (+ API Keys)'),
                    btn({
                      onClick: () => exportFullBackup(false),
                      className: 'px-3.5 sm:px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl shadow-sm hover:-translate-y-0.5 active:translate-y-0 transition-all inline-flex items-center gap-1.5 cursor-pointer'
                    }, ic(Shield, 14), 'Export (No Keys)'),
                    h('label', {
                      className: 'px-3.5 sm:px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-bold rounded-xl shadow-md shadow-purple-500/20 hover:shadow-purple-500/30 hover:-translate-y-0.5 active:translate-y-0 transition-all inline-flex items-center gap-1.5 cursor-pointer'
                    },
                      ic(Upload, 14),
                      'Restore From File',
                      h('input', {
                        type: 'file',
                        onChange: importFullBackup,
                        className: 'hidden',
                        accept: '.json,application/json,text/plain,text/json,application/octet-stream,*/*'
                      })
                    ),
                    btn({
                      onClick: pasteAndRestoreBackup,
                      className: 'px-3.5 sm:px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 text-xs font-semibold rounded-xl shadow-sm hover:-translate-y-0.5 active:translate-y-0 transition-all inline-flex items-center gap-1.5 cursor-pointer'
                    }, ic(Clipboard, 14), 'Paste JSON')
                  )
                )
              )
            )
          )
          ), // Closes activeTab === 'text'
        ),

        // TAB: HISTORY
        activeTab === 'history' && h('div', { className: 'space-y-4' },
          h('div', { className: 'flex flex-wrap items-center justify-between gap-3' },
            h('div', { className: 'flex items-center gap-2' },
              h('h2', { className: 'text-xl font-bold text-slate-800 dark:text-slate-200' }, 'Translation History'),
              history.length > 0 && h('span', { className: 'px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200/80 dark:border-indigo-800/60' }, `${history.length} items`)
            ),
            h('div', { className: 'flex flex-wrap items-center gap-2' },
              history.length > 0 && btn({
                onClick: exportHistoryJSON,
                className: 'px-3.5 py-1.5 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white text-xs font-bold rounded-lg shadow-sm hover:-translate-y-0.5 active:translate-y-0 transition-all inline-flex items-center gap-1.5 cursor-pointer',
                title: 'Export full history as a downloadable JSON file'
              }, ic(Download, 14), 'Export History (JSON)'),
              history.length > 0 && btn({
                onClick: clearHistory,
                className: 'px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold rounded-lg shadow-sm hover:-translate-y-0.5 active:translate-y-0 transition-all inline-flex items-center gap-1 cursor-pointer'
              }, ic(Trash2, 14), 'Clear All')
            )
          ),
          history.length > 0 && h('div', { className: 'relative' },
            h('input', {
              type: 'text',
              value: historySearch,
              onChange: e => setHistorySearch(e.target.value),
              placeholder: 'Search history by keyword or language...',
              className: 'w-full p-2.5 pl-9 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500'
            }),
            h('span', { className: 'absolute left-3 top-1/2 -translate-y-1/2 text-gray-400' }, ic(Search, 15))
          ),
          history.length === 0 ? h('p', { className: 'text-gray-500 dark:text-gray-400 text-center py-8' }, 'No translation history yet.') :
            (() => {
              const filtered = history.filter(h => {
                if (!historySearch.trim()) return true;
                const q = historySearch.toLowerCase();
                return (h.inputPreview && h.inputPreview.toLowerCase().includes(q)) ||
                  (h.outputPreview && h.outputPreview.toLowerCase().includes(q)) ||
                  (h.provider && h.provider.toLowerCase().includes(q)) ||
                  (h.tgtLang && h.tgtLang.toLowerCase().includes(q));
              });

              if (filtered.length === 0) {
                return h('p', { className: 'text-gray-400 text-center py-6 text-sm' }, `No history matches "${historySearch}".`);
              }

              return h('div', { className: 'space-y-3' }, filtered.map(entry =>
                h('div', { key: entry.id, className: 'p-4 bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800' },
                  h('div', { className: 'flex flex-wrap items-center justify-between gap-2 mb-2' },
                    h('div', { className: 'flex flex-wrap items-center gap-2 text-xs text-gray-500' },
                      h('span', { className: 'font-semibold text-indigo-600 dark:text-indigo-400' }, entry.provider),
                      h('span', null, '·'),
                      h('span', null, `${entry.srcLang || 'Auto'} → ${entry.tgtLang}`),
                      entry.stats && h('span', { className: 'inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-semibold bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50' },
                        ic(Sparkles, 11),
                        `${entry.stats.totalTokens.toLocaleString()} tok · ${entry.stats.cost}${entry.stats.duration ? ' · ' + entry.stats.duration : ''}`
                      ),
                      h('span', null, '·'),
                      h('span', null, new Date(entry.ts).toLocaleString())
                    ),
                    h('div', { className: 'flex flex-wrap items-center gap-1.5' },
                      btn({ onClick: () => loadFromHistory(entry), className: 'px-2.5 py-1 text-xs bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-500 transition-all cursor-pointer inline-flex items-center gap-1' }, ic(Upload, 12), 'Load'),
                      btn({ onClick: () => { if (entry.fullOutput || entry.outputPreview) copyText(entry.fullOutput || entry.outputPreview).then(() => toast('Copied translation!')); }, className: 'px-2.5 py-1 text-xs bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-300 dark:border-slate-700 font-semibold rounded-md hover:bg-slate-200 dark:hover:bg-slate-700 transition-all cursor-pointer inline-flex items-center gap-1', title: 'Copy translation output' }, ic(Copy, 12), 'Copy'),
                      btn({ onClick: () => exportSingleHistoryItem(entry), className: 'px-2.5 py-1 text-xs bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 border border-teal-200 dark:border-teal-800/60 font-semibold rounded-md hover:bg-teal-100 dark:hover:bg-teal-900/60 transition-all cursor-pointer inline-flex items-center gap-1', title: 'Export this translation as .txt file' }, ic(Download, 12), 'TXT'),
                      btn({ onClick: () => deleteHistoryItem(entry.id), className: 'px-2.5 py-1 text-xs bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/60 rounded-md hover:bg-rose-100 dark:hover:bg-rose-900/60 transition-all cursor-pointer' }, 'Del')
                    )
                  ),
                  h('p', { className: 'text-sm text-gray-600 dark:text-gray-400 line-clamp-2' }, entry.outputPreview || entry.inputPreview)
                )
              ));
            })()
        ),

        // TAB: EPUB STUDIO (SPLIT & MERGE)
        activeTab === 'studio' && h('div', { className: 'space-y-6 max-w-full overflow-hidden' },
          h('div', { className: 'p-4 sm:p-6 bg-white dark:bg-slate-900 sm:backdrop-blur-md rounded-2xl border border-slate-200/80 dark:border-slate-800/80 shadow-sm max-w-full overflow-hidden' },
            h('div', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-200/80 dark:border-slate-800/80' },
              h('div', null,
                h('h2', { className: 'text-xl sm:text-2xl font-black bg-gradient-to-r from-indigo-500 via-purple-500 to-fuchsia-500 bg-clip-text text-transparent flex items-center gap-2.5' },
                  ic(Layers, 24),
                  'EPUB Studio'
                ),
                h('p', { className: 'text-xs text-slate-500 dark:text-slate-400 mt-1' },
                  'Split massive eBooks into lightweight volumes or merge multi-part translations into a single seamless EPUB.'
                )
              ),
              // Sub-tab switcher pills
              h('div', { className: 'inline-flex p-1 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-inner w-full sm:w-auto shrink-0' },
                h('button', {
                  type: 'button',
                  onClick: () => { setStudioSubTab('split'); localStorage.setItem('studioSubTab', 'split'); },
                  className: `flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 sm:px-5 py-2 rounded-lg text-xs font-bold transition-all cursor-pointer ${studioSubTab === 'split' ? 'bg-indigo-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`
                }, ic(Scissors, 14), 'Split EPUB'),
                h('button', {
                  type: 'button',
                  onClick: () => { setStudioSubTab('merge'); localStorage.setItem('studioSubTab', 'merge'); },
                  className: `flex-1 sm:flex-initial flex items-center justify-center gap-2 px-4 sm:px-5 py-2 rounded-lg text-xs font-bold transition-all cursor-pointer ${studioSubTab === 'merge' ? 'bg-fuchsia-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}`
                }, ic(Rows2, 14), 'Merge EPUB')
              )
            ),

            // Subtab views
            studioSubTab === 'split' ?
              h('div', { dangerouslySetInnerHTML: { __html: window.splitHtml || (typeof splitHtml !== 'undefined' ? splitHtml : '') } }) :
              h('div', { dangerouslySetInnerHTML: { __html: window.mergeHtml || (typeof mergeHtml !== 'undefined' ? mergeHtml : '') } })
          )
        ),

        // Error display
        error && h('div', { className: 'flex items-center justify-between p-4 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 rounded-r-lg', 'role': 'alert' },
          h('p', { className: 'text-sm font-medium text-red-700 dark:text-red-400' }, error),
          btn({ onClick: () => setError(''), className: 'text-red-500 hover:text-red-700 cursor-pointer', 'aria-label': 'Dismiss error' }, ic(X, 18))
        )
      ),

        // TOASTS
        h('div', { className: 'fixed bottom-4 right-4 z-50 space-y-2', role: 'status', 'aria-live': 'polite' },
          toasts.map(t => h('div', { key: t.id, className: `toast-enter flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium ${t.type === 'error' ? 'bg-red-600 text-white' : t.type === 'info' ? 'bg-blue-600 text-white' : 'bg-green-600 text-white'}` },
            ic(t.type === 'error' ? AlertCircle : t.type === 'info' ? Info : CheckCircle2, 16), t.msg
          ))
        ),

        // MODAL
        showModal && h('div', { className: 'fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4', role: 'dialog', 'aria-modal': 'true' },
          h('div', { className: 'bg-white dark:bg-gray-800 rounded-xl shadow-2xl p-6 max-w-sm w-full space-y-4' },
            h('p', { className: 'text-lg font-semibold text-center' }, modalMessage),
            h('div', { className: 'flex justify-center gap-3' },
              btn({ onClick: () => { if (modalCallback) modalCallback() }, className: 'px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold cursor-pointer' }, 'Confirm'),
              btn({ onClick: () => { setShowModal(false); setModalCallback(null) }, className: 'px-6 py-2 bg-gray-200 dark:bg-gray-600 text-gray-800 dark:text-gray-200 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-500 font-semibold cursor-pointer' }, 'Cancel')
            )
          )
        ),

        // READER VIEW MODAL
        h(ReaderModal, {
          open: readerOpen,
          onClose: () => setReaderOpen(false),
          text: assembledText,
          chapters: translatedChapters,
          currentIdx: readerChapterIdx,
          onChapterChange: setReaderChapterIdx,
          theme: readerTheme,
          setTheme: setReaderTheme,
          font: readerFont,
          setFont: setReaderFont,
          fontSize: readerFontSize,
          setFontSize: setReaderFontSize,
          tgtLang
        }),

        // EPUB STUDIO PREVIEW MODAL
        h('div', { dangerouslySetInnerHTML: { __html: modalHtml } }),

        // FOOTER
        h('footer', { className: 'text-center text-xs text-slate-400 dark:text-slate-600 py-4' }, 'Gemini Translator v', VERSION, ' · Powered by Gemini, DeepSeek, DeepL & LibreTranslate')
      )
    }

    const root = document.getElementById('root');
    if (root) ReactDOM.createRoot(root).render(h(ErrorBoundary, null, h(App)));
  </script>
  <script>
    if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }).catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>

</html>
