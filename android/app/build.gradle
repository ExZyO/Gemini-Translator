apply plugin: 'com.android.application'

android {
    namespace "com.exzyo.geminitranslator"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.exzyo.geminitranslator"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8415
        versionName "8.21.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        // Persistent signing key — credentials loaded from local keystore.properties (not tracked by git)
        release {
            def keystorePropsFile = file("${rootProject.projectDir}/keystore.properties")
            if (keystorePropsFile.exists()) {
                def keystoreProps = new Properties()
                keystoreProps.load(new FileInputStream(keystorePropsFile))
                storeFile file("${rootProject.projectDir}/${keystoreProps['storeFile']}")
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            } else {
                // CI or environment without custom release keystore: ensure a valid fallback keystore exists so release build succeeds
                def fallbackKeystore = file("${rootProject.buildDir}/ci-fallback.keystore")
                if (!fallbackKeystore.exists()) {
                    fallbackKeystore.parentFile.mkdirs()
                    def keytoolCmd = [
                        'keytool', '-genkeypair', '-alias', 'androiddebugkey',
                        '-keypass', 'android', '-keystore', fallbackKeystore.absolutePath,
                        '-storepass', 'android', '-dname', 'CN=Android Debug,O=Android,C=US',
                        '-keyalg', 'RSA', '-keysize', '2048', '-validity', '10000'
                    ]
                    try {
                        keytoolCmd.execute().waitFor()
                    } catch (Exception e) {
                        println "Notice: Could not auto-generate fallback keystore: ${e.message}"
                    }
                }
                if (fallbackKeystore.exists()) {
                    storeFile fallbackKeystore
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                } else {
                    initWith(signingConfigs.debug)
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
