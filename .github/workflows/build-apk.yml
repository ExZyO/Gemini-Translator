name: 🤖 Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 📦 Compile High-Speed Release .apk
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 with Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟩 Set up Node.js 22 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: 🌐 Prepare Web Assets
        run: node build-www.js

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: 🔑 Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release signing keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/gemini-release.keystore
            printf "storeFile=gemini-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
          else
            echo "Warning: Release signing secrets not found. Falling back to debug keystore."
          fi

      - name: ⚡ Build Optimized Release APK
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore ~/.android/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
          cp -f ~/.android/debug.keystore ~/.config/.android/debug.keystore || true
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel

      - name: 🔍 Verify Release APK Signature
        run: |
          echo "Verifying APK signing certificate..."
          keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk

      - name: 📱 Prepare APK for Direct Download
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/GeminiTranslator.apk

      - name: 🏷️ Read Version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 🚀 Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/GeminiTranslator.apk
            android/app/build/outputs/apk/release/app-release.apk
          tag_name: v${{ steps.pkg_version.outputs.version }}
          name: "📱 Gemini Translator v${{ steps.pkg_version.outputs.version }}"
          body: |
            ## 📱 Gemini Translator v${{ steps.pkg_version.outputs.version }}
            Direct APK download: tap **GeminiTranslator.apk** below to install directly!

            Version: v${{ steps.pkg_version.outputs.version }} • Build #${{ github.run_number }} • ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Update 'latest' Release Tag (Backwards Compatibility)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/GeminiTranslator.apk
            android/app/build/outputs/apk/release/app-release.apk
          tag_name: latest
          name: "📱 Gemini Translator v${{ steps.pkg_version.outputs.version }} — Latest Android APK"
          body: |
            ## 📱 Direct APK Download (v${{ steps.pkg_version.outputs.version }})
            Tap **GeminiTranslator.apk** below to download directly — no unzipping needed!

            Version: v${{ steps.pkg_version.outputs.version }} • Build #${{ github.run_number }} • ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
