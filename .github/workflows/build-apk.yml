name: 🤖 Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: 📦 Compile High-Speed Release .apk
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟩 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🌐 Prepare Web Assets
        run: node build-www.js

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: ⚡ Build Optimized Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiTranslator-Android-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📱 Rename APK for Direct Download
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/GeminiTranslator.apk

      - name: 🚀 Publish Direct APK Download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/GeminiTranslator.apk
          tag_name: latest
          name: "📱 Gemini Translator — Latest Android APK"
          body: |
            ## 📱 Direct APK Download
            Tap **GeminiTranslator.apk** below to download directly — no unzipping needed!

            Build #${{ github.run_number }} • ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
