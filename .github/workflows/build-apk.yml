name: 🤖 Build Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 📦 Compile High-Speed Release .apk
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 with Gradle Cache
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🟩 Set up Node.js 22 with npm Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install Node Dependencies (Cached)
        run: npm ci --prefer-offline || npm install

      - name: 🌐 Prepare Web Assets
        run: node build-www.js

      - name: 🔄 Sync Capacitor Android Platform
        run: npx cap sync android

      - name: ⚡ Build Optimized Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel

      - name: 📱 Prepare APK for Direct Download
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/GeminiTranslator.apk

      - name: 🏷️ Read Version from package.json
        id: pkg_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 🚀 Publish Direct APK Download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/GeminiTranslator.apk
          tag_name: latest
          name: "📱 Gemini Translator v${{ steps.pkg_version.outputs.version }} — Latest Android APK"
          body: |
            ## 📱 Direct APK Download (v${{ steps.pkg_version.outputs.version }})
            Tap **GeminiTranslator.apk** below to download directly — no unzipping needed!

            Version: v${{ steps.pkg_version.outputs.version }} • Build #${{ github.run_number }} • ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
